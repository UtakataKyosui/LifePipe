name: lifepipe

# Homebox・Memos・Vikunja・Wardrowbe は共有 Postgres の論理DBを使う。
# Grocy・Wallos は SQLite 専用のため、それぞれの名前付きボリュームに保存する。
x-wardrowbe-env: &wardrowbe-env
  DATABASE_URL: postgresql+asyncpg://wardrowbe:${WARDROWBE_DB_PASSWORD}@postgres:5432/wardrowbe
  REDIS_URL: redis://redis:6379
  SECRET_KEY: ${WARDROWBE_SECRET_KEY:?Set WARDROWBE_SECRET_KEY in .env}
  STORAGE_PATH: /data/uploads
  APP_URL: http://localhost:${WARDROWBE_PORT:-8080}
  DEBUG: ${WARDROWBE_DEBUG:-true}
  AI_BASE_URL: ${WARDROWBE_AI_BASE_URL:-http://host.docker.internal:11434/v1}
  AI_API_KEY: ${WARDROWBE_AI_API_KEY:-}
  AI_VISION_MODEL: ${WARDROWBE_AI_VISION_MODEL:-llava}
  AI_TEXT_MODEL: ${WARDROWBE_AI_TEXT_MODEL:-llama3}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      HOMEBOX_DB_PASSWORD: ${HOMEBOX_DB_PASSWORD:?Set HOMEBOX_DB_PASSWORD in .env}
      MEMOS_DB_PASSWORD: ${MEMOS_DB_PASSWORD:?Set MEMOS_DB_PASSWORD in .env}
      VIKUNJA_DB_PASSWORD: ${VIKUNJA_DB_PASSWORD:?Set VIKUNJA_DB_PASSWORD in .env}
      WARDROWBE_DB_PASSWORD: ${WARDROWBE_DB_PASSWORD:?Set WARDROWBE_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lifepipe

  homebox:
    build:
      context: ./submodules/homebox
      dockerfile: ../../docker/homebox/Dockerfile
    restart: unless-stopped
    environment:
      HBOX_DATABASE_DRIVER: postgres
      HBOX_DATABASE_HOST: postgres
      HBOX_DATABASE_PORT: "5432"
      HBOX_DATABASE_DATABASE: homebox
      HBOX_DATABASE_USERNAME: homebox
      HBOX_DATABASE_PASSWORD: ${HOMEBOX_DB_PASSWORD}
      HBOX_DATABASE_SSL_MODE: disable
      HBOX_AUTH_API_KEY_PEPPER: ${HOMEBOX_API_KEY_PEPPER:?Set HOMEBOX_API_KEY_PEPPER in .env}
    volumes:
      - homebox_data:/data
    ports:
      - "127.0.0.1:${HOMEBOX_PORT:-3100}:7745"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lifepipe

  memos:
    build:
      context: ./submodules/memos
      dockerfile: ../../docker/memos/Dockerfile
    restart: unless-stopped
    environment:
      MEMOS_DRIVER: postgres
      MEMOS_DSN: postgres://memos:${MEMOS_DB_PASSWORD}@postgres:5432/memos?sslmode=disable
    volumes:
      - memos_data:/var/opt/memos
    ports:
      - "127.0.0.1:${MEMOS_PORT:-5230}:5230"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lifepipe

  vikunja:
    build:
      context: ./submodules/vikunja
      dockerfile: ../../docker/vikunja/Dockerfile
    restart: unless-stopped
    environment:
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_HOST: postgres
      VIKUNJA_DATABASE_DATABASE: vikunja
      VIKUNJA_DATABASE_USER: vikunja
      VIKUNJA_DATABASE_PASSWORD: ${VIKUNJA_DB_PASSWORD}
      VIKUNJA_DATABASE_SSLMODE: disable
      VIKUNJA_SERVICE_JWTSECRET: ${VIKUNJA_JWT_SECRET:?Set VIKUNJA_JWT_SECRET in .env}
      VIKUNJA_SERVICE_PUBLICURL: http://localhost:${VIKUNJA_PORT:-3456}/
    volumes:
      - vikunja_files:/app/vikunja/files
    ports:
      - "127.0.0.1:${VIKUNJA_PORT:-3456}:3456"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lifepipe

  grocy:
    build:
      context: ./submodules/grocy
      dockerfile: ../../docker/grocy/Dockerfile
      additional_contexts:
        config: ./docker/grocy
    restart: unless-stopped
    environment:
      GROCY_MODE: production
    volumes:
      - grocy_data:/var/www/html/data
    ports:
      - "127.0.0.1:${GROCY_PORT:-8081}:80"
    networks:
      - lifepipe

  wallos:
    build:
      context: ./submodules/Wallos
      dockerfile: ../../docker/wallos/Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      - wallos_db:/var/www/html/db
      - wallos_logos:/var/www/html/images/uploads/logos
    ports:
      - "127.0.0.1:${WALLOS_PORT:-8282}:80"
    networks:
      - lifepipe

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lifepipe

  wardrowbe-migrate:
    build:
      context: ./submodules/wardrowbe/backend
      dockerfile: ../../../docker/wardrowbe/Dockerfile.backend
    image: lifepipe-wardrowbe-backend
    command: alembic upgrade head
    restart: "no"
    environment: *wardrowbe-env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lifepipe

  wardrowbe-backend:
    image: lifepipe-wardrowbe-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *wardrowbe-env
    volumes:
      - wardrowbe_uploads:/data/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      wardrowbe-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - lifepipe

  wardrowbe-worker:
    image: lifepipe-wardrowbe-backend
    command: arq app.workers.worker.WorkerSettings
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *wardrowbe-env
    volumes:
      - wardrowbe_uploads:/data/uploads
    depends_on:
      wardrowbe-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - lifepipe

  wardrowbe-image-worker:
    image: lifepipe-wardrowbe-backend
    command: arq app.workers.image_worker.ImageWorkerSettings
    restart: unless-stopped
    environment: *wardrowbe-env
    volumes:
      - wardrowbe_uploads:/data/uploads
      - wardrowbe_rembg_models:/opt/rembg/models
    depends_on:
      wardrowbe-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - lifepipe

  wardrowbe-frontend:
    build:
      context: ./submodules/wardrowbe/frontend
      dockerfile: ../../../docker/wardrowbe/Dockerfile.frontend
    restart: unless-stopped
    environment:
      NEXTAUTH_URL: http://localhost:${WARDROWBE_PORT:-8080}
      NEXTAUTH_SECRET: ${WARDROWBE_NEXTAUTH_SECRET:?Set WARDROWBE_NEXTAUTH_SECRET in .env}
      BACKEND_URL: http://wardrowbe-backend:8000
    depends_on:
      - wardrowbe-backend
    networks:
      lifepipe:
        aliases:
          - frontend

  wardrowbe-nginx:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      NGINX_AI_TIMEOUT: "600"
      NGINX_CLIENT_MAX_BODY_SIZE: 50M
      BACKEND_HOST: wardrowbe-backend
      BACKEND_INTERNAL_PORT: "8000"
    volumes:
      - ./submodules/wardrowbe/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./submodules/wardrowbe/nginx/templates:/etc/nginx/templates:ro
    command: >
      /bin/sh -c "envsubst '$${NGINX_AI_TIMEOUT} $${NGINX_CLIENT_MAX_BODY_SIZE} $${BACKEND_HOST} $${BACKEND_INTERNAL_PORT}'
      < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf
      && exec nginx -g 'daemon off;'"
    ports:
      - "127.0.0.1:${WARDROWBE_PORT:-8080}:80"
    depends_on:
      - wardrowbe-frontend
      - wardrowbe-backend
    networks:
      - lifepipe

volumes:
  postgres_data:
  homebox_data:
  memos_data:
  vikunja_files:
  grocy_data:
  wallos_db:
  wallos_logos:
  redis_data:
  wardrowbe_uploads:
  wardrowbe_rembg_models:

networks:
  lifepipe:
    driver: bridge
