                format: uuid
              replaced_by_id:
                type: string
                format: uuid
                nullable: true
              currency:
                type: string
                pattern: "^[A-Z]{3}$"
              monthly_amount:
                type: string
                pattern: "^-?\\d+(\\.\\d{1,4})?$"
                description: 節約額。乗り換え先の方が高ければ負になる。
