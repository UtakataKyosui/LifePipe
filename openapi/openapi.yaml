      description: タグ名（`#` を含めない）。指定タグと子孫タグを持つメモが該当し、複数指定は OR（NOT-BR-06）。
      style: form
      explode: true
      schema:
        type: array
        items:
          "$ref": "#/components/schemas/NotesTagName"
    NotesUntagged:
      name: untagged
      in: query
      required: false
      description: true ならタグを 1 つも持たないメモだけを返す（NOT-BR-06）。tags との同時指定は 400。
      schema:
        type: boolean
    NotesFrom:
      name: from
      in: query
      required: false
      description: 期間の開始（この日時を含む）。タイムゾーン付きの RFC 3339（NOT-BR-21）。
      schema:
        type: string
        format: date-time
    NotesTo:
      name: to
      in: query
      required: false
      description: 期間の終了（この日時を含まない）。タイムゾーン付きの RFC 3339（NOT-BR-21）。
      schema:
        type: string
        format: date-time
    NotesTimeFieldQuery:
      name: time_field
      in: query
      required: false
      description: 期間の絞り込みと並べ替えの基準にする日時。既定は created_at（NOT-BR-21, NOT-BR-23）。
      schema:
        allOf:
        - "$ref": "#/components/schemas/NotesTimeField"
        default: created_at
    NotesState:
      name: state
      in: query
      required: false
      description: 状態。既定は NORMAL（NOT-BR-11）。
      schema:
        allOf:
        - "$ref": "#/components/schemas/NotesNoteState"
        default: NORMAL
    NotesIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 冪等キー。Note.external_ref として保存し、同じ所有者の中で一意（NOT-BR-26）。
      schema:
        "$ref": "#/components/schemas/NotesExternalRef"
    NotesPurchaseIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 取り込みの冪等キー（例としてレシートの取り込み ID）。Note.external_ref として保存する（NOT-BR-26）。
      schema:
        "$ref": "#/components/schemas/NotesExternalRef"
    SubscriptionsSubscriptionId:
      name: subscription_id
      in: path
      required: true
      description: サブスクリプションの ID。
      schema:
        type: string
        format: uuid
    SubscriptionsCategoryId:
      name: category_id
      in: path
      required: true
      description: カテゴリの ID。
      schema:
        type: string
        format: uuid
    SubscriptionsPaymentMethodId:
      name: payment_method_id
      in: path
      required: true
      description: 支払い方法の ID。
      schema:
        type: string
        format: uuid
    SubscriptionsHouseholdMemberId:
      name: household_member_id
      in: path
      required: true
      description: 世帯メンバーの ID。
      schema:
        type: string
        format: uuid
    SubscriptionsFolderId:
      name: folder_id
      in: path
      required: true
      description: フォルダの ID。
      schema:
        type: string
        format: uuid
    SubscriptionsFrom:
      name: from
      in: query
      required: false
      description: 期間の開始日（含む）。既定は利用者のタイムゾーンでの当日（SUB-BR-12）。
      schema:
        type: string
        format: date
    SubscriptionsTo:
      name: to
      in: query
      required: false
      description: 期間の終了日（含む）。既定は `from + 7 日`。`from <= to` かつ長さ 366 日以内（SUB-BR-12）。
      schema:
        type: string
        format: date
  responses:
    BadRequest:
      description: リクエストが不正（パラメータ誤り、形式違反など）
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    Unauthorized:
      description: 認証されていないか、認証トークンが無効または期限切れ
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    NotFound:
      description: 要求されたリソースが存在しないか、権限がないため存在を隠蔽した
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    Conflict:
      description: リソースの状態と競合した（一意性違反、配下リソースの存在など）
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    UnprocessableEntity:
      description: 構文は正しいが、ドメイン業務ルールの制約に違反している
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    NotesUsageLimitExceeded:
      description: 利用上限を超える操作のため拒否した。待っても解消しないため Retry-After は返さない（NOT-BR-28）。
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/NotesUsageLimitExceeded"
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details for HTTP APIs
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
          description: エラーの種類を識別する URI
          example: about:blank
        title:
          type: string
          description: エラーの簡潔な要約
          example: Bad Request
        status:
          type: integer
          description: HTTP ステータスコード
          example: 400
        detail:
          type: string
          description: 人間が読めるエラーの詳細説明
          example: Request validation failed
        instance:
          type: string
          format: uri-reference
          description: エラーが発生した具体的なリソースの URI
        invalid_params:
          type: array
          description: バリデーションエラーの詳細
          items:
            type: object
            required:
            - name
            - reason
            properties:
              name:
                type: string
                description: エラーとなったフィールド名
              reason:
                type: string
                description: エラーの理由
    InventoryWarrantyStatus:
      type: string
      description: 保証の状態（INV-BR-10）
      enum:
      - none
      - active
      - expiring_soon
      - expired
      - lifetime
    InventoryOwnerType:
      type: string
      description: 添付・カスタムフィールドの対象の種類
      enum:
      - item
      - location
    InventoryAttachmentKind:
      type: string
      description: 添付ファイルの用途。写真、取扱説明書、レシート、保証書、その他
      enum:
      - photo
      - manual
      - receipt
      - warranty
      - other
    InventoryCustomFieldType:
      type: string
      description: カスタムフィールドの値の型。MVP は text のみ（INV-BR-20）
      enum:
      - text
    InventoryMaintenanceStatus:
      type: string
      description: メンテナンスの状態（INV-BR-29）
      enum:
      - scheduled
      - completed
      - overdue
    InventoryPurchaseIngestionResultKind:
      type: string
      description: 取り込みの結果。新規作成、既存の更新、重複のため何もしなかった
      enum:
      - created
      - updated
      - skipped
    InventoryItemSort:
      type: string
      description: 物品一覧の並び順のキー
      enum:
      - name
      - created_at
      - updated_at
      - purchase_date
      - warranty_expires
    InventorySortOrder:
      type: string
      description: 並び順の向き
      enum:
      - asc
      - desc
      default: asc
    InventoryLabelOrientation:
      type: string
      enum:
      - portrait
      - landscape
    InventoryLabelElementType:
      type: string
      enum:
      - text
      - barcode
      - rect
      - line
      - image
    InventoryBarcodeType:
      type: string
      description: バーコードの種類。ean13・ean8・upca は数字だけを符号化できる（INV-BR-31）
      enum:
      - qr
      - datamatrix
      - code128
      - code39
      - ean13
      - ean8
      - upca
    InventoryLabelOutputFormat:
      type: string
      enum:
      - png
      - pdf
    InventoryLocationRef:
      type: object
      description: 経路の 1 段分（id と名前）
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    InventoryCustomField:
      type: object
      description: カスタムフィールド。同じ物品・場所の中で名前は重複させない（大文字小文字を区別しない）。値が空のフィールドは保存しない（INV-BR-19）
      required:
      - name
      - type
      - value
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: 消費電力
        type:
          "$ref": "#/components/schemas/InventoryCustomFieldType"
        value:
          type: string
          maxLength: 1000
          description: 値。https:// の URL や Markdown のリンク形式はクライアントがリンクとして表示できる（INV-BR-20）
          example: 1200W
    InventoryMoneyTotal:
      type: object
      description: 通貨ごとの評価額合計（INV-BR-12）
      required:
      - currency
      - amount
      properties:
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          example: JPY
        amount:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
          example: '128000'
    InventoryLocation:
      type: object
      required:
      - id
      - name
      - tag_ids
      - custom_fields
      - path
      - item_count
      - total_value
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: 棚B
        description:
          type: string
          nullable: true
          description: 説明（Markdown）
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: 親の保管場所。null なら最上位
        kind:
          type: string
          nullable: true
          description: 場所の種類の目安（自由入力）
          example: shelf
        notes:
          type: string
          nullable: true
          maxLength: 1000
          description: 備考（Markdown）
        asset_id:
          type: string
          nullable: true
          pattern: "^\\d{3}-\\d{3}$"
          description: 資産番号。null なら番号なし
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
        custom_fields:
          type: array
          items:
            "$ref": "#/components/schemas/InventoryCustomField"
        path:
          type: array
          readOnly: true
          description: 最上位から自分までの祖先の並び（INV-BR-03）
          items:
            "$ref": "#/components/schemas/InventoryLocationRef"
        item_count:
          type: integer
          minimum: 0
          readOnly: true
          description: この場所に直接置かれた物品の数
        total_value:
          type: array
          readOnly: true
          description: 子孫の場所を含む、売却済みでない物品の評価額合計（通貨ごと、INV-BR-12）
          items:
            "$ref": "#/components/schemas/InventoryMoneyTotal"
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    InventoryLocationCreate:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: 親の保管場所。存在しなければ 422（INV-BR-01）
        kind:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
          maxLength: 1000
        asset_id:
          type: string
          nullable: true
          pattern: "^\\d{3}-\\d{3}$"
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
        custom_fields:
          type: array
          items:
            "$ref": "#/components/schemas/InventoryCustomField"
    InventoryLocationUpdate:
      type: object
      description: 送った項目だけを更新する。parent_id の変更が移動（INV-BR-03）
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: 新しい親。null で最上位へ移る。自分自身・子孫は 409（INV-BR-02）
        kind:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
          maxLength: 1000
        asset_id:
          type: string
          nullable: true
          pattern: "^\\d{3}-\\d{3}$"
        tag_ids:
          type: array
          description: 付与するタグ全体で置き換える
          items:
            type: string
            format: uuid
        custom_fields:
          type: array
          description: カスタムフィールド全体で置き換える
          items:
            "$ref": "#/components/schemas/InventoryCustomField"
    InventoryLocationDetail:
      allOf:
      - "$ref": "#/components/schemas/InventoryLocation"
      - type: object
        required:
        - children
        - items
        properties:
          children:
            type: array
            description: 直下の子の場所
            items:
              "$ref": "#/components/schemas/InventoryLocation"
          items:
            type: array
            description: この場所に直接置かれた物品
            items:
              "$ref": "#/components/schemas/InventoryItem"
    InventoryLocationPage:
      type: object
      required:
      - items
      - total
      - page
      - page_size
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/InventoryLocation"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    InventoryLocationTree:
      type: object
      required:
      - roots
      properties:
        roots:
          type: array
          description: 根の保管場所（root_id 指定時はその 1 件）
          items:
            "$ref": "#/components/schemas/InventoryLocationTreeNode"
    InventoryLocationTreeNode:
      type: object
      required:
      - id
      - name
      - children
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          nullable: true
        asset_id:
          type: string
          nullable: true
          pattern: "^\\d{3}-\\d{3}$"
        children:
          type: array
          items:
            "$ref": "#/components/schemas/InventoryLocationTreeNode"
        items:
          type: array
          description: with_items=true のときだけ返す。直接置かれた物品
          items:
            "$ref": "#/components/schemas/InventoryTreeItem"
    InventoryTreeItem:
      type: object
      required:
      - id
      - name
      - quantity
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        quantity:
          type: integer
          minimum: 0
        parent_item_id:
          type: string
          format: uuid
          nullable: true
        asset_id:
          type: string
          nullable: true
          pattern: "^\\d{3}-\\d{3}$"
    InventoryItem:
      type: object
      required:
      - id
      - name
      - location_id
      - quantity
      - lifetime_warranty
      - warranty_status
      - insured
      - archived
      - tag_ids
      - custom_fields
      - location_path
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: ミラーレスカメラ
        description:
          type: string
          nullable: true
          maxLength: 1000
        location_id:
          type: string
          format: uuid
        parent_item_id:
          type: string
          format: uuid
          nullable: true
          description: 親の物品（INV-BR-06）
        quantity:
          type: integer
          minimum: 0
          default: 1
        asset_id:
          type: string
          nullable: true
          pattern: "^\\d{3}-\\d{3}$"
          description: 資産番号。null は番号なし、000-000 は未採番（INV-BR-16）
          example: 000-042
        manufacturer:
          type: string
          nullable: true
        model_number:
          type: string
          nullable: true
        serial_number:
          type: string
          nullable: true
        purchase_date:
          type: string
          format: date
          nullable: true
        purchase_from:
          type: string
          nullable: true
        purchase_price:
          type: string
          nullable: true
          pattern: "^\\d+(\\.\\d{1,4})?$"
          description: 1 個あたりの購入価格。0 以上（INV-BR-11）
          example: '98000'
        currency:
          type: string
          nullable: true
          pattern: "^[A-Z]{3}$"
          description: ISO 4217 の通貨コード。省略時はインスタンスの既定通貨
          example: JPY
        lifetime_warranty:
          type: boolean
          default: false
        warranty_expires:
          type: string
          format: date
          nullable: true
          description: 保証期限（この日まで有効）
        warranty_details:
          type: string
          nullable: true
        warranty_status:
          allOf:
          - "$ref": "#/components/schemas/InventoryWarrantyStatus"
          readOnly: true
        insured:
          type: boolean
          default: false
        sold_date:
          type: string
          format: date
          nullable: true
          description: 売却・譲渡・廃棄した日。入っていれば売却・処分済み（INV-BR-13）
        sold_to:
          type: string
          nullable: true
        sold_price:
          type: string
          nullable: true
          pattern: "^\\d+(\\.\\d{1,4})?$"
          description: 売却価格。0 以上（INV-BR-11）
        sold_notes:
          type: string
          nullable: true
          maxLength: 1000
        archived:
          type: boolean
          default: false
        notes:
          type: string
          nullable: true
          maxLength: 1000
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
        custom_fields:
          type: array
          items:
            "$ref": "#/components/schemas/InventoryCustomField"
        primary_photo_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: 代表写真の添付 ID（INV-BR-22）
        import_ref:
          type: string
          nullable: true
          maxLength: 100
          description: CSV インポートの重複判定キー（INV-BR-24）
        source_ref:
          type: string
          nullable: true
          maxLength: 100
          description: ingest_purchase の重複判定キー（INV-BR-27）
        location_path:
          type: array
          readOnly: true
          description: 置き場所の最上位からの経路
          items:
            "$ref": "#/components/schemas/InventoryLocationRef"
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    InventoryItemCreate:
      type: object
