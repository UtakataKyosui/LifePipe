    InventoryPurchaseIngestionLine:
      type: object
      description: ゲートウェイが長期保有品と判定した 1 品目
      required:
      - source_ref
      - name
      properties:
        source_ref:
          type: string
          minLength: 1
          maxLength: 100
          description: 取り込み元の識別子（レシート ID と行番号など）。重複判定に使う（INV-BR-27）
          example: receipt-0001#3
        name:
          type: string
          minLength: 1
          maxLength: 255
        purchase_date:
          type: string
          format: date
          nullable: true
        purchase_from:
          type: string
          nullable: true
        quantity:
          type: integer
          minimum: 1
          default: 1
        total_price:
          type: string
          nullable: true
          pattern: "^\\d+(\\.\\d{1,4})?$"
          description: 行の合計金額。purchase_price = total_price ÷ quantity として登録する（INV-BR-27）
          example: '19800'
        currency:
          type: string
          nullable: true
          pattern: "^[A-Z]{3}$"
        warranty_expires:
          type: string
          format: date
          nullable: true
        serial_number:
          type: string
          nullable: true
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
        location_id:
          type: string
          format: uuid
          nullable: true
          description: 省略すると受け入れ用の場所（既定名「未整理」）に置く（INV-BR-27）
    InventoryPurchaseIngestionRequest:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            "$ref": "#/components/schemas/InventoryPurchaseIngestionLine"
    InventoryPurchaseIngestion:
      type: object
      description: 1 品目の取り込み結果
      required:
      - source_ref
      - result
      - item_id
      properties:
        source_ref:
          type: string
        result:
          "$ref": "#/components/schemas/InventoryPurchaseIngestionResultKind"
        item_id:
          type: string
          format: uuid
    InventoryPurchaseIngestionError:
      type: object
      description: 検証に失敗した品目（INV-BR-28）
      required:
      - index
      - message
      properties:
        index:
          type: integer
          minimum: 0
          description: 要求の items での位置（0 始まり）
        source_ref:
          type: string
          nullable: true
        field:
          type: string
          nullable: true
          description: 問題のあった項目名
        message:
          type: string
