                type: string
                pattern: "^[A-Z]{3}$"
              monthly_amount:
                type: string
                pattern: "^\\d+(\\.\\d{1,4})?$"
        savings:
          type: array
          description: 停止したサブスクリプションごとの月額の節約額。乗り換え先があればその月額を引く。
