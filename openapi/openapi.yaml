      schema:
        type: string
        format: uuid
    NotesNoteId:
      name: note_id
      in: path
      required: true
      description: メモの ID。
      schema:
        type: string
        format: uuid
    NotesAttachmentId:
      name: attachment_id
      in: path
      required: true
      description: 添付ファイルの ID。
      schema:
        type: string
        format: uuid
    NotesQuery:
      name: q
      in: query
      required: false
      description: 全文検索。本文の部分一致で大文字小文字を区別しない。空白区切りの複数語は AND（NOT-BR-22）。
      schema:
