          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
    SubscriptionsNextPaymentDateCalculation:
      type: object
      description: 次回支払日の計算の入力（SUB-UC-07）。
      required:
      - start_date
      - cycle_unit
      - cycle_interval
      properties:
        start_date:
          type: string
          format: date
          description: 支払日の列の起点。
        cycle_unit:
          "$ref": "#/components/schemas/SubscriptionsCycleUnit"
        cycle_interval:
          type: integer
          minimum: 1
          maximum: 366
        reference_date:
          type: string
          format: date
          description: 基準日。既定は利用者のタイムゾーンでの当日（SUB-BR-04）。
        count:
          type: integer
          minimum: 1
          maximum: 12
          default: 1
          description: 次回以降の支払日をいくつ返すか。
    SubscriptionsNextPaymentDateResult:
      type: object
      required:
      - next_payment_date
      - payment_dates
      properties:
        next_payment_date:
          type: string
          format: date
          description: 次回支払日（`payment_dates` の先頭と同じ）。
        payment_dates:
          type: array
          minItems: 1
          maxItems: 12
          description: 次回支払日から昇順に `count` 件。
          items:
            type: string
            format: date
    SubscriptionsUpcomingPayment:
      type: object
      description: 更新予定の 1 件。計算結果で保存しない。
      required:
      - subscription_id
      - name
      - due_date
      - amount
      - currency
      - renewal_type
      - overdue
      properties:
        subscription_id:
          type: string
          format: uuid
        name:
          type: string
          example: 架空動画プラス
        due_date:
          type: string
          format: date
        amount:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
          example: '1480'
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          example: JPY
        category_id:
          type: string
          format: uuid
          nullable: true
        renewal_type:
          "$ref": "#/components/schemas/SubscriptionsRenewalType"
        overdue:
          type: boolean
          description: 支払日が当日より前で、まだ支払い済みにしていない（manual のみ true になりうる。SUB-BR-08）。
    SubscriptionsCurrencyTotal:
      type: object
      description: 通貨ごとの合計額（SUB-BR-14）。
