        to:
          type: string
          format: date
          description: 適用した期間の終了日。
        items:
          type: array
          description: 支払日の昇順、同じ日は名前の昇順。`overdue=true` のものは先頭に置く（SUB-BR-11、SUB-BR-12）。
          items:
            "$ref": "#/components/schemas/SubscriptionsUpcomingPayment"
        totals:
          type: array
          description: "`items` の通貨ごとの合計額。"
