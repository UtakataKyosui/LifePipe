        sold_date:
          type: string
          format: date
          nullable: true
        sold_to:
          type: string
          nullable: true
        sold_price:
          type: string
          nullable: true
          pattern: "^\\d+(\\.\\d{1,4})?$"
        sold_notes:
          type: string
          nullable: true
          maxLength: 1000
        archived:
          type: boolean
          default: false
        notes:
          type: string
          nullable: true
          maxLength: 1000
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
        custom_fields:
          type: array
          items:
            "$ref": "#/components/schemas/InventoryCustomField"
        import_ref:
          type: string
          nullable: true
          maxLength: 100
        source_ref:
          type: string
          nullable: true
          maxLength: 100
    InventoryItemUpdate:
      type: object
