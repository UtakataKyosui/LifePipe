      operationId: subscriptionsUpdateSettings
      summary: 利用者設定を更新する
      description: |
        送った項目だけを更新する（SUB-UC-13、SUB-UC-16、SUB-UC-17）。
        - `timezone` は IANA タイムゾーン名。「当日」の判定に使う。
        - `main_currency` は ISO 4217 の 3 文字の英大文字（SUB-BR-14）。為替レートは 1 日 1 回まで取得する（SUB-BR-21）。
        - `monthly_budget` は基準通貨の 0 以上の 10 進数。null または 0 は予算なし（SUB-BR-13）。
        - `default_notify_days_before` は 0〜180（SUB-BR-19）。
      x-lifepipe-requirements:
      - SUB-UC-13
      - SUB-UC-16
      - SUB-UC-17
      - SUB-BR-13
      - SUB-BR-14
      - SUB-BR-19
      - SUB-BR-21
      x-lifepipe-priority: later
      requestBody:
        required: true
