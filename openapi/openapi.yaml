                format: uuid
                nullable: true
              currency:
                type: string
                pattern: "^[A-Z]{3}$"
              monthly_amount:
                type: string
                pattern: "^\\d+(\\.\\d{1,4})?$"
        monthly_total_trend:
          type: array
