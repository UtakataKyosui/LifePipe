      description: absolute = 日時指定、relative = タスクの日付からの相対指定
      enum:
      - absolute
      - relative
    TasksReminderRelativeTo:
      type: string
      description: 相対リマインダーの基準となる日付
      enum:
      - due_date
      - start_date
      - end_date
    TasksLocationCategory:
      type: string
      description: 場所の種類
      enum:
      - store
      - public_office
      - post_office
      - bank
      - medical
      - other
    TasksTaskSortField:
      type: string
      description: タスク一覧の並べ替え項目（TSK-BR-21）。省略時は due_date。
      enum:
      - due_date
      - start_date
      - end_date
      - priority
      - percent_done
      - created_at
      - updated_at
      - title
      default: due_date
    TasksSortOrder:
      type: string
      description: 並べ替えの向き。省略時は asc。
      enum:
      - asc
      - desc
      default: asc
    TasksProject:
      type: object
      description: タスクをまとめるリスト。階層を持てる。
      required:
      - id
      - title
      - is_inbox
      - is_archived
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          minLength: 1
          description: 表示名
          example: 家事
        description:
          type: string
          description: 説明
        parent_project_id:
          type: string
          format: uuid
          nullable: true
          description: 親プロジェクト。null なら最上位（TSK-BR-24）
        identifier:
          type: string
          nullable: true
          description: タスク参照用の短い識別子。全プロジェクトで一意（TSK-BR-26）
          example: HOME
        color:
          type: string
          nullable: true
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: 表示色（16進カラーコード）
          example: "#4caf50"
        is_inbox:
          type: boolean
          readOnly: true
          description: Inbox（既定の登録先）なら true。利用者ごとに1つで、削除できない（TSK-BR-01）
        is_archived:
          type: boolean
          readOnly: true
          description: アーカイブ済みなら true。アーカイブ中は読み取り専用（TSK-BR-25）
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    TasksProjectCreate:
      type: object
      required:
      - title
      properties:
        title:
          type: string
          minLength: 1
          example: 家事
        description:
          type: string
        parent_project_id:
          type: string
          format: uuid
          nullable: true
          description: 親プロジェクト。省略または null なら最上位
        identifier:
          type: string
          nullable: true
          description: 全プロジェクトで一意（TSK-BR-26）
          example: HOME
        color:
          type: string
          nullable: true
          pattern: "^#[0-9A-Fa-f]{6}$"
    TasksProjectUpdate:
      type: object
      description: 送った項目だけを更新する。アーカイブ状態は archive 操作で変える。
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        parent_project_id:
          type: string
          format: uuid
          nullable: true
          description: null で最上位に移す。自分自身や子孫は指定できない（TSK-BR-24）
        identifier:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
          pattern: "^#[0-9A-Fa-f]{6}$"
    TasksProjectPage:
      type: object
      required:
      - items
      - total
      - page
      - page_size
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/TasksProject"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 200
    TasksRepeatRule:
      type: object
      description: |
        繰り返し設定。mode が default または from_completion のときは interval_value と interval_unit が必須。
        間隔は 1 時間以上 10 年以下（TSK-BR-16）。monthly は間隔の値を使わない（TSK-BR-14）。
      required:
      - mode
      properties:
        mode:
          "$ref": "#/components/schemas/TasksRepeatMode"
        interval_value:
          type: integer
          minimum: 1
          maximum: 87660
          nullable: true
          description: 間隔の数値（1 以上）。単位と合わせて 10 年以下（hour なら 87660、day なら 3652、week なら
            521 まで）
          example: 3
        interval_unit:
          allOf:
          - "$ref": "#/components/schemas/TasksRepeatIntervalUnit"
          nullable: true
    TasksReminder:
      type: object
      description: タスクに付くリマインダー（TSK-BR-06）
      required:
      - id
      - kind
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          "$ref": "#/components/schemas/TasksReminderKind"
        remind_at:
          type: string
          format: date-time
          nullable: true
          description: 通知日時。relative のときは基準日から計算した値で、基準日が未設定なら null
        relative_to:
          "$ref": "#/components/schemas/TasksReminderRelativeTo"
        relative_offset_seconds:
          type: integer
          description: 基準日からのずれ（秒）。負の値は基準日より前
          example: -3600
    TasksReminderInput:
      type: object
      description: |
        リマインダーの指定。kind が absolute なら remind_at が必須。
        kind が relative なら relative_to と relative_offset_seconds が必須で、remind_at は受け付けない（計算する）（TSK-BR-06）。
      required:
      - kind
      properties:
        kind:
          "$ref": "#/components/schemas/TasksReminderKind"
        remind_at:
          type: string
          format: date-time
        relative_to:
          "$ref": "#/components/schemas/TasksReminderRelativeTo"
        relative_offset_seconds:
          type: integer
          example: -3600
    TasksLabelRef:
      type: object
      description: タスクに付けるラベルの指定。id と title のどちらか一方を指定する。title のラベルが存在しなければ新規に作成する（TSK-BR-23）。
      minProperties: 1
      maxProperties: 1
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          example: 買い出し
    TasksTask:
      type: object
      required:
      - id
      - project_id
      - index
      - title
      - done
      - done_at
      - priority
      - percent_done
      - labels
      - reminders
      - repeat
      - is_overdue
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project_id:
          type: string
          format: uuid
          description: 所属プロジェクト（TSK-BR-01）
        index:
          type: integer
          minimum: 1
          readOnly: true
          description: プロジェクト内の連番。プロジェクトの identifier と組み合わせて HOME-12 のような参照を作る（TSK-BR-26）
          example: 12
        title:
          type: string
          minLength: 1
          example: 燃えるゴミを出す
        description:
          type: string
          description: 説明（Markdown。チェックリスト `- [ ]` を含められる）
        done:
          type: boolean
          readOnly: true
          description: 完了済みなら true。繰り返しタスクは常に false（TSK-BR-11）
        done_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: 完了日時。未完了なら null（TSK-BR-10）
        due_date:
          type: string
          format: date-time
          nullable: true
          description: 期限（この時刻までに終える）（TSK-BR-04）
        start_date:
          type: string
          format: date-time
          nullable: true
          description: 作業予定期間の開始（TSK-BR-05）
        end_date:
          type: string
          format: date-time
          nullable: true
          description: 作業予定期間の終了。開始日 ≦ 終了日（TSK-BR-05）
        priority:
          type: integer
          minimum: 0
          maximum: 5
          default: 0
          description: 優先度。0 = 未設定、1 = 低 〜 5 = 今すぐ（TSK-BR-02）
        percent_done:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
          description: 進捗率（TSK-BR-03）
        color:
          type: string
          nullable: true
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: 表示色
        labels:
          type: array
          description: 付いているラベル
          items:
            "$ref": "#/components/schemas/TasksLabel"
        reminders:
          type: array
          description: リマインダー
          items:
            "$ref": "#/components/schemas/TasksReminder"
        repeat:
          allOf:
          - "$ref": "#/components/schemas/TasksRepeatRule"
          nullable: true
          description: 繰り返し設定。null なら単発タスク
        last_completed_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: 繰り返しタスクを最後に完了した日時（TSK-BR-11）
        location_id:
          type: string
          format: uuid
          nullable: true
          description: 外出先の場所。設定されていれば外出先タスク（TSK-BR-19）
        is_overdue:
          type: boolean
          readOnly: true
          description: 未完了かつ期限が現在時刻より前なら true（TSK-BR-04）
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    TasksTaskCreate:
      type: object
