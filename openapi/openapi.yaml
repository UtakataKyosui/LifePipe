      - PRIVATE
      - PROTECTED
      - PUBLIC
    NotesNoteState:
      type: string
      description: メモの状態（NOT-BR-10）。
      enum:
      - NORMAL
      - ARCHIVED
    NotesNoteSource:
      type: string
      description: メモの作成経路。
      enum:
      - MANUAL
      - INGEST_PURCHASE
      - API
    NotesAttachmentStorage:
      type: string
      description: 実体を保存しているか（STORED）、外部リンクだけを持つか（EXTERNAL）（NOT-BR-16）。
      enum:
      - STORED
      - EXTERNAL
    NotesTimeField:
      type: string
      description: 期間の絞り込みと並べ替えの基準にする日時。
      enum:
      - created_at
      - updated_at
    NotesSortOrder:
      type: string
      description: 並び順。
      enum:
      - desc
      - asc
    NotesTagSort:
      type: string
      description: タグ一覧の並べ替えの基準。name は名前の昇順、note_count は件数の降順。
      enum:
      - name
      - note_count
    NotesUsageMetric:
      type: string
      description: 超えた利用上限の種類（NOT-BR-28）。
      enum:
      - note_count
      - content_bytes
      - storage_bytes
      - upload_bytes
    NotesTagName:
      type: string
      description: |
        タグ名（`#` を含めない）。`/` は空でない区切りの間にだけ置け、先頭・末尾の `/` と連続する `/` は不可（NOT-BR-02）。
        使える文字の詳細は NOT-BR-01。大文字と小文字を区別する（NOT-BR-04）。
      minLength: 1
      pattern: "^[^/\\s#]+(/[^/\\s#]+)*$"
      example: purchase/grocery
    NotesExternalRef:
      type: string
      description: 呼び出し元が付ける冪等キー。同じ所有者の中で一意（NOT-BR-26）。
      minLength: 1
      maxLength: 255
      example: receipt-import-0001
    NotesNoteContent:
      type: string
      description: |
        Markdown 本文。空文字は不可。UTF-8 のバイト長は本文上限（UsageLimits.content_bytes、既定 8192）以下（NOT-BR-28）。
        サーバーは書き換えずにそのまま保存する（NOT-BR-29）。
      minLength: 1
      example: |-
        今日のふりかえり #journal/daily

        - [ ] 散歩する
    NotesNoteProperty:
      type: object
      description: 本文と添付から導出する内容プロパティ。読み取り専用（NOT-BR-05, NOT-BR-20）。
      required:
      - has_link
      - has_code
      - has_task_list
      - has_incomplete_tasks
      - has_inline_image
      - has_attachments
      - has_image
      properties:
        has_link:
          type: boolean
          description: 本文に Markdown のリンクがある。
        has_code:
          type: boolean
          description: 本文にコードブロックまたはインラインコードがある。
        has_task_list:
          type: boolean
          description: 本文にチェックリスト項目がある。
        has_incomplete_tasks:
          type: boolean
          description: 本文に未チェックのチェックリスト項目（`- [ ]`）がある。
        has_inline_image:
          type: boolean
          description: 本文に Markdown の画像記法がある（コード内は除く）。
        has_attachments:
          type: boolean
          description: 紐づく添付ファイルが 1 件以上ある。
        has_image:
          type: boolean
          description: has_inline_image が真、または mime_type が `image/` で始まる添付ファイルが 1
            件以上ある。
    NotesNote:
      type: object
      description: メモ。
      required:
      - id
      - owner_id
      - content
      - visibility
      - state
      - pinned
      - tags
      - property
      - attachments
      - source
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: メモの ID。サーバーが採番する。
        owner_id:
          type: string
          format: uuid
          readOnly: true
          description: 所有者の利用者 ID。ゲートウェイが渡す呼び出し元の ID をサーバーが設定し、変更できない。
        content:
          "$ref": "#/components/schemas/NotesNoteContent"
        visibility:
          "$ref": "#/components/schemas/NotesVisibility"
        state:
          "$ref": "#/components/schemas/NotesNoteState"
        pinned:
          type: boolean
          description: ピン留め。
        tags:
          type: array
          readOnly: true
          description: 本文から導出したタグ（祖先タグを含む、重複なし）。空配列もありうる（NOT-BR-01〜05）。
          items:
            "$ref": "#/components/schemas/NotesTagName"
        property:
          "$ref": "#/components/schemas/NotesNoteProperty"
        attachments:
          type: array
          description: 紐づく添付ファイル（表示順）。空配列もありうる。
          items:
            "$ref": "#/components/schemas/NotesAttachment"
        source:
          "$ref": "#/components/schemas/NotesNoteSource"
        external_ref:
          type: string
          nullable: true
          description: 作成時に受け取った Idempotency-Key。同じ所有者の中で一意（NOT-BR-26）。
          maxLength: 255
        created_at:
          type: string
          format: date-time
          description: 作成日時（UTC）。
        updated_at:
          type: string
          format: date-time
          description: 更新日時（UTC）。created_at 以上（NOT-BR-24）。
    NotesNoteCreate:
      type: object
      description: メモの作成。tags と property は受け付けない（NOT-BR-05）。
      required:
      - content
      properties:
        content:
          "$ref": "#/components/schemas/NotesNoteContent"
        visibility:
          allOf:
          - "$ref": "#/components/schemas/NotesVisibility"
          default: PRIVATE
        created_at:
          type: string
          format: date-time
          description: 作成日時。省略時はサーバー時刻（NOT-BR-24）。
        updated_at:
          type: string
          format: date-time
          description: 更新日時。省略時はサーバー時刻。created_at 以上（NOT-BR-24）。
        attachment_ids:
          type: array
          description: 同じ操作で紐づける未使用の添付ファイルの ID（指定順が表示順。NOT-BR-14, NOT-BR-18）。
          uniqueItems: true
          items:
            type: string
            format: uuid
    NotesNoteUpdate:
      type: object
      description: メモの部分更新。送った項目だけを更新する。
      minProperties: 1
      properties:
        content:
          "$ref": "#/components/schemas/NotesNoteContent"
        visibility:
          "$ref": "#/components/schemas/NotesVisibility"
        created_at:
          type: string
          format: date-time
          description: 作成日時（NOT-BR-24）。
        updated_at:
          type: string
          format: date-time
          description: 更新日時。省略時は他の項目を変えたときにサーバー時刻にする（NOT-BR-24）。
        pinned:
          type: boolean
          description: ピン留め・解除（NOT-BR-12）。
        state:
          "$ref": "#/components/schemas/NotesNoteState"
    NotesNotePage:
      type: object
      required:
      - items
      - total
      - page
      - page_size
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/NotesNote"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
    NotesNoteAttachmentsReplace:
      type: object
      description: メモの添付ファイルの置き換え（NOT-BR-14）。
      required:
      - attachment_ids
      properties:
        attachment_ids:
          type: array
          description: 紐づける添付ファイルの ID（指定順が表示順）。空配列ならすべて外す。
          uniqueItems: true
          items:
            type: string
            format: uuid
    NotesMediaMetadata:
      type: object
      description: 添付ファイルのメディア情報。
      properties:
        width:
          type: integer
          minimum: 1
          description: 画像・動画の幅（px）。
        height:
          type: integer
          minimum: 1
          description: 画像・動画の高さ（px）。
        duration_seconds:
          type: number
          minimum: 0
          description: 音声・動画の長さ（秒）。
    NotesAttachment:
      type: object
      description: 添付ファイル。
      required:
      - id
      - owner_id
      - filename
      - mime_type
      - size
      - storage
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: 添付ファイルの ID。
        owner_id:
          type: string
          format: uuid
          readOnly: true
          description: アップロードした利用者の ID。サーバーが設定し、変更できない。
        note_id:
          type: string
          format: uuid
          nullable: true
          description: 紐づくメモの ID。null なら未使用（NOT-BR-14, NOT-BR-15）。
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: 元のファイル名。
          example: receipt.jpg
        mime_type:
          type: string
          description: IANA メディアタイプ。サーバーが内容から判定し直す（NOT-BR-17）。
          pattern: "^[A-Za-z0-9!#$&^_.+-]+/[A-Za-z0-9!#$&^_.+-]+$"
          example: image/jpeg
        size:
          type: integer
          format: int64
          minimum: 0
          description: バイト数。EXTERNAL の場合は申告値または 0（NOT-BR-16）。
        sha256:
          type: string
          nullable: true
          pattern: "^[0-9a-f]{64}$"
          description: 内容の SHA-256（小文字 16 進 64 文字）。STORED のときは必ず値を持つ（NOT-BR-16）。
        storage:
          "$ref": "#/components/schemas/NotesAttachmentStorage"
        external_link:
          type: string
          format: uri
          nullable: true
          description: storage が EXTERNAL のときの URL。STORED のときは null（NOT-BR-16）。
        media_metadata:
          "$ref": "#/components/schemas/NotesMediaMetadata"
        created_at:
          type: string
          format: date-time
          description: アップロード日時。
        updated_at:
          type: string
          format: date-time
          description: 更新日時（ファイル名の変更、メモへの紐づけ・解除）。
    NotesAttachmentUpload:
      type: object
      description: ファイルのアップロード（multipart/form-data）。
      required:
      - file
      properties:
        file:
          type: string
          format: binary
          description: ファイルの内容。サイズ上限は UsageLimits.upload_bytes（既定 33554432）（NOT-BR-28）。
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: 保存するファイル名。省略時は file パートのファイル名。
        note_id:
          type: string
          format: uuid
          description: 紐づけるメモの ID。省略時は未使用として保存する。
    NotesExternalAttachmentCreate:
      type: object
      description: 外部リンクの添付ファイルの登録（NOT-BR-16）。
      required:
      - external_link
      - filename
      - mime_type
      properties:
        external_link:
          type: string
          format: uri
          description: 外部ファイルの URL。
          example: https://files.example.com/receipt-0001.pdf
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: ファイル名。
        mime_type:
          type: string
          pattern: "^[A-Za-z0-9!#$&^_.+-]+/[A-Za-z0-9!#$&^_.+-]+$"
          description: IANA メディアタイプ（呼び出し元の申告）。
        size:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: 申告するバイト数。
    NotesAttachmentUpdate:
      type: object
      description: 添付ファイルの部分更新。
      minProperties: 1
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: 新しいファイル名。
    NotesAttachmentPage:
      type: object
      required:
      - items
      - total
      - page
      - page_size
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/NotesAttachment"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
    NotesAttachmentList:
      type: object
      description: メモに紐づく添付ファイルの全件（表示順）。
      required:
      - items
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/NotesAttachment"
    NotesDeleteUnusedAttachmentsResult:
      type: object
      required:
      - deleted_count
      properties:
        deleted_count:
          type: integer
          minimum: 0
          description: 削除した未使用の添付ファイルの件数。
    NotesTag:
      type: object
      description: タグの集計（読み取り専用の導出データ。NOT-BR-05）。
      required:
      - name
      - note_count
      - last_used_at
      properties:
        name:
          "$ref": "#/components/schemas/NotesTagName"
        note_count:
          type: integer
          minimum: 0
          description: このタグを持つ NORMAL 状態のメモの件数。
        last_used_at:
          type: string
          format: date-time
          description: このタグを持つメモの最新の created_at。
    NotesTagPage:
      type: object
      required:
      - items
      - total
      - page
      - page_size
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/NotesTag"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
    NotesContextAttachment:
      type: object
      description: 文脈取得で返す添付ファイルのメタデータ（実体は含まない。NOT-BR-27）。
      required:
      - id
      - filename
      - mime_type
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        mime_type:
          type: string
    NotesContextNote:
      type: object
      description: 文脈取得で返すメモ。
      required:
      - id
      - content
      - tags
      - visibility
      - pinned
      - created_at
      - updated_at
      - attachments
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
          description: Markdown 本文（途中で切らない。NOT-BR-27）。
        tags:
          type: array
          items:
            "$ref": "#/components/schemas/NotesTagName"
        visibility:
          "$ref": "#/components/schemas/NotesVisibility"
        pinned:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        attachments:
          type: array
          items:
            "$ref": "#/components/schemas/NotesContextAttachment"
    NotesContext:
      type: object
      description: LLM に渡す文脈（NOT-BR-27）。
      required:
      - notes
      - truncated
      - total_count
      properties:
        notes:
          type: array
          description: created_at の昇順。
          items:
            "$ref": "#/components/schemas/NotesContextNote"
        truncated:
          type: boolean
          description: max_notes または max_bytes に達して打ち切ったとき true。
        total_count:
          type: integer
          minimum: 0
          description: 打ち切らなければ返った件数。
    NotesPurchaseNoteCreate:
      type: object
      description: |
        購買メモの作成（multipart/form-data）。visibility は受け付けず PRIVATE 固定（NOT-BR-09）。
        冪等キーは Idempotency-Key ヘッダーで渡す（NOT-BR-26）。
      required:
      - purchased_at
      - content
      properties:
        purchased_at:
          type: string
          format: date-time
          description: 購買日時。メモの created_at になる（NOT-BR-25）。
        content:
          type: string
          minLength: 1
          description: |
            Markdown 本文（店名、合計金額、品目の要約など）。`#purchase` または `#purchase/` で始まる子タグを必ず含める（NOT-BR-25）。
            UTF-8 のバイト長は本文上限以下（NOT-BR-28）。サーバーは書き換えない（NOT-BR-29）。
          example: 'スーパーで買い物 合計 1,234 円 #purchase/grocery'
        receipts:
          type: array
          description: 同じ操作でアップロードして添付するレシート画像・PDF。
          items:
            type: string
            format: binary
        attachment_ids:
          type: array
          description: 既にアップロードした未使用の添付ファイルの ID。
          uniqueItems: true
          items:
            type: string
            format: uuid
    NotesUsageLimits:
      type: object
      description: 利用上限。値 0 は無制限（NOT-BR-28）。
      required:
      - note_count
      - content_bytes
      - storage_bytes
      - upload_bytes
      - updated_at
      properties:
        note_count:
          type: integer
          format: int64
          minimum: 0
          description: メモ件数の上限。既定 0。
        content_bytes:
          type: integer
          format: int64
          minimum: 0
          description: メモ 1 件の本文の上限（バイト）。既定 8192。
        storage_bytes:
          type: integer
          format: int64
          minimum: 0
          description: 添付ファイル合計の上限（バイト）。既定 0。
        upload_bytes:
          type: integer
          format: int64
          minimum: 0
          description: ファイル 1 件の上限（バイト）。既定 33554432。
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: 設定の更新日時。
    NotesUsageLimitsReplace:
      type: object
      description: 利用上限の置き換え。値 0 は無制限（NOT-BR-28）。
      required:
      - note_count
      - content_bytes
      - storage_bytes
      - upload_bytes
      properties:
        note_count:
          type: integer
          format: int64
          minimum: 0
        content_bytes:
          type: integer
          format: int64
          minimum: 0
        storage_bytes:
          type: integer
          format: int64
          minimum: 0
        upload_bytes:
          type: integer
          format: int64
          minimum: 0
    NotesUsage:
      type: object
      description: 利用状況。
      required:
      - note_count
      - storage_bytes
      - limits
      properties:
        note_count:
          type: integer
          format: int64
          minimum: 0
          description: メモの件数（アーカイブ済みを含む）。
        storage_bytes:
          type: integer
          format: int64
          minimum: 0
          description: STORED の添付ファイルの合計バイト数（未使用を含み、EXTERNAL を除く）。
        limits:
          "$ref": "#/components/schemas/NotesUsageLimits"
    NotesUsageLimitExceeded:
      type: object
      description: 利用上限の超過（RFC 9457 problem+json に metric・limit・current を加えたもの。NOT-BR-28）。
      required:
      - type
      - title
      - status
      - metric
      - limit
      - current
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        metric:
          "$ref": "#/components/schemas/NotesUsageMetric"
        limit:
          type: integer
          format: int64
          minimum: 1
          description: 適用中の上限値。
        current:
          type: integer
          format: int64
          minimum: 0
          description: 操作前の現在値。
    SubscriptionsCycleUnit:
      type: string
      description: 支払いサイクルの単位（SUB-BR-01）。
      enum:
      - day
      - week
      - month
      - year
    SubscriptionsRenewalType:
      type: string
      description: 更新方法。`auto` は支払日を過ぎると自動で次の支払日へ進む。`manual` は支払い済みにするまで進まない（SUB-BR-07、SUB-BR-08）。
      enum:
      - auto
      - manual
      default: auto
    SubscriptionsStatus:
      type: string
      description: 有効・停止。停止中は更新予定・合計額・通知の対象外（SUB-BR-09）。
      enum:
      - active
      - inactive
      default: active
    SubscriptionsStatusFilter:
      type: string
      description: 一覧の状態フィルタ。`all` は有効・停止の両方。
      enum:
      - active
      - inactive
      - all
      default: active
    SubscriptionsSortField:
      type: string
      description: 一覧の並べ替え項目。
      enum:
      - name
      - next_payment_date
      - amount
      default: next_payment_date
    SubscriptionsSortOrder:
      type: string
      description: 並べ替えの向き。
      enum:
      - asc
      - desc
      default: asc
    SubscriptionsExportFormat:
      type: string
      description: エクスポートの形式。
      enum:
      - csv
      - json
    SubscriptionsBatchAction:
      type: string
      description: 一括操作の種類。
      enum:
      - delete
      - set_category
    SubscriptionsSubscription:
      type: object
      description: サブスクリプション（定期的に支払いが発生する契約）。
      required:
      - id
      - owner_id
      - name
      - amount
      - currency
      - cycle_unit
      - cycle_interval
      - start_date
      - next_payment_date
      - anchor_date
      - renewal_type
      - status
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: サーバーが採番する ID。
        owner_id:
          type: string
          readOnly: true
          description: 所有者（OIDC の subject）。認証情報から決まる。
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: サービス名。
          example: 架空動画プラス
        amount:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
          description: 1 回の支払額。0 以上の 10 進数。小数の桁数は通貨の補助単位の桁数以下（SUB-BR-13）。
          example: '1480'
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO 4217 の通貨コード（SUB-BR-14）。
          example: JPY
        cycle_unit:
          "$ref": "#/components/schemas/SubscriptionsCycleUnit"
        cycle_interval:
          type: integer
          minimum: 1
          maximum: 366
          description: サイクルの間隔（SUB-BR-01）。
          example: 1
        start_date:
          type: string
          format: date
          description: 契約の開始日。支払日の起点。
        next_payment_date:
          type: string
          format: date
          description: 次回支払日。
        anchor_date:
          type: string
          format: date
          readOnly: true
          description: 支払日の列の起点（SUB-BR-02、SUB-BR-05）。既定は `start_date`。
        renewal_type:
          "$ref": "#/components/schemas/SubscriptionsRenewalType"
        status:
          "$ref": "#/components/schemas/SubscriptionsStatus"
        end_date:
          type: string
          format: date
          nullable: true
          description: 契約の終了日（解約予定日）。この日より後の支払日は発生しない（SUB-BR-10）。
        category_id:
          type: string
          format: uuid
          nullable: true
          description: カテゴリ。null は未分類。
        url:
          type: string
          format: uri
          pattern: "^https?://"
          maxLength: 2048
          nullable: true
          description: 契約の管理ページなどの URL。http または https。
          example: https://example.com/account
        notes:
          type: string
          maxLength: 2000
          nullable: true
          description: メモ（Markdown 可）。
        payment_method_id:
          type: string
          format: uuid
          nullable: true
          description: 支払い方法（後回しの機能）。
        payer_ids:
          type: array
          description: 支払者の世帯メンバー ID（後回しの機能。SUB-UC-15）。
          uniqueItems: true
          items:
            type: string
            format: uuid
        folder_id:
          type: string
          format: uuid
          nullable: true
          description: フォルダ（後回しの機能）。
        replaced_by_id:
          type: string
          format: uuid
          nullable: true
          description: 停止したサブスクリプションの乗り換え先（後回しの機能）。節約額の計算に使う。
        notify:
          type: boolean
          default: false
          description: 支払い前に通知するか（後回しの機能。SUB-BR-19）。
        notify_days_before:
          type: integer
          minimum: 0
          maximum: 180
          nullable: true
          description: 何日前に通知するか。0 は支払日当日。null は利用者の既定値（SUB-BR-19）。
        last_paid_on:
          type: string
          format: date
          nullable: true
          readOnly: true
          description: 最後に支払い済みにした支払日（SUB-BR-17）。
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: 作成日時。
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: 更新日時。
    SubscriptionsSubscriptionCreate:
      type: object
      description: サブスクリプションの登録内容。`start_date` と `next_payment_date` は省略するとサーバーが決める（SUB-BR-04、SUB-BR-05）。
      required:
      - name
      - amount
      - currency
      - cycle_unit
      - cycle_interval
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: 架空動画プラス
        amount:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
          description: 0 以上の 10 進数。小数の桁数は通貨の補助単位の桁数以下（SUB-BR-13）。
          example: '1480'
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          example: JPY
        cycle_unit:
          "$ref": "#/components/schemas/SubscriptionsCycleUnit"
        cycle_interval:
          type: integer
          minimum: 1
          maximum: 366
          example: 1
        start_date:
          type: string
          format: date
          description: 省略時は利用者のタイムゾーンでの当日。
        next_payment_date:
          type: string
          format: date
          description: 省略時は SUB-BR-04 で計算する。`start_date` より前は 400（SUB-BR-05）。
        renewal_type:
          "$ref": "#/components/schemas/SubscriptionsRenewalType"
        status:
          "$ref": "#/components/schemas/SubscriptionsStatus"
        end_date:
          type: string
          format: date
          description: "`start_date` 以降（SUB-BR-10）。"
        category_id:
          type: string
          format: uuid
          description: 自分のカテゴリ。他人のもの・存在しないものは 400（SUB-BR-15）。
        url:
          type: string
          format: uri
          pattern: "^https?://"
          maxLength: 2048
        notes:
          type: string
          maxLength: 2000
        payment_method_id:
          type: string
          format: uuid
        payer_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        folder_id:
          type: string
          format: uuid
        replaced_by_id:
          type: string
          format: uuid
        notify:
          type: boolean
          default: false
        notify_days_before:
          type: integer
          minimum: 0
          maximum: 180
    SubscriptionsSubscriptionUpdate:
      type: object
      description: サブスクリプションの部分更新。送った項目だけを更新する。null を送れる項目は null で値を消す。
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        amount:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        cycle_unit:
          "$ref": "#/components/schemas/SubscriptionsCycleUnit"
        cycle_interval:
          type: integer
          minimum: 1
          maximum: 366
        start_date:
          type: string
          format: date
        next_payment_date:
          type: string
          format: date
          description: 送らずにサイクルか開始日を変えると SUB-BR-04 で計算し直す（SUB-BR-06）。
        renewal_type:
          "$ref": "#/components/schemas/SubscriptionsRenewalType"
        status:
          "$ref": "#/components/schemas/SubscriptionsStatus"
        end_date:
          type: string
          format: date
          nullable: true
        category_id:
          type: string
          format: uuid
          nullable: true
        url:
          type: string
          format: uri
          pattern: "^https?://"
          maxLength: 2048
          nullable: true
        notes:
          type: string
          maxLength: 2000
          nullable: true
        payment_method_id:
          type: string
          format: uuid
          nullable: true
        payer_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        folder_id:
          type: string
          format: uuid
          nullable: true
        replaced_by_id:
          type: string
          format: uuid
          nullable: true
        notify:
          type: boolean
        notify_days_before:
          type: integer
          minimum: 0
          maximum: 180
          nullable: true
    SubscriptionsSubscriptionPage:
      type: object
      required:
      - items
      - total
      - page
