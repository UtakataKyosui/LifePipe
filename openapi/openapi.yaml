          format: uuid
          nullable: true
    TasksTaskUpdate:
      type: object
      description: 送った項目だけを更新する。labels と reminders は送った配列で置き換える。完了状態は complete / uncomplete
        で変える。
      properties:
        project_id:
          type: string
          format: uuid
          description: 別プロジェクトへ移動すると移動先で新しい index を振る（TSK-BR-26）
        title:
          type: string
          minLength: 1
