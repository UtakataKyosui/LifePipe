components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC ID 基盤（Zitadel 等）が発行した JWT アクセストークン
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 取得するページ番号（1始まり）
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: 1ページあたりの件数（既定50、最大200）
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    NotesPageSize:
      name: page_size
      in: query
      required: false
      description: 1ページあたりの件数。メモ一覧の既定件数は 20、最大 100（NOT-BR-23）。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 操作の冪等性を担保するためのキー（UUID または一意な文字列）
      schema:
        type: string
        minLength: 1
        maxLength: 255
    InventoryLocationId:
      name: location_id
      in: path
      required: true
      description: 保管場所の ID
      schema:
        type: string
        format: uuid
    InventoryItemId:
      name: item_id
      in: path
      required: true
      description: 物品の ID
      schema:
        type: string
        format: uuid
    InventoryTagId:
      name: tag_id
      in: path
      required: true
      description: タグの ID
      schema:
        type: string
        format: uuid
    InventoryAttachmentId:
      name: attachment_id
      in: path
      required: true
      description: 添付ファイルの ID
      schema:
        type: string
        format: uuid
    InventoryAssetId:
      name: asset_id
      in: path
      required: true
      description: 資産番号（DDD-DDD 形式）
      schema:
        type: string
        pattern: "^\\d{3}-\\d{3}$"
        example: 000-001
    InventoryCustomFieldName:
      name: field_name
      in: path
      required: true
      description: カスタムフィールド名（大文字小文字を区別しない）
      schema:
        type: string
        minLength: 1
        maxLength: 255
    InventoryMaintenanceEntryId:
      name: entry_id
      in: path
      required: true
      description: メンテナンス記録の ID
      schema:
        type: string
        format: uuid
    InventoryItemTemplateId:
      name: template_id
      in: path
      required: true
      description: 物品テンプレートの ID
      schema:
        type: string
        format: uuid
    InventoryLabelTemplateId:
      name: template_id
      in: path
      required: true
      description: ラベル印刷テンプレートの ID
      schema:
        type: string
        format: uuid
    InventoryQ:
      name: q
      in: query
      required: false
      description: キーワード。空白区切りの全語を含むものを返す。二重引用符で語句一致。先頭が「#」なら資産番号で検索する（INV-BR-23）
      schema:
        type: string
        maxLength: 1000
    InventoryTagIds:
      name: tag_ids
      in: query
      required: false
      description: タグで絞り込む。指定タグのいずれかを持つものを返す（INV-BR-23）
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          format: uuid
    InventorySortOrderQuery:
      name: order
      in: query
      required: false
      description: 並び順の向き
      schema:
        "$ref": "#/components/schemas/InventorySortOrder"
    WardrobeHouseholdId:
      name: household_id
      in: path
      required: true
      description: 世帯 ID
      schema:
        type: string
        format: uuid
    WardrobeMemberId:
      name: member_id
      in: path
      required: true
      description: メンバー ID
      schema:
        type: string
        format: uuid
    WardrobeItemId:
      name: item_id
      in: path
      required: true
      description: 衣服 ID
      schema:
        type: string
        format: uuid
    WardrobeImageId:
      name: image_id
      in: path
      required: true
      description: 画像 ID
      schema:
        type: string
        format: uuid
    WardrobeWearLogId:
      name: wear_log_id
      in: path
      required: true
      description: 着用記録 ID
      schema:
        type: string
        format: uuid
    WardrobeJobId:
      name: job_id
      in: path
      required: true
      description: 画像処理ジョブ ID
      schema:
        type: string
        format: uuid
    WardrobeOutfitId:
      name: outfit_id
      in: path
      required: true
      description: コーディネート ID
      schema:
        type: string
        format: uuid
    WardrobeSuggestionId:
      name: suggestion_id
      in: path
      required: true
      description: コーディネート提案 ID
      schema:
        type: string
        format: uuid
    WardrobeIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 購入の振り分けからの登録で付ける冪等キー。24 時間、同じキーの再送に同じ結果を返す（WRD-BR-23）
      schema:
        type: string
        minLength: 1
        maxLength: 255
    WardrobeConditionDate:
      name: date
      in: query
      required: true
      description: 対象の日付
      schema:
        type: string
        format: date
    WardrobeConditionTempMax:
      name: temp_max
      in: query
      required: true
      description: 当日の最高気温（℃）
      schema:
        type: number
        minimum: -60
        maximum: 60
    WardrobeConditionTempMin:
      name: temp_min
      in: query
      required: true
      description: 当日の最低気温（℃）。temp_max 以下
      schema:
        type: number
        minimum: -60
        maximum: 60
    WardrobeConditionPrecipitationProbability:
      name: precipitation_probability
      in: query
      required: false
      description: 降水確率（%）。省略時は 0
      schema:
        type: integer
        minimum: 0
        maximum: 100
        default: 0
    WardrobeConditionOccasion:
      name: occasion
      in: query
      required: true
      description: 予定から決めた場面。予定が無く在宅なら home、外出で場面が分からなければ casual（WRD-BR-15）
      schema:
        "$ref": "#/components/schemas/WardrobeOccasion"
    WardrobeConditionMinFormality:
