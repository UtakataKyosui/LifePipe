        maximum: 5
    PantryProductId:
      name: product_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PantryProductGroupId:
      name: product_group_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PantryProductGroupIdQuery:
      name: product_group_id
      in: query
      description: 商品グループで絞り込む
      schema:
        type: string
        format: uuid
    PantryQuantityUnitId:
      name: quantity_unit_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PantryQuantityUnitConversionId:
      name: conversion_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PantryLocationId:
      name: location_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PantryStockEntryId:
      name: stock_entry_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PantryShoppingListId:
      name: shopping_list_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PantryShoppingListItemId:
      name: item_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TasksProjectId:
      name: project_id
