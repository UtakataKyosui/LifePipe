    SubscriptionsPayment:
      type: object
      description: 支払い記録（SUB-BR-17）。
      required:
      - id
      - subscription_id
      - due_date
      - amount
      - currency
      - paid_at
      - created_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        subscription_id:
          type: string
          format: uuid
          readOnly: true
        due_date:
          type: string
          format: date
          readOnly: true
          description: 支払い済みにした支払日（その時点の `next_payment_date`）。
        amount:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        paid_at:
          type: string
          format: date-time
          readOnly: true
          description: 支払い済みにした日時。
        created_at:
          type: string
          format: date-time
          readOnly: true
    SubscriptionsPaymentCreate:
      type: object
      description: 支払い済みにする操作の入力。省略した項目はその時点のサブスクリプションの値を使う。
      properties:
        amount:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
          description: 実際の支払額。小数の桁数は通貨の補助単位の桁数以下（SUB-BR-13）。
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
    SubscriptionsExchangeRate:
      type: object
      description: 為替レートの取得結果（後回しの機能。SUB-BR-21）。
      required:
      - base_currency
      - quote_currency
      - rate
      - fetched_on
      properties:
        base_currency:
          type: string
          pattern: "^[A-Z]{3}$"
        quote_currency:
          type: string
          pattern: "^[A-Z]{3}$"
        rate:
          type: string
          pattern: "^\\d+(\\.\\d+)?$"
          description: 基準通貨 1 単位あたりの換算先通貨の量。10 進数の文字列。
        fetched_on:
          type: string
          format: date
          description: 取得日。
    SubscriptionsCostTotal:
      type: object
      description: ある通貨での月額・年額の合計（SUB-BR-18）。
      required:
      - currency
      - monthly_amount
      - yearly_amount
      - subscription_count
      properties:
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        monthly_amount:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
        yearly_amount:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
        subscription_count:
          type: integer
          minimum: 0
          description: 合計に含めたサブスクリプションの数。
    SubscriptionsSummary:
      type: object
      description: 月額・年額の合計と予算との比較（SUB-UC-12、SUB-UC-17）。
      required:
      - totals_by_currency
      properties:
        totals_by_currency:
          type: array
          description: 通貨ごとの合計（SUB-BR-14）。
          items:
            "$ref": "#/components/schemas/SubscriptionsCostTotal"
        main_currency_total:
          type: object
          nullable: true
          description: 基準通貨に換算した合計。為替換算を設定した場合だけ返す（SUB-BR-14）。
          required:
          - currency
          - monthly_amount
          - yearly_amount
          - subscription_count
          properties:
            currency:
              type: string
              pattern: "^[A-Z]{3}$"
            monthly_amount:
              type: string
              pattern: "^\\d+(\\.\\d{1,4})?$"
            yearly_amount:
              type: string
              pattern: "^\\d+(\\.\\d{1,4})?$"
            subscription_count:
              type: integer
              minimum: 0
        monthly_budget:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
          nullable: true
          description: 月の予算（基準通貨）。予算なしは null。
