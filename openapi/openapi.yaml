                format: uuid
                nullable: true
              currency:
                type: string
                pattern: "^[A-Z]{3}$"
              monthly_amount:
                type: string
                pattern: "^\\d+(\\.\\d{1,4})?$"
        by_payer:
          type: array
          description: 支払者別の月額。`household_member_id` が null は支払者なし。
          items:
            type: object
            required:
            - currency
