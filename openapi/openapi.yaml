      required: true
      description: プロジェクトの ID
      schema:
        type: string
        format: uuid
    TasksTaskId:
      name: task_id
      in: path
      required: true
      description: タスクの ID
      schema:
        type: string
        format: uuid
    TasksLabelId:
      name: label_id
      in: path
      required: true
      description: ラベルの ID
