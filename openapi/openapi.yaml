        serial_number:
          type: string
          nullable: true
        purchase_date:
          type: string
          format: date
          nullable: true
        purchase_from:
          type: string
          nullable: true
        purchase_price:
          type: string
          nullable: true
          pattern: "^\\d+(\\.\\d{1,4})?$"
