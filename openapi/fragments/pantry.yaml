          type: string
          minLength: 1
        name_plural:
          type: string
          nullable: true
    PantryQuantityUnitUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        name_plural:
          type: string
          nullable: true
    PantryQuantityUnitPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PantryQuantityUnit'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

