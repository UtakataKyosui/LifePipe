        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PantryQuantityUnitConversionCreate:
      type: object
      required: [from_quantity_unit_id, to_quantity_unit_id, factor]
      properties:
        from_quantity_unit_id:
          type: string
          format: uuid
        to_quantity_unit_id:
          type: string
          format: uuid
        factor:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        product_id:
          type: string
          format: uuid
          nullable: true
    PantryQuantityUnitConversionUpdate:
      type: object
      properties:
        from_quantity_unit_id:
          type: string
          format: uuid
        to_quantity_unit_id:
          type: string
          format: uuid
        factor:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        product_id:
          type: string
          format: uuid
          nullable: true
    PantryQuantityUnitConversionPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PantryQuantityUnitConversion'
        total:
