# pantry fragment
paths:
  /pantry/products:
    get:
      operationId: pantryListProducts
      tags: [pantry]
      summary: 商品を一覧・検索する
      description: |
        商品を名前の部分一致・保管場所・商品グループ・在庫の有無・有効/無効で絞り込む。
        active を省略すると有効な商品だけを返す（PAN-BR-03）。各商品に在庫の要約を含める。
      x-lifepipe-requirements: [PAN-UC-02, PAN-BR-03]
      x-lifepipe-priority: mvp
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          description: 商品名の部分一致（大文字小文字と前後の空白を区別しない）
          schema:
            type: string
        - name: location_id
          in: query
          description: 既定の保管場所、またはその場所に在庫エントリを持つ商品
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/PantryProductGroupIdQuery'
        - name: in_stock
          in: query
          description: true なら在庫数量が 0 より大きい商品、false なら在庫のない商品
          schema:
            type: boolean
        - name: active
          in: query
          description: 有効/無効で絞り込む。省略時は true（PAN-BR-03）
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: 商品の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: pantryCreateProduct
      tags: [pantry]
      summary: 商品を登録する
      description: |
        商品名は世帯内で一意。重複は 409（PAN-BR-01）。
        purchase_quantity_unit_id・consume_quantity_unit_id を省略すると在庫単位を設定する。
      x-lifepipe-requirements: [PAN-UC-01, PAN-BR-01, PAN-BR-02, PAN-BR-04, PAN-BR-05]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PantryProductCreate'
      responses:
        '201':
          description: 登録した商品
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryProduct'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /pantry/products/{product_id}:
    parameters:
      - $ref: '#/components/parameters/PantryProductId'
    get:
      operationId: pantryGetProduct
      tags: [pantry]
      summary: 商品を取得する
      description: 在庫の要約（在庫数量、開封済み数量、次の期限日、最低在庫を下回っているか）を含める（PAN-BR-08、PAN-BR-19）。
      x-lifepipe-requirements: [PAN-UC-01, PAN-UC-02, PAN-BR-08, PAN-BR-19]
      x-lifepipe-priority: mvp
      responses:
        '200':
          description: 商品
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryProduct'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: pantryUpdateProduct
      tags: [pantry]
      summary: 商品を更新・無効化する
      description: |
        送った項目だけを更新する。無効化は active=false（PAN-BR-03）。名前の重複は 409（PAN-BR-01）。
        在庫エントリか履歴を持つ商品の在庫単位を変えるには旧単位から新単位への換算が必要で、
        既存の在庫エントリの数量と単価を新単位へ換算する。換算できなければ 422（PAN-BR-18）。
      x-lifepipe-requirements: [PAN-UC-01, PAN-BR-01, PAN-BR-03, PAN-BR-18]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PantryProductUpdate'
      responses:
        '200':
          description: 更新した商品
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryProduct'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: pantryDeleteProduct
      tags: [pantry]
      summary: 商品を削除する
      description: |
        商品の在庫エントリ・履歴・買い物リスト項目・商品ごとの換算もあわせて削除する。
        在庫や履歴を持つ商品は、削除より無効化を推奨する（PAN-BR-03）。
      x-lifepipe-requirements: [PAN-UC-01, PAN-BR-03]
      x-lifepipe-priority: mvp
      responses:
        '204':
          description: 削除した
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /pantry/products/{product_id}/stock:
    parameters:
      - $ref: '#/components/parameters/PantryProductId'
    get:
      operationId: pantryGetProductStock
      tags: [pantry]
      summary: 商品の在庫数量と在庫エントリを取得する
      description: 在庫数量（在庫単位）と、期限日・保管場所・開封状態ごとの在庫エントリの一覧を返す。エントリは PAN-BR-11 の消費順に並べる。
      x-lifepipe-requirements: [PAN-UC-10, PAN-BR-11, PAN-BR-19]
      x-lifepipe-priority: mvp
      responses:
        '200':
          description: 商品の在庫
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryProductStock'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /pantry/products/{product_id}/purchase:
    parameters:
      - $ref: '#/components/parameters/PantryProductId'
    post:
      operationId: pantryPurchaseProduct
      tags: [pantry]
      summary: 購入した商品を在庫に加える
      description: |
        購入 1 件ごとに在庫エントリを 1 つ作る。保管場所の省略時は商品の既定の保管場所（PAN-BR-16）。
        数量は在庫単位へ換算して保存し、使えない単位は 422（PAN-BR-10）。
        期限日は PAN-BR-06 で決める（期限日なし・既定日数なしは 422）。
        今日以前の期限日、既存エントリより早い期限日は登録したうえで warnings に入れる（PAN-BR-06、PAN-BR-17）。
        価格は unit_price（購入単位あたり）か total_price のどちらかで受け取り、在庫単位あたりに換算する（PAN-BR-16）。
      x-lifepipe-requirements: [PAN-UC-06, PAN-BR-02, PAN-BR-05, PAN-BR-06, PAN-BR-10, PAN-BR-16, PAN-BR-17, PAN-BR-28]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PantryPurchaseRequest'
      responses:
        '201':
          description: 作成した在庫エントリと履歴
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryPurchaseResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /pantry/products/{product_id}/consume:
    parameters:
      - $ref: '#/components/parameters/PantryProductId'
    post:
      operationId: pantryConsumeProduct
      tags: [pantry]
      summary: 商品を消費・廃棄する
      description: |
        廃棄は spoiled=true の消費（PAN-BR-15）。stock_entry_id を省略すると PAN-BR-11 の順にエントリを選び、
        複数エントリにまたがる場合は同じ correlation_id で履歴をまとめる（PAN-BR-12）。
        在庫が足りなければ何も変えずに 422（PAN-BR-13）。
        自動追加が有効なら、最低在庫を下回った商品を既定の買い物リストへ追加し、結果に含める（PAN-BR-20、PAN-BR-21）。
      x-lifepipe-requirements: [PAN-UC-07, PAN-UC-09, PAN-UC-13, PAN-BR-10, PAN-BR-11, PAN-BR-12, PAN-BR-13, PAN-BR-15, PAN-BR-20, PAN-BR-21, PAN-BR-28]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PantryConsumeRequest'
      responses:
        '200':
          description: 在庫の変更結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryStockOperationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /pantry/products/{product_id}/open:
    parameters:
      - $ref: '#/components/parameters/PantryProductId'
    post:
      operationId: pantryOpenProduct
      tags: [pantry]
      summary: 商品を開封済みにする
      description: |
        未開封のエントリだけを対象に PAN-BR-11 の順で選ぶ。数量がエントリより少なければ開封分を分割する。
        default_due_days_after_open があれば期限日を min(元の期限日, 今日 + 日数) にする（PAN-BR-14）。
        can_be_opened が false の商品と在庫不足は 422（PAN-BR-13、PAN-BR-14）。
      x-lifepipe-requirements: [PAN-UC-08, PAN-UC-13, PAN-BR-10, PAN-BR-11, PAN-BR-13, PAN-BR-14, PAN-BR-20, PAN-BR-28]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PantryOpenRequest'
      responses:
        '200':
          description: 在庫の変更結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryStockOperationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /pantry/products/{product_id}/transfer:
    parameters:
      - $ref: '#/components/parameters/PantryProductId'
    post:
      operationId: pantryTransferProduct
      tags: [pantry]
      summary: 保管場所間で在庫を移動する
      description: |
        冷凍庫でない場所から冷凍庫へ移すと default_due_days_after_freezing、冷凍庫から出すと
        default_due_days_after_thawing に従って期限日を変える（PAN-BR-23）。
        履歴は transfer_from と transfer_to を同じ correlation_id で記録する（PAN-BR-28）。在庫不足は 422（PAN-BR-13）。
      x-lifepipe-requirements: [PAN-UC-21, PAN-BR-10, PAN-BR-11, PAN-BR-13, PAN-BR-23, PAN-BR-28]
      x-lifepipe-priority: later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PantryTransferRequest'
      responses:
        '200':
          description: 在庫の変更結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryStockOperationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /pantry/products/{product_id}/inventory:
    parameters:
      - $ref: '#/components/parameters/PantryProductId'
    post:
      operationId: pantryInventoryProduct
      tags: [pantry]
      summary: 棚卸しで在庫数量を補正する
      description: |
        実数と現在の在庫数量の差を求め、増える場合は新しい在庫エントリ（期限日は PAN-BR-06）を作り、
        減る場合は PAN-BR-11 の順で引く。履歴の type は inventory_correction（PAN-BR-29）。
        結果として最低在庫を下回れば自動追加の対象になる（PAN-BR-20）。
      x-lifepipe-requirements: [PAN-UC-20, PAN-BR-06, PAN-BR-10, PAN-BR-11, PAN-BR-20, PAN-BR-28, PAN-BR-29]
      x-lifepipe-priority: later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PantryInventoryRequest'
      responses:
        '200':
          description: 在庫の変更結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryStockOperationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /pantry/products/{product_id}/merge:
    parameters:
      - $ref: '#/components/parameters/PantryProductId'
    post:
      operationId: pantryMergeProduct
      tags: [pantry]
      summary: 商品を別の商品へ統合する
      description: パスの商品の履歴・在庫エントリ・買い物リスト項目を統合先の商品へ寄せ、パスの商品を削除する。自分自身への統合は 422。
      x-lifepipe-requirements: [PAN-UC-28]
      x-lifepipe-priority: later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PantryProductMergeRequest'
      responses:
        '200':
          description: 統合先の商品
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryProduct'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /pantry/products/{product_id}/quantity-units:
    parameters:
      - $ref: '#/components/parameters/PantryProductId'
    get:
      operationId: pantryListProductQuantityUnits
      tags: [pantry]
      summary: 商品で使える数量単位を一覧する
      description: その商品で使える単位と、在庫単位への factor（PAN-BR-10 で解決した値）を返す。
      x-lifepipe-requirements: [PAN-UC-04, PAN-UC-06, PAN-BR-10]
      x-lifepipe-priority: mvp
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 使える単位の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryProductQuantityUnitPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /pantry/product-groups:
    get:
      operationId: pantryListProductGroups
      tags: [pantry]
      summary: 商品グループを一覧する
      description: sort_order の昇順、同順なら名前順に返す。
      x-lifepipe-requirements: [PAN-UC-26]
      x-lifepipe-priority: later
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 商品グループの一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryProductGroupPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: pantryCreateProductGroup
      tags: [pantry]
      summary: 商品グループを登録する
      description: グループ名は世帯内で一意。重複は 409（PAN-BR-01）。
      x-lifepipe-requirements: [PAN-UC-26, PAN-BR-01]
      x-lifepipe-priority: later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PantryProductGroupCreate'
      responses:
        '201':
          description: 登録した商品グループ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryProductGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /pantry/product-groups/{product_group_id}:
    parameters:
      - $ref: '#/components/parameters/PantryProductGroupId'
    get:
      operationId: pantryGetProductGroup
      tags: [pantry]
      summary: 商品グループを取得する
      x-lifepipe-requirements: [PAN-UC-26]
      x-lifepipe-priority: later
      responses:
        '200':
          description: 商品グループ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryProductGroup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: pantryUpdateProductGroup
      tags: [pantry]
      summary: 商品グループを更新する
      description: 名前の重複は 409（PAN-BR-01）。
      x-lifepipe-requirements: [PAN-UC-26, PAN-BR-01]
      x-lifepipe-priority: later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PantryProductGroupUpdate'
      responses:
        '200':
          description: 更新した商品グループ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryProductGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: pantryDeleteProductGroup
      tags: [pantry]
      summary: 商品グループを削除する
      description: 商品から参照されているグループは削除できない（409）。
      x-lifepipe-requirements: [PAN-UC-26]
      x-lifepipe-priority: later
      responses:
        '204':
          description: 削除した
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /pantry/quantity-units:
    get:
      operationId: pantryListQuantityUnits
      tags: [pantry]
      summary: 数量単位を一覧する
      x-lifepipe-requirements: [PAN-UC-03]
      x-lifepipe-priority: mvp
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 数量単位の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryQuantityUnitPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: pantryCreateQuantityUnit
      tags: [pantry]
      summary: 数量単位を登録する
      description: 単位名は世帯内で一意。重複は 409（PAN-BR-01）。
      x-lifepipe-requirements: [PAN-UC-03, PAN-BR-01]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PantryQuantityUnitCreate'
      responses:
        '201':
          description: 登録した数量単位
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryQuantityUnit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /pantry/quantity-units/{quantity_unit_id}:
    parameters:
      - $ref: '#/components/parameters/PantryQuantityUnitId'
    get:
      operationId: pantryGetQuantityUnit
      tags: [pantry]
      summary: 数量単位を取得する
      x-lifepipe-requirements: [PAN-UC-03]
      x-lifepipe-priority: mvp
      responses:
        '200':
          description: 数量単位
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryQuantityUnit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: pantryUpdateQuantityUnit
      tags: [pantry]
      summary: 数量単位を更新する
      description: 名前の重複は 409（PAN-BR-01）。
      x-lifepipe-requirements: [PAN-UC-03, PAN-BR-01]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PantryQuantityUnitUpdate'
      responses:
        '200':
          description: 更新した数量単位
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryQuantityUnit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: pantryDeleteQuantityUnit
      tags: [pantry]
      summary: 数量単位を削除する
      description: 商品・換算・買い物リスト項目から参照されている単位は削除できない（409）。
      x-lifepipe-requirements: [PAN-UC-03]
      x-lifepipe-priority: mvp
      responses:
        '204':
          description: 削除した
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /pantry/quantity-unit-conversions:
    get:
      operationId: pantryListQuantityUnitConversions
      tags: [pantry]
