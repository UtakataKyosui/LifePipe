        既定は作成日時の昇順。sort=product_group は商品グループの sort_order 順に並べる（後回しの機能、PAN-UC-26）。
        数量は保存値のまま返し、整数への切り上げはクライアント側で行う（PAN-BR-22）。
      x-lifepipe-requirements: [PAN-UC-14, PAN-UC-26, PAN-BR-22]
      x-lifepipe-priority: mvp
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: done
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/PantryProductGroupIdQuery'
        - name: sort
          in: query
          schema:
            $ref: '#/components/schemas/PantryShoppingListItemSort'
      responses:
        '200':
          description: 項目の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryShoppingListItemPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: pantryCreateShoppingListItem
      tags: [pantry]
      summary: 買い物リストに項目を追加する
      description: |
        商品を参照する項目か、自由記述の項目（product_id なし、note 必須）を追加する（PAN-BR-27）。
        product_id があるときは quantity_unit_id が必須で、その商品で換算できる単位に限る（422、PAN-BR-10）。
        origin は manual になる。
      x-lifepipe-requirements: [PAN-UC-14, PAN-BR-02, PAN-BR-10, PAN-BR-27]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PantryShoppingListItemCreate'
      responses:
        '201':
          description: 追加した項目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryShoppingListItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /pantry/shopping-lists/{shopping_list_id}/items/{item_id}:
    parameters:
      - $ref: '#/components/parameters/PantryShoppingListId'
      - $ref: '#/components/parameters/PantryShoppingListItemId'
    get:
      operationId: pantryGetShoppingListItem
      tags: [pantry]
      summary: 買い物リストの項目を取得する
      x-lifepipe-requirements: [PAN-UC-14]
      x-lifepipe-priority: mvp
      responses:
        '200':
          description: 項目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryShoppingListItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: pantryUpdateShoppingListItem
      tags: [pantry]
      summary: 買い物リストの項目を更新する
      description: |
        送った項目だけを更新する。done の変更はここでは在庫を変えない（PAN-BR-24）。
        在庫へ登録しながら消し込むには done 操作を使う。product_id・note・quantity_unit_id の組み合わせは作成時と同じ規則（PAN-BR-27）。
      x-lifepipe-requirements: [PAN-UC-14, PAN-BR-10, PAN-BR-24, PAN-BR-27]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PantryShoppingListItemUpdate'
      responses:
        '200':
          description: 更新した項目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryShoppingListItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: pantryDeleteShoppingListItem
      tags: [pantry]
      summary: 買い物リストの項目を削除する
      x-lifepipe-requirements: [PAN-UC-14]
      x-lifepipe-priority: mvp
      responses:
        '204':
          description: 削除した
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /pantry/shopping-lists/{shopping_list_id}/items/{item_id}/done:
    parameters:
      - $ref: '#/components/parameters/PantryShoppingListId'
      - $ref: '#/components/parameters/PantryShoppingListItemId'
    post:
      operationId: pantryCompleteShoppingListItem
      tags: [pantry]
      summary: 買い物リストの項目を購入済みにする
      description: |
        done を true、done_at を現在日時にする。add_to_stock が true なら項目の数量・単位で PAN-BR-16 の購入を行う（PAN-BR-24）。
        自由記述の項目は在庫と連動しない（PAN-BR-27）。
      x-lifepipe-requirements: [PAN-UC-15, PAN-BR-06, PAN-BR-16, PAN-BR-24, PAN-BR-27, PAN-BR-28]
      x-lifepipe-priority: mvp
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PantryShoppingListItemDoneRequest'
      responses:
        '200':
          description: 消し込んだ項目と在庫登録の結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryShoppingListItemDoneResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /pantry/shopping-lists/{shopping_list_id}/add-missing-products:
    parameters:
      - $ref: '#/components/parameters/PantryShoppingListId'
    post:
      operationId: pantryAddMissingProductsToShoppingList
      tags: [pantry]
      summary: 最低在庫を下回った商品を買い物リストに追加する
      description: |
        設定に関係なく、下回っている有効な全商品を対象にする（PAN-BR-20）。
        必要量 = 不足量 - リストの未購入の同じ商品の数量。0 以下なら何もせず、正なら既存の未購入の項目に加算するか、
        購入単位で新しい項目（origin=below_min_stock）を作る（PAN-BR-21）。
        設定による自動追加（auto_add_below_min_stock）は消費・開封・棚卸しの結果に含めて返す。
      x-lifepipe-requirements: [PAN-UC-13, PAN-BR-19, PAN-BR-20, PAN-BR-21]
      x-lifepipe-priority: mvp
      responses:
        '200':
          description: 追加・更新した項目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryShoppingListChangeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /pantry/shopping-lists/{shopping_list_id}/add-overdue-products:
    parameters:
      - $ref: '#/components/parameters/PantryShoppingListId'
    post:
      operationId: pantryAddOverdueProductsToShoppingList
      tags: [pantry]
      summary: 期限超過・期限切れの在庫を持つ商品を買い物リストに追加する
      description: 有効な商品のうち、指定した状態（PAN-BR-07）の在庫エントリを持つ商品を origin=overdue または expired で追加する。
      x-lifepipe-requirements: [PAN-UC-24, PAN-BR-04, PAN-BR-07]
      x-lifepipe-priority: later
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PantryAddOverdueProductsRequest'
      responses:
        '200':
          description: 追加・更新した項目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryShoppingListChangeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /pantry/shopping-lists/{shopping_list_id}/clear:
    parameters:
      - $ref: '#/components/parameters/PantryShoppingListId'
    post:
      operationId: pantryClearShoppingList
      tags: [pantry]
      summary: 買い物リストの項目を一括削除する
      description: done_only が true（既定）なら購入済みの項目だけを削除する。
      x-lifepipe-requirements: [PAN-UC-17]
      x-lifepipe-priority: mvp
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PantryShoppingListClearRequest'
      responses:
        '200':
          description: 削除した件数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryShoppingListClearResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /pantry/settings:
    get:
      operationId: pantryGetSettings
      tags: [pantry]
      summary: 世帯の在庫設定を取得する
      x-lifepipe-requirements: [PAN-UC-19, PAN-UC-13, PAN-BR-07, PAN-BR-20]
      x-lifepipe-priority: mvp
      responses:
        '200':
          description: 在庫設定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantrySettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: pantryUpdateSettings
      tags: [pantry]
      summary: 世帯の在庫設定を更新する
      description: due_soon_days は 0 以上の整数（PAN-BR-07）。auto_add_below_min_stock で自動追加を切り替える（PAN-BR-20）。
      x-lifepipe-requirements: [PAN-UC-19, PAN-UC-13, PAN-BR-07, PAN-BR-20]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PantrySettingsUpdate'
      responses:
        '200':
          description: 更新した在庫設定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantrySettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  parameters:
    PantryProductId:
      name: product_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PantryProductGroupId:
      name: product_group_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PantryProductGroupIdQuery:
      name: product_group_id
      in: query
      description: 商品グループで絞り込む
      schema:
        type: string
        format: uuid
    PantryQuantityUnitId:
      name: quantity_unit_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PantryQuantityUnitConversionId:
      name: conversion_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PantryLocationId:
      name: location_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PantryStockEntryId:
      name: stock_entry_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PantryShoppingListId:
      name: shopping_list_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PantryShoppingListItemId:
      name: item_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    # ---- enums ----
    PantryDueDateType:
      type: string
      description: best_before は賞味期限（超過しても消費できる）、expiration は消費期限（超過は廃棄の候補）（PAN-BR-04）
      enum: [best_before, expiration]
    PantryDueStatus:
      type: string
      description: 期限の状態（PAN-BR-07）
      enum: [ok, due_soon, overdue, expired]
    PantryDueFilterStatus:
      type: string
      description: 期限の近い在庫の取得で絞り込む状態（PAN-BR-08）
      enum: [due_soon, overdue, expired]
    PantryOverdueStatus:
      type: string
      enum: [overdue, expired]
    PantryStockTransactionType:
      type: string
      enum: [purchase, consume, open, transfer_from, transfer_to, inventory_correction, stock_edit]
    PantryStockTransactionSource:
      type: string
      enum: [manual, shopping_list, ingest_purchase, auto]
    PantryShoppingListItemOrigin:
      type: string
      enum: [manual, below_min_stock, overdue, expired]
    PantryShoppingListItemSort:
      type: string
      description: product_group は後回しの機能（PAN-UC-26）
      enum: [created_at, product_group]
      default: created_at
    PantryWarningCode:
      type: string
      description: |
        due_date_today_or_past: 期限日が今日以前（PAN-BR-06）。
        due_date_earlier_than_existing: 既存の在庫エントリの最も早い期限日より前（PAN-BR-17）。
      enum: [due_date_today_or_past, due_date_earlier_than_existing]
    PantryUnmatchedReason:
      type: string
      enum: [no_match, multiple_matches]

    # ---- common value types ----
    PantryMoney:
      type: string
      description: 10 進数の金額
      pattern: '^-?\d+(\.\d{1,4})?$'
      example: '198.00'
    PantryCurrency:
      type: string
      description: ISO 4217 の通貨コード
      pattern: '^[A-Z]{3}$'
      example: JPY
    PantryWarning:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/PantryWarningCode'
        message:
          type: string
    PantryPriceInput:
      type: object
      description: unit_price（購入した単位あたり）か total_price のどちらか一方と currency を送る。両方は 422（PAN-BR-16）
      properties:
        unit_price:
          $ref: '#/components/schemas/PantryMoney'
        total_price:
          $ref: '#/components/schemas/PantryMoney'
        currency:
          $ref: '#/components/schemas/PantryCurrency'

    # ---- Product ----
    PantryProduct:
      type: object
      required:
        - id
        - name
        - default_location_id
        - stock_quantity_unit_id
        - purchase_quantity_unit_id
        - consume_quantity_unit_id
        - min_stock_amount
        - due_date_type
        - treat_opened_as_out_of_stock
        - can_be_opened
        - quick_consume_amount
        - active
        - stock_summary
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          description: 世帯内で一意（PAN-BR-01）
        description:
          type: string
          nullable: true
        product_group_id:
          type: string
          format: uuid
          nullable: true
        default_location_id:
          type: string
          format: uuid
        default_consume_location_id:
          type: string
          format: uuid
          nullable: true
          description: 消費時に優先する保管場所（PAN-BR-11）
        stock_quantity_unit_id:
          type: string
          format: uuid
          description: 在庫数量の基準単位
        purchase_quantity_unit_id:
          type: string
          format: uuid
        consume_quantity_unit_id:
          type: string
          format: uuid
        min_stock_amount:
          type: number
          format: double
          minimum: 0
          description: 最低在庫数（在庫単位、小数第 4 位まで、PAN-BR-02）。0 は管理しない
        due_date_type:
          $ref: '#/components/schemas/PantryDueDateType'
        default_due_days:
          type: integer
          minimum: -1
          nullable: true
          description: 購入日から期限までの既定日数。-1 は期限なし。null は購入時に期限の入力が必要（PAN-BR-06）
        default_due_days_after_open:
          type: integer
          minimum: 0
          nullable: true
          description: 開封後の期限日数（PAN-BR-14）
        default_due_days_after_freezing:
          type: integer
          minimum: -1
          nullable: true
          description: 冷凍庫へ移したときの期限日数。-1 は期限なし、0 は変えない（PAN-BR-23）
        default_due_days_after_thawing:
          type: integer
          minimum: -1
          nullable: true
          description: 冷凍庫から出したときの期限日数。-1 は期限なし、0 は変えない（PAN-BR-23）
        treat_opened_as_out_of_stock:
          type: boolean
          description: 開封済みの在庫を最低在庫の判定で在庫なしと数えるか（PAN-BR-19）
        can_be_opened:
          type: boolean
        quick_consume_amount:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: ワンタップ消費の数量（消費単位）
        active:
          type: boolean
          description: false は一覧・期限・最低在庫・自動追加の対象外（PAN-BR-03）
        stock_summary:
          $ref: '#/components/schemas/PantryStockSummary'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PantryProductCreate:
      type: object
      required: [name, default_location_id, stock_quantity_unit_id]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        product_group_id:
          type: string
          format: uuid
          nullable: true
        default_location_id:
          type: string
          format: uuid
        default_consume_location_id:
          type: string
          format: uuid
          nullable: true
        stock_quantity_unit_id:
          type: string
          format: uuid
        purchase_quantity_unit_id:
          type: string
          format: uuid
          description: 省略すると在庫単位
        consume_quantity_unit_id:
          type: string
          format: uuid
          description: 省略すると在庫単位
        min_stock_amount:
          type: number
          format: double
          minimum: 0
          default: 0
        due_date_type:
          $ref: '#/components/schemas/PantryDueDateType'
        default_due_days:
          type: integer
          minimum: -1
          nullable: true
        default_due_days_after_open:
          type: integer
          minimum: 0
          nullable: true
        default_due_days_after_freezing:
          type: integer
          minimum: -1
          nullable: true
        default_due_days_after_thawing:
          type: integer
          minimum: -1
          nullable: true
        treat_opened_as_out_of_stock:
          type: boolean
          default: true
        can_be_opened:
          type: boolean
          default: true
        quick_consume_amount:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          default: 1
        active:
          type: boolean
          default: true
    PantryProductUpdate:
      type: object
      description: 送った項目だけを更新する。stock_quantity_unit_id の変更は PAN-BR-18
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        product_group_id:
          type: string
          format: uuid
          nullable: true
        default_location_id:
          type: string
          format: uuid
        default_consume_location_id:
          type: string
          format: uuid
          nullable: true
        stock_quantity_unit_id:
          type: string
          format: uuid
        purchase_quantity_unit_id:
          type: string
          format: uuid
        consume_quantity_unit_id:
          type: string
          format: uuid
        min_stock_amount:
          type: number
          format: double
          minimum: 0
        due_date_type:
          $ref: '#/components/schemas/PantryDueDateType'
        default_due_days:
          type: integer
          minimum: -1
          nullable: true
        default_due_days_after_open:
          type: integer
          minimum: 0
          nullable: true
        default_due_days_after_freezing:
          type: integer
          minimum: -1
          nullable: true
        default_due_days_after_thawing:
          type: integer
          minimum: -1
          nullable: true
        treat_opened_as_out_of_stock:
          type: boolean
        can_be_opened:
          type: boolean
        quick_consume_amount:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        active:
          type: boolean
    PantryProductPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PantryProduct'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    PantryProductMergeRequest:
      type: object
      required: [target_product_id]
      properties:
        target_product_id:
          type: string
          format: uuid
          description: 統合先の商品。パスの商品とは別の商品
    PantryProductQuantityUnit:
      type: object
      required: [quantity_unit, factor_to_stock_unit, is_stock_unit, is_purchase_unit, is_consume_unit]
      properties:
        quantity_unit:
          $ref: '#/components/schemas/PantryQuantityUnit'
        factor_to_stock_unit:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: この単位 1 が在庫単位の何単位か（PAN-BR-10 で解決した値）
        is_stock_unit:
          type: boolean
        is_purchase_unit:
          type: boolean
        is_consume_unit:
          type: boolean
    PantryProductQuantityUnitPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PantryProductQuantityUnit'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    # ---- ProductGroup ----
    PantryProductGroup:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          description: 世帯内で一意（PAN-BR-01）
        sort_order:
          type: integer
          nullable: true
          description: 買い物リストでの並び順
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PantryProductGroupCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        sort_order:
          type: integer
          nullable: true
    PantryProductGroupUpdate:
      type: object
      properties:
        name:
