        page:
          type: integer
        page_size:
          type: integer

    # ---- Location ----
    PantryLocation:
      type: object
      required: [id, name, is_freezer, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          description: 世帯内で一意（PAN-BR-01）
        description:
          type: string
          nullable: true
        is_freezer:
          type: boolean
          description: 冷凍庫か（PAN-BR-23）
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PantryLocationCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        is_freezer:
          type: boolean
          default: false
    PantryLocationUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        is_freezer:
          type: boolean
    PantryLocationPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PantryLocation'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    # ---- Stock ----
    PantryStockEntry:
      type: object
      required: [id, product_id, location_id, amount, purchased_date, opened, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        amount:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: 残数量（在庫単位、小数第 4 位まで、PAN-BR-02）。0 になったエントリは削除する
        due_date:
          type: string
          format: date
          nullable: true
          description: null は期限なし（PAN-BR-05）
        purchased_date:
          type: string
          format: date
        opened:
          type: boolean
        opened_date:
          type: string
          format: date
          nullable: true
          description: opened が true のとき必ず値を持つ
        unit_price:
          allOf:
            - $ref: '#/components/schemas/PantryMoney'
          type: string
          nullable: true
          description: 在庫単位あたりの購入価格
        currency:
          allOf:
            - $ref: '#/components/schemas/PantryCurrency'
          type: string
          nullable: true
          description: unit_price の通貨。unit_price があるとき必ず値を持つ
        note:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          description: 先入れ先出しの基準（PAN-BR-11）
        updated_at:
          type: string
          format: date-time
    PantryStockEntryUpdate:
      type: object
      description: 送った項目だけを更新する（後回し、PAN-UC-22）
      properties:
        due_date:
          type: string
          format: date
          nullable: true
        location_id:
          type: string
          format: uuid
        amount:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: 在庫単位
        note:
          type: string
          nullable: true
    PantryStockEntryPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PantryStockEntry'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    PantryStockSummary:
      type: object
      description: 商品の在庫の要約（数量は在庫単位）
      required: [amount, opened_amount, below_min_stock, missing_amount]
      properties:
        amount:
          type: number
          format: double
          minimum: 0
          description: 在庫エントリの数量の合計
        opened_amount:
          type: number
          format: double
          minimum: 0
          description: 開封済みのエントリの数量の合計
        next_due_date:
          type: string
          format: date
          nullable: true
          description: 在庫エントリのうち最も早い期限日。期限のあるエントリがなければ null（PAN-BR-08）
        next_due_status:
          allOf:
            - $ref: '#/components/schemas/PantryDueStatus'
          type: string
          nullable: true
          description: next_due_date の期限の状態（PAN-BR-07）
        below_min_stock:
          type: boolean
          description: 最低在庫を下回っているか（PAN-BR-19）
        missing_amount:
          type: number
          format: double
          minimum: 0
          description: 不足量。下回っていなければ 0（PAN-BR-19）
    PantryProductStock:
      type: object
      required: [product_id, stock_quantity_unit_id, summary, entries]
      properties:
        product_id:
          type: string
          format: uuid
        stock_quantity_unit_id:
          type: string
          format: uuid
        summary:
          $ref: '#/components/schemas/PantryStockSummary'
        entries:
          type: array
          description: PAN-BR-11 の消費順
          items:
            $ref: '#/components/schemas/PantryStockEntry'
    PantryStockOverview:
      type: object
      required: [product_id, product_name, stock_quantity_unit_id, min_stock_amount, due_date_type, summary]
      properties:
        product_id:
          type: string
          format: uuid
        product_name:
          type: string
        product_group_id:
          type: string
          format: uuid
          nullable: true
        stock_quantity_unit_id:
          type: string
          format: uuid
        min_stock_amount:
          type: number
          format: double
          minimum: 0
        due_date_type:
          $ref: '#/components/schemas/PantryDueDateType'
        summary:
          $ref: '#/components/schemas/PantryStockSummary'
    PantryStockOverviewPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PantryStockOverview'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    PantryDueStockEntry:
      type: object
      description: 期限の近い在庫エントリ（get_morning_briefing 用）
      required: [stock_entry, product_name, location_name, stock_quantity_unit_id, due_date_type, due_status, days_until_due]
      properties:
        stock_entry:
          $ref: '#/components/schemas/PantryStockEntry'
        product_name:
          type: string
        location_name:
          type: string
        stock_quantity_unit_id:
          type: string
          format: uuid
        due_date_type:
          $ref: '#/components/schemas/PantryDueDateType'
        due_status:
          $ref: '#/components/schemas/PantryDueFilterStatus'
        days_until_due:
          type: integer
          description: due_date - 今日（世帯のタイムゾーン）。負なら期限を過ぎている（PAN-BR-07）
    PantryDueStockEntryPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PantryDueStockEntry'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    PantryMissingProduct:
      type: object
      required:
        - product_id
        - product_name
        - min_stock_amount
        - stock_amount
        - missing_amount
        - stock_quantity_unit_id
        - missing_amount_in_purchase_unit
        - purchase_quantity_unit_id
        - amount_on_default_shopping_list
      properties:
        product_id:
          type: string
          format: uuid
        product_name:
          type: string
        product_group_id:
          type: string
          format: uuid
          nullable: true
        min_stock_amount:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        stock_amount:
          type: number
          format: double
          minimum: 0
          description: 判定用の在庫数量（treat_opened_as_out_of_stock を反映、在庫単位、PAN-BR-19）
        missing_amount:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: 不足量（在庫単位）
        stock_quantity_unit_id:
          type: string
          format: uuid
        missing_amount_in_purchase_unit:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: 不足量（購入単位、切り上げない、PAN-BR-22）
        purchase_quantity_unit_id:
          type: string
          format: uuid
        amount_on_default_shopping_list:
          type: number
          format: double
          minimum: 0
          description: 既定の買い物リストにある未購入の同じ商品の数量の合計（在庫単位、PAN-BR-21）
    PantryMissingProductPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PantryMissingProduct'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    # ---- StockTransaction ----
    PantryStockTransaction:
      type: object
      required:
        - id
        - correlation_id
        - type
        - product_id
        - stock_entry_id
        - location_id
        - amount
        - spoiled
        - source
        - user_id
        - undone
        - created_at
      properties:
        id:
          type: string
          format: uuid
        correlation_id:
          type: string
          format: uuid
          description: 1 回の操作で作られた履歴をまとめる ID（PAN-BR-12）
        type:
          $ref: '#/components/schemas/PantryStockTransactionType'
        product_id:
          type: string
          format: uuid
        stock_entry_id:
          type: string
          format: uuid
          description: 対象の在庫エントリ（削除済みでも残る）
        location_id:
          type: string
          format: uuid
        amount:
          type: number
          format: double
          description: 増減量（在庫単位）。増加は正、減少は負
        spoiled:
          type: boolean
          description: 廃棄による消費か。type が consume のときだけ true になりうる（PAN-BR-15）
        due_date:
          type: string
          format: date
          nullable: true
        unit_price:
          allOf:
            - $ref: '#/components/schemas/PantryMoney'
          type: string
          nullable: true
        currency:
          allOf:
            - $ref: '#/components/schemas/PantryCurrency'
          type: string
          nullable: true
        source:
          $ref: '#/components/schemas/PantryStockTransactionSource'
        user_id:
          type: string
          description: 操作した利用者（ゲートウェイが渡す ID）
        undone:
          type: boolean
          description: 取り消し済みか（後回し、PAN-BR-30）
        undone_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    PantryStockTransactionPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PantryStockTransaction'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    # ---- stock operations ----
    PantryPurchaseRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: 購入数量（quantity_unit_id の単位）
        quantity_unit_id:
          type: string
          format: uuid
          description: 省略すると商品の購入単位。その商品で換算できる単位に限る（PAN-BR-10）
        due_date:
          type: string
          format: date
          description: 省略すると PAN-BR-06 で決める
        no_due_date:
          type: boolean
          default: false
          description: true なら期限なし（due_date を null）で登録する。due_date と同時には指定できない
        location_id:
          type: string
          format: uuid
          description: 省略すると商品の既定の保管場所（PAN-BR-16）
        purchased_date:
          type: string
          format: date
          description: 省略すると今日
        price:
          $ref: '#/components/schemas/PantryPriceInput'
        note:
          type: string
          nullable: true
    PantryPurchaseResult:
      type: object
      required: [correlation_id, stock_entry, transactions, warnings]
      properties:
        correlation_id:
          type: string
          format: uuid
        stock_entry:
          $ref: '#/components/schemas/PantryStockEntry'
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/PantryStockTransaction'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/PantryWarning'
    PantryConsumeRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        quantity_unit_id:
          type: string
          format: uuid
          description: 省略すると商品の消費単位
        location_id:
          type: string
          format: uuid
          description: 指定するとその場所の在庫だけを対象にする（PAN-BR-11）
        stock_entry_id:
          type: string
          format: uuid
          description: 指定するとそのエントリだけから引く
        spoiled:
          type: boolean
          default: false
          description: true なら廃棄（PAN-BR-15）
    PantryOpenRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        quantity_unit_id:
          type: string
          format: uuid
          description: 省略すると商品の消費単位
        location_id:
          type: string
          format: uuid
        stock_entry_id:
          type: string
          format: uuid
          description: 未開封のエントリに限る
    PantryTransferRequest:
      type: object
      required: [amount, from_location_id, to_location_id]
      properties:
        amount:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        quantity_unit_id:
          type: string
          format: uuid
          description: 省略すると在庫単位
        from_location_id:
          type: string
          format: uuid
        to_location_id:
          type: string
          format: uuid
          description: from_location_id と異なる
        stock_entry_id:
          type: string
          format: uuid
          description: 指定するとそのエントリだけを移す。from_location_id にあるエントリに限る
    PantryInventoryRequest:
      type: object
      required: [new_amount]
      properties:
        new_amount:
          type: number
          format: double
          minimum: 0
          description: 実数（quantity_unit_id の単位）
        quantity_unit_id:
          type: string
          format: uuid
          description: 省略すると在庫単位
        due_date:
          type: string
          format: date
          nullable: true
          description: 増える場合の新しいエントリの期限日。省略すると PAN-BR-06 で決める
        location_id:
          type: string
          format: uuid
          description: 増える場合の新しいエントリの保管場所。省略すると商品の既定の保管場所
    PantryStockOperationResult:
      type: object
      required: [correlation_id, transactions, stock_entries, deleted_stock_entry_ids, shopping_list_items]
      properties:
        correlation_id:
          type: string
          format: uuid
        transactions:
          type: array
          description: 今回記録（または取り消し）した履歴
          items:
            $ref: '#/components/schemas/PantryStockTransaction'
        stock_entries:
          type: array
          description: 変更後の在庫エントリ（作成・分割・更新したもの）
          items:
            $ref: '#/components/schemas/PantryStockEntry'
        deleted_stock_entry_ids:
          type: array
          description: 数量が 0 になって削除した在庫エントリ（PAN-BR-12）
          items:
            type: string
            format: uuid
        shopping_list_items:
          type: array
          description: 自動追加で作成・加算した既定の買い物リストの項目（PAN-BR-20、PAN-BR-21）
          items:
            $ref: '#/components/schemas/PantryShoppingListItem'
    PantryIngestPurchaseItem:
      type: object
      description: product_id か name のどちらかで商品を指定する（PAN-BR-25）
      required: [amount]
      properties:
        product_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          description: 正規化（大文字小文字と前後の空白を区別しない）した完全一致で有効な商品名と照合する
        amount:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        quantity_unit_id:
          type: string
          format: uuid
          description: 省略すると商品の購入単位
        due_date:
          type: string
          format: date
        no_due_date:
          type: boolean
          default: false
        location_id:
          type: string
          format: uuid
        price:
          $ref: '#/components/schemas/PantryPriceInput'
        note:
          type: string
          nullable: true
    PantryIngestPurchaseRequest:
      type: object
      required: [items]
      properties:
        shopping_list_id:
          type: string
          format: uuid
          description: 消し込む買い物リスト。省略すると既定のリスト
        purchased_date:
          type: string
          format: date
          description: 全品目の購入日。省略すると今日
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PantryIngestPurchaseItem'
    PantryIngestPurchaseItemResult:
      type: object
      required: [index, product_id, stock_entry, warnings]
      properties:
        index:
          type: integer
          minimum: 0
          description: リクエストの items での位置
        product_id:
          type: string
          format: uuid
        stock_entry:
          $ref: '#/components/schemas/PantryStockEntry'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/PantryWarning'
    PantryProductCandidate:
      type: object
      required: [product_id, name]
      properties:
        product_id:
          type: string
          format: uuid
        name:
          type: string
    PantryUnmatchedPurchaseItem:
      type: object
      required: [index, reason, candidates]
      properties:
        index:
          type: integer
          minimum: 0
          description: リクエストの items での位置
        name:
          type: string
          nullable: true
        reason:
          $ref: '#/components/schemas/PantryUnmatchedReason'
        candidates:
          type: array
          description: 候補の商品（あれば）
          items:
            $ref: '#/components/schemas/PantryProductCandidate'
    PantryIngestPurchaseResult:
      type: object
      required: [correlation_id, registered_items, completed_shopping_list_items, reduced_shopping_list_items, unmatched_items]
      properties:
        correlation_id:
          type: string
          format: uuid
          description: この購入報告で記録した履歴をまとめる ID
        registered_items:
          type: array
          items:
            $ref: '#/components/schemas/PantryIngestPurchaseItemResult'
        completed_shopping_list_items:
          type: array
          description: done=true にした項目
          items:
            $ref: '#/components/schemas/PantryShoppingListItem'
        reduced_shopping_list_items:
          type: array
          description: 数量を減らして done=false のまま残した項目
          items:
            $ref: '#/components/schemas/PantryShoppingListItem'
        unmatched_items:
          type: array
          description: 商品を特定できず登録しなかった品目
          items:
            $ref: '#/components/schemas/PantryUnmatchedPurchaseItem'

    # ---- ShoppingList ----
    PantryShoppingList:
      type: object
      required: [id, name, is_default, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          description: 世帯内で一意（PAN-BR-01）
        is_default:
          type: boolean
          description: 既定のリストか。世帯に 1 つだけ true（PAN-BR-26）
        note:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PantryShoppingListCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        note:
          type: string
          nullable: true
    PantryShoppingListUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        note:
          type: string
          nullable: true
    PantryShoppingListPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PantryShoppingList'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    PantryShoppingListItem:
      type: object
      required: [id, shopping_list_id, amount, done, origin, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        shopping_list_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
          nullable: true
          description: null は自由記述の項目（PAN-BR-27）
        note:
          type: string
          nullable: true
          description: product_id が null のとき必ず値を持つ
        amount:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: 数量（小数第 4 位まで、PAN-BR-02）。表示の切り上げはクライアント側（PAN-BR-22）
        quantity_unit_id:
          type: string
          format: uuid
          nullable: true
          description: product_id があるときは必ず値を持つ
        done:
          type: boolean
        done_at:
          type: string
          format: date-time
          nullable: true
        origin:
          $ref: '#/components/schemas/PantryShoppingListItemOrigin'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PantryShoppingListItemCreate:
      type: object
      description: product_id がなければ note が必須。product_id があれば quantity_unit_id が必須（PAN-BR-27）
      required: [amount]
      properties:
        product_id:
          type: string
          format: uuid
          nullable: true
        note:
          type: string
          nullable: true
        amount:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        quantity_unit_id:
          type: string
          format: uuid
          nullable: true
    PantryShoppingListItemUpdate:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
          nullable: true
        note:
          type: string
          nullable: true
        amount:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        quantity_unit_id:
          type: string
          format: uuid
          nullable: true
        done:
          type: boolean
          description: 在庫は変えない。false に戻しても在庫は戻さない（PAN-BR-24）
    PantryShoppingListItemPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PantryShoppingListItem'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    PantryShoppingListItemDoneRequest:
      type: object
      properties:
        add_to_stock:
          type: boolean
          default: true
          description: true なら項目の数量・単位で在庫へ登録する。自由記述の項目では無視する（PAN-BR-24、PAN-BR-27）
        due_date:
          type: string
          format: date
          description: 省略すると PAN-BR-06 で決める
        no_due_date:
          type: boolean
          default: false
        location_id:
          type: string
          format: uuid
          description: 省略すると商品の既定の保管場所
        price:
          $ref: '#/components/schemas/PantryPriceInput'
    PantryShoppingListItemDoneResult:
      type: object
      required: [item]
      properties:
        item:
          $ref: '#/components/schemas/PantryShoppingListItem'
        purchase:
          allOf:
            - $ref: '#/components/schemas/PantryPurchaseResult'
          type: object
          nullable: true
          description: 在庫へ登録したときの結果。登録しなければ null
    PantryAddOverdueProductsRequest:
      type: object
      properties:
        status:
          type: array
          description: 対象にする状態。省略すると overdue と expired の両方
          minItems: 1
          items:
            $ref: '#/components/schemas/PantryOverdueStatus'
    PantryShoppingListChangeResult:
      type: object
      required: [created_items, updated_items]
      properties:
        created_items:
          type: array
          items:
            $ref: '#/components/schemas/PantryShoppingListItem'
        updated_items:
          type: array
          description: 数量を加算した既存の未購入の項目
          items:
            $ref: '#/components/schemas/PantryShoppingListItem'
    PantryShoppingListClearRequest:
      type: object
      properties:
        done_only:
          type: boolean
          default: true
          description: true なら購入済みの項目だけを削除する
    PantryShoppingListClearResult:
      type: object
      required: [deleted_count]
      properties:
        deleted_count:
          type: integer
          minimum: 0

    # ---- Settings ----
    PantrySettings:
      type: object
      required: [due_soon_days, auto_add_below_min_stock, updated_at]
      properties:
        due_soon_days:
          type: integer
          minimum: 0
          default: 3
          description: 期限が近いとみなす日数（PAN-BR-07）
        auto_add_below_min_stock:
          type: boolean
          default: false
          description: 最低在庫を下回ったとき既定の買い物リストへ自動追加するか（PAN-BR-20）
        updated_at:
          type: string
          format: date-time
    PantrySettingsUpdate:
      type: object
      properties:
        due_soon_days:
          type: integer
          minimum: 0
        auto_add_below_min_stock:
          type: boolean
