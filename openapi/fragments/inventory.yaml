      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InventoryMaintenanceEntry'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    # ---- Item template ----
    InventoryItemTemplateDefaults:
      type: object
      description: 物品作成時に入れる既定値（Item の入力項目の部分集合）
