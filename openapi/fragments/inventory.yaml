# inventory fragment
paths:
  /inventory/locations:
    get:
      operationId: inventoryListLocations
      tags: [inventory]
      summary: 保管場所の一覧を取得する
      description: |
        保管場所を一覧で返す。各要素に item_count と path（最上位からの経路）を含める。
        parent_id で直下の子に、root_only=true で最上位だけに絞り込める。
      x-lifepipe-requirements: [INV-UC-05, INV-UC-06]
      x-lifepipe-priority: mvp
      parameters:
        - name: parent_id
          in: query
          required: false
          description: この保管場所の直下の子だけを返す
          schema:
            type: string
            format: uuid
        - name: root_only
          in: query
          required: false
          description: true なら最上位（親を持たない）の保管場所だけを返す
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/InventoryQ'
        - $ref: '#/components/parameters/InventoryTagIds'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 保管場所の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLocationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: inventoryCreateLocation
      tags: [inventory]
      summary: 保管場所を作成する
      description: |
        保管場所を作成する。parent_id を指定すると入れ子にできる。
        存在しない parent_id は 422（INV-BR-01）。同じ親の下で名前が重複したら 409（大文字小文字を区別しない、INV-BR-04）。
        カスタムフィールド名の重複は 422（INV-BR-19）。
      x-lifepipe-requirements: [INV-UC-01, INV-BR-01, INV-BR-04, INV-BR-19, INV-BR-20]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryLocationCreate'
      responses:
        '201':
          description: 作成した保管場所
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLocation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /inventory/locations/tree:
    get:
      operationId: inventoryGetLocationTree
      tags: [inventory]
      summary: 保管場所の階層を木構造で取得する
      description: |
        保管場所の階層を入れ子の木構造で返す。with_items=true なら各場所に直接置かれた物品も含める。
        root_id を指定すると、その場所を根とする部分木を返す。
      x-lifepipe-requirements: [INV-UC-05]
      x-lifepipe-priority: mvp
      parameters:
        - name: with_items
          in: query
          required: false
          description: true なら各場所に置かれた物品を含める
          schema:
            type: boolean
            default: false
        - name: root_id
          in: query
          required: false
          description: 部分木の根にする保管場所。省略時は最上位の場所すべて
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 保管場所の木構造
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLocationTree'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /inventory/locations/{location_id}:
    parameters:
      - $ref: '#/components/parameters/InventoryLocationId'
    get:
      operationId: inventoryGetLocation
      tags: [inventory]
      summary: 保管場所の詳細を取得する
      description: |
        保管場所の詳細を返す。経路（path）、子の場所、直接置かれた物品、評価額合計（total_value）を含める。
        評価額合計は子孫の場所の物品を含み、売却済みを除いた purchase_price × quantity の通貨ごとの合計（INV-BR-12）。
      x-lifepipe-requirements: [INV-UC-06, INV-BR-12]
      x-lifepipe-priority: mvp
      responses:
        '200':
          description: 保管場所の詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLocationDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: inventoryUpdateLocation
      tags: [inventory]
      summary: 保管場所を編集・移動する
      description: |
        送った項目だけを更新する。parent_id の変更が移動で、子の場所と置かれた物品も一緒に移る。parent_id を null にすると最上位へ移る（INV-BR-03）。
        自分自身または子孫を親に指定したら 409（INV-BR-02）。存在しない parent_id は 422（INV-BR-01）。
        同じ親の下での名前の重複は 409（INV-BR-04）。カスタムフィールド名の重複は 422（INV-BR-19）。
      x-lifepipe-requirements: [INV-UC-02, INV-UC-03, INV-UC-13, INV-BR-01, INV-BR-02, INV-BR-03, INV-BR-04, INV-BR-19, INV-BR-20]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryLocationUpdate'
      responses:
        '200':
          description: 更新後の保管場所
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLocation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: inventoryDeleteLocation
      tags: [inventory]
      summary: 保管場所を削除する
      description: |
        子の場所も物品も無いときだけ削除できる。残っていれば 409 を返す（INV-BR-05）。
      x-lifepipe-requirements: [INV-UC-04, INV-BR-05]
      x-lifepipe-priority: mvp
      responses:
        '204':
          description: 削除した
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /inventory/items:
    get:
      operationId: inventoryListItems
      tags: [inventory]
      summary: 物品を検索・一覧する
      description: |
        物品を検索して返す。各要素に location_path（置き場所の経路）を含め、応答に total と total_value を含める。
        キーワード（q）は空白区切りの全語を含むものを返し、二重引用符の語句は語順どおりに一致させる。大文字小文字は区別しない。先頭が「#」なら資産番号で検索する（INV-BR-23）。
        場所の絞り込みは既定で子孫の場所を含む（include_descendants）。タグはいずれかを持つもの、negate_tags=true で持たないもの（INV-BR-23）。
        fields は「名前=値」の完全一致を AND で絞り込む（INV-BR-21）。
        warranty_status は基準日（当日）と warranty_within_days（既定 30 日）で計算する（INV-BR-10）。
        archived の物品は include_archived=true のときだけ返す（INV-BR-14）。売却済みは既定で返す（INV-BR-13）。
      x-lifepipe-requirements: [INV-UC-11, INV-UC-12, INV-UC-19, INV-UC-21, INV-BR-10, INV-BR-12, INV-BR-13, INV-BR-14, INV-BR-21, INV-BR-23]
      x-lifepipe-priority: mvp
      parameters:
        - $ref: '#/components/parameters/InventoryQ'
        - name: location_id
          in: query
          required: false
          description: この保管場所に置かれた物品に絞り込む
          schema:
            type: string
            format: uuid
        - name: include_descendants
          in: query
          required: false
          description: location_id の絞り込みで子孫の場所を含めるか（INV-BR-23）
          schema:
            type: boolean
            default: true
        - name: parent_item_id
          in: query
          required: false
          description: この物品を親に持つ物品に絞り込む
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/InventoryTagIds'
        - name: negate_tags
          in: query
          required: false
          description: true なら tag_ids のどれも持たない物品を返す（INV-BR-23）
          schema:
            type: boolean
            default: false
        - name: fields
          in: query
          required: false
          description: カスタムフィールドの「名前=値」。完全一致（大文字小文字を区別しない）で、複数指定は AND（INV-BR-21）
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              pattern: '^[^=]+=.*$'
              maxLength: 1256
          example: ['消費電力=1200W']
        - name: warranty_status
          in: query
          required: false
          description: 保証の状態で絞り込む（INV-BR-10）
          schema:
            $ref: '#/components/schemas/InventoryWarrantyStatus'
        - name: warranty_expires_before
          in: query
          required: false
          description: 保証期限がこの日以前の物品に絞り込む
          schema:
            type: string
            format: date
        - name: warranty_within_days
          in: query
          required: false
          description: expiring_soon と判定する残り日数 N（INV-BR-10）
          schema:
            type: integer
            minimum: 0
            default: 30
        - name: sold
          in: query
          required: false
          description: true なら売却・処分済み（sold_date あり）だけ、false なら未売却だけを返す。省略時は両方（INV-BR-13）
          schema:
            type: boolean
        - name: include_archived
          in: query
          required: false
          description: true ならアーカイブ済みの物品も返す（INV-BR-14）
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          required: false
          description: 並び順のキー
          schema:
            $ref: '#/components/schemas/InventoryItemSort'
        - $ref: '#/components/parameters/InventorySortOrder'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 物品の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: inventoryCreateItem
      tags: [inventory]
      summary: 物品を登録する
      description: |
        物品を登録する。資産番号を指定しなければ、自動採番が有効なら既存の最大番号の次を振る（INV-BR-15）。
        parent_item_id で親の物品を指定できる。親は物品に限り、循環は 409（INV-BR-06）。
        子の物品の location_id は省略すると親の場所が入り、親と違う場所は 422（INV-BR-07）。親が無いときは location_id が必須（無ければ 422）。
        lifetime_warranty と warranty_expires の両方指定、または保証期限が購入日より前なら 422（INV-BR-09）。
        数量は 0 以上の整数、価格は 0 以上（INV-BR-11）。カスタムフィールド名の重複は 422（INV-BR-19）。
      x-lifepipe-requirements: [INV-UC-07, INV-UC-13, INV-UC-16, INV-BR-06, INV-BR-07, INV-BR-09, INV-BR-11, INV-BR-15, INV-BR-19, INV-BR-20]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryItemCreate'
      responses:
        '201':
          description: 登録した物品
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /inventory/items/{item_id}:
    parameters:
      - $ref: '#/components/parameters/InventoryItemId'
    get:
      operationId: inventoryGetItem
      tags: [inventory]
      summary: 物品の詳細を取得する
      description: |
        物品の詳細を返す。location_path、子の物品、添付ファイルの一覧を含める。
      x-lifepipe-requirements: [INV-UC-11]
      x-lifepipe-priority: mvp
      responses:
        '200':
          description: 物品の詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: inventoryUpdateItem
      tags: [inventory]
      summary: 物品を編集・移動する
      description: |
        送った項目だけを更新する。location_id の変更が移動で、子孫の物品の location_id も同じ場所に更新する（INV-BR-07）。
        parent_item_id の循環は 409（INV-BR-06）。子の物品に親と違う場所を指定したら 422（INV-BR-07）。
        売却・処分は sold_date などで記録する（INV-BR-13）。archived=true でアーカイブする（INV-BR-14）。
        保証の組み合わせの検証は INV-BR-09、数値の範囲は INV-BR-11、カスタムフィールドは INV-BR-19。
      x-lifepipe-requirements: [INV-UC-08, INV-UC-09, INV-UC-13, INV-UC-16, INV-UC-21, INV-BR-06, INV-BR-07, INV-BR-09, INV-BR-11, INV-BR-13, INV-BR-14, INV-BR-19, INV-BR-20]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryItemUpdate'
      responses:
        '200':
          description: 更新後の物品
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: inventoryDeleteItem
      tags: [inventory]
      summary: 物品を削除する
      description: |
        物品と添付ファイルを削除する。子の物品は削除せず、parent_item_id を空にして同じ場所に残す（INV-BR-08）。
      x-lifepipe-requirements: [INV-UC-10, INV-BR-08]
      x-lifepipe-priority: mvp
      responses:
        '204':
          description: 削除した
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /inventory/items/{item_id}/duplicate:
    parameters:
      - $ref: '#/components/parameters/InventoryItemId'
    post:
      operationId: inventoryDuplicateItem
      tags: [inventory]
      summary: 物品を複製する
      description: |
        ID・資産番号・import_ref・source_ref・添付ファイルを除いた項目を写した物品を作る。資産番号は INV-BR-15 で新たに振る（INV-BR-30）。
      x-lifepipe-requirements: [INV-UC-20, INV-BR-30, INV-BR-15]
      x-lifepipe-priority: later
      responses:
        '201':
          description: 複製した物品
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /inventory/tags:
    get:
      operationId: inventoryListTags
      tags: [inventory]
      summary: タグの一覧を取得する
      description: |
        タグを一覧で返す。各要素に item_count を含める。
      x-lifepipe-requirements: [INV-UC-13]
      x-lifepipe-priority: mvp
      parameters:
        - $ref: '#/components/parameters/InventoryQ'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: タグの一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryTagPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: inventoryCreateTag
      tags: [inventory]
      summary: タグを作成する
      description: |
        タグを作成する。名前の重複（大文字小文字を区別しない）は 409（INV-BR-18）。
      x-lifepipe-requirements: [INV-UC-13, INV-BR-18]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryTagCreate'
      responses:
        '201':
          description: 作成したタグ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryTag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /inventory/tags/{tag_id}:
    parameters:
      - $ref: '#/components/parameters/InventoryTagId'
    get:
      operationId: inventoryGetTag
      tags: [inventory]
      summary: タグを取得する
      x-lifepipe-requirements: [INV-UC-13]
      x-lifepipe-priority: mvp
      responses:
        '200':
          description: タグ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryTag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: inventoryUpdateTag
      tags: [inventory]
      summary: タグを編集する
      description: |
        送った項目だけを更新する。名前の重複（大文字小文字を区別しない）は 409（INV-BR-18）。
      x-lifepipe-requirements: [INV-UC-13, INV-BR-18]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryTagUpdate'
      responses:
        '200':
          description: 更新後のタグ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryTag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: inventoryDeleteTag
      tags: [inventory]
      summary: タグを削除する
      description: |
        タグを削除し、物品・保管場所からの付与も外す。物品・保管場所は削除しない（INV-BR-18）。
      x-lifepipe-requirements: [INV-UC-13, INV-BR-18]
      x-lifepipe-priority: mvp
      responses:
        '204':
          description: 削除した
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /inventory/custom-fields:
    get:
      operationId: inventoryListCustomFieldNames
      tags: [inventory]
      summary: 使われているカスタムフィールド名の一覧を取得する
      description: |
        物品・保管場所で使われているカスタムフィールド名を重複なしで返す（入力補完用、INV-BR-21）。owner_type で対象を絞り込める。
      x-lifepipe-requirements: [INV-UC-17, INV-BR-21]
      x-lifepipe-priority: mvp
      parameters:
        - name: owner_type
          in: query
          required: false
          description: 対象の種類。省略時は物品と保管場所の両方
          schema:
            $ref: '#/components/schemas/InventoryOwnerType'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: カスタムフィールド名の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryCustomFieldNamePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /inventory/custom-fields/{field_name}/values:
    parameters:
      - $ref: '#/components/parameters/InventoryCustomFieldName'
    get:
      operationId: inventoryListCustomFieldValues
      tags: [inventory]
      summary: カスタムフィールドの値の一覧を取得する
      description: |
        指定した名前のカスタムフィールドで使われている値を重複なしで返す（入力補完用、INV-BR-21）。
      x-lifepipe-requirements: [INV-UC-17, INV-BR-21]
      x-lifepipe-priority: mvp
      parameters:
        - name: owner_type
          in: query
          required: false
          description: 対象の種類。省略時は物品と保管場所の両方
          schema:
            $ref: '#/components/schemas/InventoryOwnerType'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 値の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryCustomFieldValuePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /inventory/items/{item_id}/attachments:
