    InventoryLabelElement:
      type: object
      description: ラベル上の配置要素。位置・サイズは mm、回転は度
      required: [type, x_mm, y_mm, width_mm, height_mm]
      properties:
        type:
          $ref: '#/components/schemas/InventoryLabelElementType'
        x_mm:
          type: number
        y_mm:
          type: number
        width_mm:
          type: number
          minimum: 0
        height_mm:
          type: number
          minimum: 0
        rotation_deg:
          type: number
          default: 0
        text:
          type: string
          nullable: true
          description: type が text のときの文字列。差し込み項目を含められる（INV-BR-31）
        barcode_type:
          allOf:
            - $ref: '#/components/schemas/InventoryBarcodeType'
          type: string
          nullable: true
          description: type が barcode のときのバーコードの種類
        barcode_data:
          type: string
          nullable: true
          description: type が barcode のときに符号化する元データ。差し込み項目を含められる
        image_attachment_id:
          type: string
          format: uuid
          nullable: true
          description: type が image のときの画像
