        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryItemTemplateCreate'
      responses:
        '201':
          description: 作成した物品テンプレート
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /inventory/item-templates/{template_id}:
    parameters:
      - $ref: '#/components/parameters/InventoryItemTemplateId'
    get:
      operationId: inventoryGetItemTemplate
      tags: [inventory]
      summary: 物品テンプレートを取得する
      x-lifepipe-requirements: [INV-UC-26]
      x-lifepipe-priority: later
      responses:
        '200':
          description: 物品テンプレート
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: inventoryUpdateItemTemplate
      tags: [inventory]
      summary: 物品テンプレートを更新する
      x-lifepipe-requirements: [INV-UC-26]
      x-lifepipe-priority: later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryItemTemplateUpdate'
      responses:
        '200':
          description: 更新後の物品テンプレート
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemTemplate'
        '400':
