          minimum: 0
        updated:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        errors:
          type: array
          items:
            $ref: '#/components/schemas/InventoryCsvImportRowError'
    InventoryCsvImportRowError:
      type: object
      required: [row, message]
      properties:
        row:
          type: integer
          minimum: 1
          description: 行番号（ヘッダー行を 1 とする）
        column:
