          default: false
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    InventoryLabelTemplateCreate:
      type: object
      required: [name, width_mm, height_mm, orientation, elements]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        width_mm:
          type: number
          exclusiveMinimum: true
          minimum: 0
        height_mm:
          type: number
          exclusiveMinimum: true
          minimum: 0
        dpi:
          type: integer
          minimum: 1
          default: 300
        orientation:
          $ref: '#/components/schemas/InventoryLabelOrientation'
        elements:
          type: array
          items:
            $ref: '#/components/schemas/InventoryLabelElement'
        sheet_layout:
          allOf:
            - $ref: '#/components/schemas/InventoryLabelSheetLayout'
          type: object
          nullable: true
        is_default:
          type: boolean
          default: false
    InventoryLabelTemplateUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        width_mm:
          type: number
          exclusiveMinimum: true
          minimum: 0
        height_mm:
          type: number
          exclusiveMinimum: true
          minimum: 0
        dpi:
          type: integer
          minimum: 1
        orientation:
          $ref: '#/components/schemas/InventoryLabelOrientation'
        elements:
          type: array
          items:
            $ref: '#/components/schemas/InventoryLabelElement'
        sheet_layout:
