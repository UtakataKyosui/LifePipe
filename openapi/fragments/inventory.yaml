        completed_date:
          type: string
          format: date
          nullable: true
        cost:
          type: string
          nullable: true
          pattern: '^\d+(\.\d{1,4})?$'
        currency:
          type: string
          nullable: true
          pattern: '^[A-Z]{3}$'
    InventoryMaintenanceEntryPage:
