        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: inventoryDeleteItemTemplate
      tags: [inventory]
      summary: 物品テンプレートを削除する
      x-lifepipe-requirements: [INV-UC-26]
      x-lifepipe-priority: later
      responses:
        '204':
          description: 削除した
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /inventory/label-templates:
    get:
      operationId: inventoryListLabelTemplates
      tags: [inventory]
      summary: ラベル印刷テンプレートの一覧を取得する
      x-lifepipe-requirements: [INV-UC-27]
      x-lifepipe-priority: later
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: ラベル印刷テンプレートの一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLabelTemplatePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: inventoryCreateLabelTemplate
      tags: [inventory]
      summary: ラベル印刷テンプレートを作成する
      description: |
        is_default=true で作成すると、前の既定テンプレートは既定でなくなる。
      x-lifepipe-requirements: [INV-UC-27, INV-BR-31]
      x-lifepipe-priority: later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryLabelTemplateCreate'
      responses:
        '201':
          description: 作成したラベル印刷テンプレート
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLabelTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /inventory/label-templates/{template_id}:
    parameters:
      - $ref: '#/components/parameters/InventoryLabelTemplateId'
    get:
      operationId: inventoryGetLabelTemplate
      tags: [inventory]
      summary: ラベル印刷テンプレートを取得する
      x-lifepipe-requirements: [INV-UC-27]
      x-lifepipe-priority: later
      responses:
        '200':
          description: ラベル印刷テンプレート
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLabelTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: inventoryUpdateLabelTemplate
      tags: [inventory]
      summary: ラベル印刷テンプレートを更新する
      x-lifepipe-requirements: [INV-UC-27, INV-BR-31]
      x-lifepipe-priority: later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryLabelTemplateUpdate'
      responses:
        '200':
          description: 更新後のラベル印刷テンプレート
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLabelTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: inventoryDeleteLabelTemplate
      tags: [inventory]
      summary: ラベル印刷テンプレートを削除する
      x-lifepipe-requirements: [INV-UC-27]
      x-lifepipe-priority: later
      responses:
        '204':
          description: 削除した
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /inventory/label-templates/{template_id}/render:
    parameters:
      - $ref: '#/components/parameters/InventoryLabelTemplateId'
    post:
      operationId: inventoryRenderLabels
      tags: [inventory]
      summary: 物品・保管場所のラベルを PNG/PDF で出力する
      description: |
        指定した物品・保管場所のラベルを、テンプレートに従って PNG または PDF で返す。
        値の無い差し込み項目と未知の項目は空文字として印字する。EAN・UPC のバーコードは数字だけを符号化できる（INV-BR-31）。
      x-lifepipe-requirements: [INV-UC-27, INV-BR-31]
      x-lifepipe-priority: later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryLabelRenderRequest'
      responses:
        '200':
          description: 描画したラベル
          content:
            image/png:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

components:
  parameters:
    InventoryLocationId:
      name: location_id
      in: path
      required: true
      description: 保管場所の ID
      schema:
        type: string
        format: uuid
    InventoryItemId:
      name: item_id
      in: path
      required: true
      description: 物品の ID
      schema:
        type: string
        format: uuid
    InventoryTagId:
      name: tag_id
      in: path
      required: true
      description: タグの ID
      schema:
        type: string
        format: uuid
    InventoryAttachmentId:
      name: attachment_id
      in: path
      required: true
      description: 添付ファイルの ID
      schema:
        type: string
        format: uuid
    InventoryAssetId:
      name: asset_id
      in: path
      required: true
      description: 資産番号（DDD-DDD 形式）
      schema:
        type: string
        pattern: '^\d{3}-\d{3}$'
        example: '000-001'
    InventoryCustomFieldName:
      name: field_name
      in: path
      required: true
      description: カスタムフィールド名（大文字小文字を区別しない）
      schema:
        type: string
        minLength: 1
        maxLength: 255
    InventoryMaintenanceEntryId:
      name: entry_id
      in: path
      required: true
      description: メンテナンス記録の ID
      schema:
        type: string
        format: uuid
    InventoryItemTemplateId:
      name: template_id
      in: path
      required: true
      description: 物品テンプレートの ID
      schema:
        type: string
        format: uuid
    InventoryLabelTemplateId:
      name: template_id
      in: path
      required: true
      description: ラベル印刷テンプレートの ID
      schema:
        type: string
        format: uuid
    InventoryQ:
      name: q
      in: query
      required: false
      description: キーワード。空白区切りの全語を含むものを返す。二重引用符で語句一致。先頭が「#」なら資産番号で検索する（INV-BR-23）
      schema:
        type: string
        maxLength: 1000
    InventoryTagIds:
      name: tag_ids
      in: query
      required: false
      description: タグで絞り込む。指定タグのいずれかを持つものを返す（INV-BR-23）
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          format: uuid
    InventorySortOrder:
      name: order
      in: query
      required: false
      description: 並び順の向き
      schema:
        $ref: '#/components/schemas/InventorySortOrder'

  schemas:
    # ---- enums ----
    InventoryWarrantyStatus:
      type: string
      description: 保証の状態（INV-BR-10）
      enum: [none, active, expiring_soon, expired, lifetime]
    InventoryOwnerType:
      type: string
      description: 添付・カスタムフィールドの対象の種類
      enum: [item, location]
    InventoryAttachmentKind:
      type: string
      description: 添付ファイルの用途。写真、取扱説明書、レシート、保証書、その他
      enum: [photo, manual, receipt, warranty, other]
    InventoryCustomFieldType:
      type: string
      description: カスタムフィールドの値の型。MVP は text のみ（INV-BR-20）
      enum: [text]
    InventoryMaintenanceStatus:
      type: string
      description: メンテナンスの状態（INV-BR-29）
      enum: [scheduled, completed, overdue]
    InventoryPurchaseIngestionResultKind:
      type: string
      description: 取り込みの結果。新規作成、既存の更新、重複のため何もしなかった
      enum: [created, updated, skipped]
    InventoryItemSort:
      type: string
      description: 物品一覧の並び順のキー
      enum: [name, created_at, updated_at, purchase_date, warranty_expires]
    InventorySortOrder:
      type: string
      description: 並び順の向き
      enum: [asc, desc]
      default: asc
    InventoryLabelOrientation:
      type: string
      enum: [portrait, landscape]
    InventoryLabelElementType:
      type: string
      enum: [text, barcode, rect, line, image]
    InventoryBarcodeType:
      type: string
      description: バーコードの種類。ean13・ean8・upca は数字だけを符号化できる（INV-BR-31）
      enum: [qr, datamatrix, code128, code39, ean13, ean8, upca]
    InventoryLabelOutputFormat:
      type: string
      enum: [png, pdf]

    # ---- value objects ----
    InventoryLocationRef:
      type: object
      description: 経路の 1 段分（id と名前）
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    InventoryCustomField:
      type: object
      description: カスタムフィールド。同じ物品・場所の中で名前は重複させない（大文字小文字を区別しない）。値が空のフィールドは保存しない（INV-BR-19）
      required: [name, type, value]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: 消費電力
        type:
          $ref: '#/components/schemas/InventoryCustomFieldType'
        value:
          type: string
          maxLength: 1000
          description: 値。https:// の URL や Markdown のリンク形式はクライアントがリンクとして表示できる（INV-BR-20）
          example: 1200W
    InventoryMoneyTotal:
      type: object
      description: 通貨ごとの評価額合計（INV-BR-12）
      required: [currency, amount]
      properties:
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: JPY
        amount:
          type: string
          pattern: '^\d+(\.\d{1,4})?$'
          example: '128000'

    # ---- Location ----
    InventoryLocation:
      type: object
      required: [id, name, tag_ids, custom_fields, path, item_count, total_value, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: 棚B
        description:
          type: string
          nullable: true
          description: 説明（Markdown）
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: 親の保管場所。null なら最上位
        kind:
          type: string
          nullable: true
          description: 場所の種類の目安（自由入力）
          example: shelf
        notes:
          type: string
          nullable: true
          maxLength: 1000
          description: 備考（Markdown）
        asset_id:
          type: string
          nullable: true
          pattern: '^\d{3}-\d{3}$'
          description: 資産番号。null なら番号なし
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
        custom_fields:
          type: array
          items:
            $ref: '#/components/schemas/InventoryCustomField'
        path:
          type: array
          readOnly: true
          description: 最上位から自分までの祖先の並び（INV-BR-03）
          items:
            $ref: '#/components/schemas/InventoryLocationRef'
        item_count:
          type: integer
          minimum: 0
          readOnly: true
          description: この場所に直接置かれた物品の数
        total_value:
          type: array
          readOnly: true
          description: 子孫の場所を含む、売却済みでない物品の評価額合計（通貨ごと、INV-BR-12）
          items:
            $ref: '#/components/schemas/InventoryMoneyTotal'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    InventoryLocationCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: 親の保管場所。存在しなければ 422（INV-BR-01）
        kind:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
          maxLength: 1000
        asset_id:
          type: string
          nullable: true
          pattern: '^\d{3}-\d{3}$'
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
        custom_fields:
          type: array
          items:
            $ref: '#/components/schemas/InventoryCustomField'
    InventoryLocationUpdate:
      type: object
      description: 送った項目だけを更新する。parent_id の変更が移動（INV-BR-03）
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: 新しい親。null で最上位へ移る。自分自身・子孫は 409（INV-BR-02）
        kind:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
          maxLength: 1000
        asset_id:
          type: string
          nullable: true
          pattern: '^\d{3}-\d{3}$'
        tag_ids:
          type: array
          description: 付与するタグ全体で置き換える
          items:
            type: string
            format: uuid
        custom_fields:
          type: array
          description: カスタムフィールド全体で置き換える
          items:
            $ref: '#/components/schemas/InventoryCustomField'
    InventoryLocationDetail:
      allOf:
        - $ref: '#/components/schemas/InventoryLocation'
        - type: object
          required: [children, items]
          properties:
            children:
              type: array
              description: 直下の子の場所
              items:
                $ref: '#/components/schemas/InventoryLocation'
            items:
              type: array
              description: この場所に直接置かれた物品
              items:
                $ref: '#/components/schemas/InventoryItem'
    InventoryLocationPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InventoryLocation'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    InventoryLocationTree:
      type: object
      required: [roots]
      properties:
        roots:
          type: array
          description: 根の保管場所（root_id 指定時はその 1 件）
          items:
            $ref: '#/components/schemas/InventoryLocationTreeNode'
    InventoryLocationTreeNode:
      type: object
      required: [id, name, children]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          nullable: true
        asset_id:
          type: string
          nullable: true
          pattern: '^\d{3}-\d{3}$'
        children:
          type: array
          items:
            $ref: '#/components/schemas/InventoryLocationTreeNode'
        items:
          type: array
          description: with_items=true のときだけ返す。直接置かれた物品
          items:
            $ref: '#/components/schemas/InventoryTreeItem'
    InventoryTreeItem:
      type: object
      required: [id, name, quantity]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        quantity:
          type: integer
          minimum: 0
        parent_item_id:
          type: string
          format: uuid
          nullable: true
        asset_id:
          type: string
          nullable: true
          pattern: '^\d{3}-\d{3}$'

    # ---- Item ----
    InventoryItem:
      type: object
      required: [id, name, location_id, quantity, lifetime_warranty, warranty_status, insured, archived, tag_ids, custom_fields, location_path, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: ミラーレスカメラ
        description:
          type: string
          nullable: true
          maxLength: 1000
        location_id:
          type: string
          format: uuid
        parent_item_id:
          type: string
          format: uuid
          nullable: true
          description: 親の物品（INV-BR-06）
        quantity:
          type: integer
          minimum: 0
          default: 1
        asset_id:
          type: string
          nullable: true
          pattern: '^\d{3}-\d{3}$'
          description: 資産番号。null は番号なし、000-000 は未採番（INV-BR-16）
          example: '000-042'
        manufacturer:
          type: string
          nullable: true
        model_number:
          type: string
          nullable: true
        serial_number:
          type: string
          nullable: true
        purchase_date:
          type: string
          format: date
          nullable: true
        purchase_from:
          type: string
          nullable: true
        purchase_price:
          type: string
          nullable: true
          pattern: '^\d+(\.\d{1,4})?$'
          description: 1 個あたりの購入価格。0 以上（INV-BR-11）
          example: '98000'
        currency:
          type: string
          nullable: true
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 の通貨コード。省略時はインスタンスの既定通貨
          example: JPY
        lifetime_warranty:
          type: boolean
          default: false
        warranty_expires:
          type: string
          format: date
          nullable: true
          description: 保証期限（この日まで有効）
        warranty_details:
          type: string
          nullable: true
        warranty_status:
          allOf:
            - $ref: '#/components/schemas/InventoryWarrantyStatus'
          readOnly: true
        insured:
          type: boolean
          default: false
        sold_date:
          type: string
          format: date
          nullable: true
          description: 売却・譲渡・廃棄した日。入っていれば売却・処分済み（INV-BR-13）
        sold_to:
          type: string
          nullable: true
        sold_price:
          type: string
          nullable: true
          pattern: '^\d+(\.\d{1,4})?$'
          description: 売却価格。0 以上（INV-BR-11）
        sold_notes:
          type: string
          nullable: true
          maxLength: 1000
        archived:
          type: boolean
          default: false
        notes:
          type: string
          nullable: true
          maxLength: 1000
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
        custom_fields:
          type: array
          items:
            $ref: '#/components/schemas/InventoryCustomField'
        primary_photo_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: 代表写真の添付 ID（INV-BR-22）
        import_ref:
          type: string
          nullable: true
          maxLength: 100
          description: CSV インポートの重複判定キー（INV-BR-24）
        source_ref:
          type: string
          nullable: true
          maxLength: 100
          description: ingest_purchase の重複判定キー（INV-BR-27）
        location_path:
          type: array
          readOnly: true
          description: 置き場所の最上位からの経路
          items:
            $ref: '#/components/schemas/InventoryLocationRef'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    InventoryItemCreate:
      type: object
      description: |
        location_id は parent_item_id を指定したときだけ省略でき、省略すると親の場所が入る（INV-BR-07）。
        lifetime_warranty=true と warranty_expires は同時に指定できない（INV-BR-09）。
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 1000
        location_id:
          type: string
          format: uuid
        parent_item_id:
          type: string
          format: uuid
          nullable: true
        quantity:
          type: integer
          minimum: 0
          default: 1
        asset_id:
          type: string
          nullable: true
          pattern: '^\d{3}-\d{3}$'
          description: 省略すると自動採番する（INV-BR-15）
        manufacturer:
          type: string
          nullable: true
        model_number:
          type: string
          nullable: true
        serial_number:
          type: string
          nullable: true
