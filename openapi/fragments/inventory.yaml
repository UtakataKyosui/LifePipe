    # ---- Attachment ----
    InventoryAttachment:
      type: object
      required: [id, owner_type, owner_id, kind, title, file_name, content_type, size_bytes, primary, has_thumbnail, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        owner_type:
          $ref: '#/components/schemas/InventoryOwnerType'
        owner_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/InventoryAttachmentKind'
        title:
          type: string
          description: 表示名。省略時はファイル名
        file_name:
          type: string
        content_type:
          type: string
          example: image/jpeg
        size_bytes:
          type: integer
          minimum: 0
          readOnly: true
        primary:
          type: boolean
          description: 代表写真か（kind が photo のときのみ、INV-BR-22）
        has_thumbnail:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    InventoryAttachmentUpload:
      type: object
      description: 添付するファイル。1 件あたり既定 10 MB まで（INV-BR-22）
      required: [file, kind]
      properties:
        file:
          type: string
          format: binary
        kind:
          $ref: '#/components/schemas/InventoryAttachmentKind'
        title:
          type: string
          description: 省略時はファイル名
        primary:
          type: boolean
          default: false
          description: 代表写真にするか（kind が photo のときのみ）
    InventoryAttachmentUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        kind:
          $ref: '#/components/schemas/InventoryAttachmentKind'
        primary:
          type: boolean
          description: true で代表写真にし、前の代表を外す（kind が photo のときのみ、INV-BR-22）
    InventoryAttachmentPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InventoryAttachment'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    # ---- Assets ----
    InventoryAssetResolution:
      type: object
      description: 資産番号の解決結果。owner_type に応じて item か location の一方が入る（INV-BR-17）
      required: [asset_id, owner_type]
      properties:
        asset_id:
          type: string
          pattern: '^\d{3}-\d{3}$'
        owner_type:
          $ref: '#/components/schemas/InventoryOwnerType'
        item:
          $ref: '#/components/schemas/InventoryItem'
        location:
          $ref: '#/components/schemas/InventoryLocation'
    InventoryAssetAssignmentResult:
      type: object
      required: [assigned_count, assignments]
      properties:
        assigned_count:
          type: integer
          minimum: 0
        assignments:
          type: array
          items:
            type: object
            required: [item_id, asset_id]
            properties:
              item_id:
                type: string
                format: uuid
              asset_id:
                type: string
                pattern: '^\d{3}-\d{3}$'

    # ---- Purchase ingestion ----
    InventoryPurchaseIngestionLine:
      type: object
      description: ゲートウェイが長期保有品と判定した 1 品目
      required: [source_ref, name]
      properties:
        source_ref:
          type: string
          minLength: 1
          maxLength: 100
          description: 取り込み元の識別子（レシート ID と行番号など）。重複判定に使う（INV-BR-27）
          example: receipt-0001#3
        name:
          type: string
          minLength: 1
          maxLength: 255
        purchase_date:
          type: string
          format: date
          nullable: true
        purchase_from:
          type: string
          nullable: true
        quantity:
          type: integer
          minimum: 1
          default: 1
        total_price:
          type: string
          nullable: true
          pattern: '^\d+(\.\d{1,4})?$'
          description: 行の合計金額。purchase_price = total_price ÷ quantity として登録する（INV-BR-27）
          example: '19800'
        currency:
          type: string
          nullable: true
          pattern: '^[A-Z]{3}$'
        warranty_expires:
          type: string
          format: date
          nullable: true
        serial_number:
          type: string
          nullable: true
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
        location_id:
          type: string
          format: uuid
          nullable: true
          description: 省略すると受け入れ用の場所（既定名「未整理」）に置く（INV-BR-27）
    InventoryPurchaseIngestionRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InventoryPurchaseIngestionLine'
    InventoryPurchaseIngestion:
      type: object
      description: 1 品目の取り込み結果
      required: [source_ref, result, item_id]
      properties:
        source_ref:
          type: string
        result:
          $ref: '#/components/schemas/InventoryPurchaseIngestionResultKind'
        item_id:
          type: string
          format: uuid
    InventoryPurchaseIngestionError:
      type: object
      description: 検証に失敗した品目（INV-BR-28）
      required: [index, message]
      properties:
        index:
          type: integer
          minimum: 0
          description: 要求の items での位置（0 始まり）
        source_ref:
          type: string
          nullable: true
        field:
          type: string
          nullable: true
          description: 問題のあった項目名
        message:
          type: string
    InventoryPurchaseIngestionResponse:
      type: object
      required: [results, errors]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/InventoryPurchaseIngestion'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/InventoryPurchaseIngestionError'

    # ---- CSV import ----
    InventoryCsvImportUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: CSV または TSV。区切り文字で判別し、拡張子は問わない（INV-BR-24）
    InventoryCsvImportResult:
      type: object
      required: [created, updated, skipped, errors]
      properties:
