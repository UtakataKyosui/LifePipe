          minimum: 1
        columns:
          type: integer
          minimum: 1
        margin_top_mm:
          type: number
          minimum: 0
        margin_left_mm:
          type: number
          minimum: 0
        gap_x_mm:
          type: number
          minimum: 0
        gap_y_mm:
          type: number
          minimum: 0
        offset_x_mm:
          type: number
          description: 印刷位置の横方向の補正量
        offset_y_mm:
          type: number
          description: 印刷位置の縦方向の補正量
