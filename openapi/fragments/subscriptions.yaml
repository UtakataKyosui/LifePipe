# subscriptions fragment
# 根拠: docs/requirements/subscriptions.md（SUB-UC-01〜22、SUB-BR-01〜21）
paths:
  /subscriptions/subscriptions:
    get:
      tags: [subscriptions]
      operationId: subscriptionsListSubscriptions
      summary: サブスクリプションの一覧を取得する
      description: |
        状態・カテゴリ・更新方法で絞り込み、名前・次回支払日・金額で並べ替える（SUB-UC-02）。
        `status` の既定は `active`。`all` で停止中も含める。
        返す `next_payment_date` には、日次処理の前でも SUB-BR-07 の追いつき計算を適用し、
        自動更新かつ有効なものについて当日より前の日付を返さない（SUB-UC-09、SUB-BR-07）。
        他人のサブスクリプションは含まない（SUB-BR-15）。
      x-lifepipe-requirements: [SUB-UC-02, SUB-UC-09, SUB-BR-07, SUB-BR-15]
      x-lifepipe-priority: mvp
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          required: false
          description: 状態で絞り込む。既定は `active`。
          schema:
            $ref: '#/components/schemas/SubscriptionsStatusFilter'
        - name: category_id
          in: query
          required: false
          description: カテゴリで絞り込む。
          schema:
            type: string
            format: uuid
        - name: renewal_type
          in: query
          required: false
          description: 更新方法で絞り込む。
          schema:
            $ref: '#/components/schemas/SubscriptionsRenewalType'
        - name: folder_id
          in: query
          required: false
          description: フォルダで絞り込む（後回しの機能。SUB-UC-19）。
          schema:
            type: string
            format: uuid
        - name: sort
          in: query
          required: false
          description: 並べ替えの項目。既定は `next_payment_date`。
          schema:
            $ref: '#/components/schemas/SubscriptionsSortField'
        - name: order
          in: query
          required: false
          description: 並べ替えの向き。既定は `asc`。
          schema:
            $ref: '#/components/schemas/SubscriptionsSortOrder'
      responses:
        '200':
          description: サブスクリプションの一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionsSubscriptionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [subscriptions]
      operationId: subscriptionsCreateSubscription
      summary: サブスクリプションを登録する
      description: |
        サブスクリプションを登録する（SUB-UC-01）。
        - `start_date` を省略すると利用者のタイムゾーンでの当日を入れる。
        - `next_payment_date` を省略すると SUB-BR-04 で計算する（基準日は当日、当日の支払日は「次回」に含める）。
        - `next_payment_date` を明示した場合はその値を保存する。`start_date` より前なら 400。支払日の列から外れた日付は新しい起点（`anchor_date`）になる（SUB-BR-05）。
        - `cycle_interval` は 1〜366。範囲外は 400（SUB-BR-01）。
        - `amount` は 0 以上で、小数の桁数は通貨の補助単位の桁数以下。超えたら 400（SUB-BR-13）。
        - `currency` は ISO 4217 の 3 文字の英大文字（SUB-BR-14）。
        - `end_date` は `start_date` 以降（SUB-BR-10）。
        - `category_id` などの参照先が他人のもの・存在しないものなら 400（SUB-BR-15）。
      x-lifepipe-requirements: [SUB-UC-01, SUB-UC-15, SUB-BR-01, SUB-BR-02, SUB-BR-03, SUB-BR-04, SUB-BR-05, SUB-BR-10, SUB-BR-13, SUB-BR-14, SUB-BR-15, SUB-BR-19]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionsSubscriptionCreate'
      responses:
        '201':
          description: 作成したサブスクリプション
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionsSubscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /subscriptions/subscriptions/{subscription_id}:
    parameters:
      - $ref: '#/components/parameters/SubscriptionsSubscriptionId'
    get:
      tags: [subscriptions]
      operationId: subscriptionsGetSubscription
      summary: サブスクリプションを 1 件取得する
      description: |
        サブスクリプションを 1 件取得する（SUB-UC-03）。他人のものは存在しない場合と同じく 404（SUB-BR-15）。
        返す `next_payment_date` には SUB-BR-07 の追いつき計算を適用する（SUB-UC-09）。
      x-lifepipe-requirements: [SUB-UC-03, SUB-UC-09, SUB-BR-07, SUB-BR-15]
      x-lifepipe-priority: mvp
      responses:
        '200':
          description: サブスクリプション
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionsSubscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [subscriptions]
      operationId: subscriptionsUpdateSubscription
      summary: サブスクリプションを部分更新する（停止・再開を含む）
      description: |
        送った項目だけを更新する（SUB-UC-04）。
        - 停止・再開は `status` の更新で行う（SUB-UC-06）。停止中は次回支払日を進めず、更新予定・合計額・通知の対象外。再開したときは SUB-BR-04 で当日以降の次回支払日を計算し直す（SUB-BR-09）。
        - `cycle_unit`・`cycle_interval`・`start_date` を変えたとき、`next_payment_date` を送らなければ SUB-BR-04 で計算し直す。それ以外の項目の更新では次回支払日を変えない（SUB-BR-06）。
        - `next_payment_date` を明示した場合の扱いは SUB-BR-05（`start_date` より前は 400）。
        - `end_date` は `start_date` 以降（SUB-BR-10）。null を送ると終了日を消す。
        - 金額・通貨の制約は SUB-BR-13、SUB-BR-14。参照先の所有者の制約は SUB-BR-15。
      x-lifepipe-requirements: [SUB-UC-04, SUB-UC-06, SUB-UC-15, SUB-BR-01, SUB-BR-04, SUB-BR-05, SUB-BR-06, SUB-BR-09, SUB-BR-10, SUB-BR-13, SUB-BR-14, SUB-BR-15, SUB-BR-19]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionsSubscriptionUpdate'
      responses:
        '200':
          description: 更新後のサブスクリプション
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionsSubscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [subscriptions]
      operationId: subscriptionsDeleteSubscription
      summary: サブスクリプションを削除する
      description: サブスクリプションを削除する（SUB-UC-05）。関連する支払い記録（Payment）も削除する。他人のものは 404（SUB-BR-15）。
      x-lifepipe-requirements: [SUB-UC-05, SUB-BR-15]
      x-lifepipe-priority: mvp
      responses:
        '204':
          description: 削除した
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /subscriptions/subscriptions/next-payment-date/calculate:
    post:
      tags: [subscriptions]
      operationId: subscriptionsCalculateNextPaymentDate
      summary: 次回支払日を計算する（保存しない）
      description: |
        開始日とサイクルから次回支払日の候補を計算して返す。保存しない（SUB-UC-07）。
        - 支払日の列は `start_date` を起点に SUB-BR-02 で作る。月・年サイクルで該当日がない月は末日にし、毎回起点から計算する（SUB-BR-03）。
        - `D(k) >= reference_date` を満たす最小の `D(k)` を次回支払日とする。`reference_date` の既定は当日（SUB-BR-04）。
        - `count` 件（既定 1、最大 12）の支払日を昇順で返す。先頭が次回支払日。
        - `cycle_interval` が 1〜366 の範囲外なら 400（SUB-BR-01）。
      x-lifepipe-requirements: [SUB-UC-07, SUB-BR-01, SUB-BR-02, SUB-BR-03, SUB-BR-04]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionsNextPaymentDateCalculation'
      responses:
        '200':
          description: 計算結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionsNextPaymentDateResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /subscriptions/subscriptions/upcoming:
    get:
      tags: [subscriptions]
      operationId: subscriptionsListUpcomingPayments
      summary: 期間内の更新予定（支払日の一覧）を取得する
      description: |
        期間 `[from, to]`（両端を含む）にある支払日を、有効なサブスクリプションごとにすべて列挙する（SUB-UC-08、SUB-BR-11）。
        朝のブリーフィング（`get_morning_briefing`）が使う。
        - 列挙は `next_payment_date` から始め、SUB-BR-02 の列に沿って `to` まで進める。週ごとのものは期間内に複数回出る。`end_date` より後の支払日は出さない（SUB-BR-10）。
        - 並びは支払日の昇順、同じ日は名前の昇順（SUB-BR-11）。
        - `from` の既定は当日、`to` の既定は `from + 7 日`。`from <= to` かつ長さ 366 日以内。違反は 400（SUB-BR-12）。
        - 自動更新かつ有効なものは、日次処理の前でも SUB-BR-07 の追いつき計算を適用し、過去の日付を返さない（SUB-UC-09）。
        - 手動更新で支払日を過ぎたものは `overdue=true` で返す。`from` が当日以前なら期間外でも先頭に含める（SUB-BR-08、SUB-BR-12）。
        - 停止中のものは含めない（SUB-BR-09）。
        - 合計額は通貨ごとに分けて返す（SUB-BR-14）。
        期間が最大 366 日に限られ、合計額を全件で出すため、この一覧はページングしない。
      x-lifepipe-requirements: [SUB-UC-08, SUB-UC-09, SUB-BR-07, SUB-BR-08, SUB-BR-09, SUB-BR-10, SUB-BR-11, SUB-BR-12, SUB-BR-14, SUB-BR-15]
      x-lifepipe-priority: mvp
      parameters:
        - $ref: '#/components/parameters/SubscriptionsFrom'
        - $ref: '#/components/parameters/SubscriptionsTo'
        - name: category_id
          in: query
          required: false
          description: カテゴリで絞り込む。
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 更新予定と通貨ごとの合計額
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionsUpcomingPaymentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /subscriptions/categories:
    get:
      tags: [subscriptions]
      operationId: subscriptionsListCategories
      summary: カテゴリの一覧を取得する
      description: カテゴリを `sort_order` の昇順で返す（SUB-UC-10）。自分のカテゴリだけを返す（SUB-BR-15）。
      x-lifepipe-requirements: [SUB-UC-10, SUB-BR-15]
      x-lifepipe-priority: mvp
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: カテゴリの一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionsCategoryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [subscriptions]
      operationId: subscriptionsCreateCategory
      summary: カテゴリを登録する
      description: |
        カテゴリを登録する（SUB-UC-10）。名前は所有者の中で重複できない（大文字小文字を区別しない）。重複は 409（SUB-BR-16）。
        `sort_order` を省略すると末尾に置く。
      x-lifepipe-requirements: [SUB-UC-10, SUB-BR-16]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionsCategoryCreate'
      responses:
        '201':
          description: 作成したカテゴリ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionsCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /subscriptions/categories/order:
    put:
      tags: [subscriptions]
      operationId: subscriptionsReorderCategories
      summary: カテゴリを並べ替える
      description: |
        カテゴリ ID の配列を受け取り、その順に `sort_order` を振り直す（SUB-UC-10）。
        配列には自分のカテゴリをすべて 1 回ずつ含める。不足・重複・他人のカテゴリや存在しない ID があれば 400 で、何も変えない（SUB-BR-15）。
      x-lifepipe-requirements: [SUB-UC-10, SUB-BR-15]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionsCategoryOrder'
      responses:
        '204':
          description: 並べ替えた
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /subscriptions/categories/{category_id}:
    parameters:
      - $ref: '#/components/parameters/SubscriptionsCategoryId'
    patch:
      tags: [subscriptions]
      operationId: subscriptionsUpdateCategory
      summary: カテゴリを部分更新する
      description: カテゴリの名前・表示順を更新する（SUB-UC-10）。名前の重複は 409（SUB-BR-16）。他人のものは 404（SUB-BR-15）。
      x-lifepipe-requirements: [SUB-UC-10, SUB-BR-15, SUB-BR-16]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionsCategoryUpdate'
      responses:
        '200':
          description: 更新後のカテゴリ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionsCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [subscriptions]
      operationId: subscriptionsDeleteCategory
      summary: カテゴリを削除する
      description: カテゴリを削除する（SUB-UC-10）。使用中なら、そのカテゴリを指していたサブスクリプションを未分類（`category_id` なし）にしてから削除する（SUB-BR-16）。他人のものは 404（SUB-BR-15）。
      x-lifepipe-requirements: [SUB-UC-10, SUB-BR-15, SUB-BR-16]
      x-lifepipe-priority: mvp
      responses:
        '204':
          description: 削除した
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /subscriptions/subscriptions/{subscription_id}/payments:
    parameters:
      - $ref: '#/components/parameters/SubscriptionsSubscriptionId'
    post:
      tags: [subscriptions]
      operationId: subscriptionsMarkSubscriptionPaid
      summary: 現在の支払日を支払い済みにする
      description: |
        現在の `next_payment_date` を `due_date` とする支払い記録を作り、`last_paid_on` を更新し、
        次回支払日を `D(k) > due_date` を満たす最小の `D(k)` へ進める（SUB-UC-11、SUB-BR-17）。
        手動更新のサブスクリプションはこの操作で次回支払日が進む（SUB-BR-08）。
        - `amount`・`currency` の既定はその時点のサブスクリプションの値。制約は SUB-BR-13、SUB-BR-14。
        - 同じ `due_date` の支払い記録は 1 件だけ。既にあれば 409（SUB-BR-17）。
        - 停止中のサブスクリプションには使えない。409（SUB-BR-09）。
      x-lifepipe-requirements: [SUB-UC-11, SUB-BR-08, SUB-BR-09, SUB-BR-13, SUB-BR-14, SUB-BR-15, SUB-BR-17]
      x-lifepipe-priority: later
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionsPaymentCreate'
      responses:
        '201':
          description: 作成した支払い記録
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionsPayment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /subscriptions/subscriptions/{subscription_id}/payments/latest:
    parameters:
      - $ref: '#/components/parameters/SubscriptionsSubscriptionId'
    delete:
      tags: [subscriptions]
      operationId: subscriptionsUnmarkSubscriptionPaid
      summary: 最後の支払い済みを取り消す
      description: |
        最後の支払い記録を削除し、次回支払日をその `due_date` に戻す（SUB-UC-11、SUB-BR-17）。
        支払い記録がなければ 404。
      x-lifepipe-requirements: [SUB-UC-11, SUB-BR-15, SUB-BR-17]
      x-lifepipe-priority: later
      responses:
        '204':
          description: 取り消した
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /subscriptions/subscriptions/summary:
    get:
      tags: [subscriptions]
      operationId: subscriptionsGetSubscriptionSummary
      summary: 月額・年額の合計と予算との比較を取得する
      description: |
        有効なサブスクリプションの月額・年額の合計を返す（SUB-UC-12）。停止中は含めない（SUB-BR-09）。
        - 月額換算は SUB-BR-18 の係数で行い、年額は月額 × 12。表示時に通貨の桁数で四捨五入する。
        - 合計は通貨ごとに分けて返す。為替換算を設定した場合だけ基準通貨の合計と、使った為替レートを返す（SUB-BR-14、SUB-UC-13）。
        - 月の予算を設定していれば予算との差を返す（SUB-UC-17）。
        - `folder_id` を指定するとフォルダごとの合計になる（SUB-UC-19）。
      x-lifepipe-requirements: [SUB-UC-12, SUB-UC-13, SUB-UC-17, SUB-UC-19, SUB-BR-09, SUB-BR-14, SUB-BR-18, SUB-BR-21]
      x-lifepipe-priority: later
      parameters:
        - name: category_id
          in: query
          required: false
          description: カテゴリで絞り込む。
          schema:
            type: string
            format: uuid
        - name: folder_id
          in: query
          required: false
          description: フォルダで絞り込む（SUB-UC-19）。
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 合計額
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionsSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /subscriptions/subscriptions/statistics:
    get:
      tags: [subscriptions]
      operationId: subscriptionsGetSubscriptionStatistics
      summary: 統計（内訳・推移・節約額）を取得する
      description: |
        カテゴリ別・支払者別の月額の内訳、月額合計の推移、停止したサブスクリプションによる節約額を返す（SUB-UC-18）。
        金額は SUB-BR-18 の月額換算で、通貨ごとに分ける（SUB-BR-14）。
        節約額は停止したサブスクリプションの月額から、乗り換え先（`replaced_by_id`）の月額を引いたもの。
        要件ドキュメントの API 表にない操作で、SUB-UC-18 を受けるために追加した。
      x-lifepipe-requirements: [SUB-UC-18, SUB-BR-14, SUB-BR-18]
      x-lifepipe-priority: later
      responses:
        '200':
          description: 統計
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionsStatistics'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /subscriptions/subscriptions/upcoming.ics:
    get:
      tags: [subscriptions]
      operationId: subscriptionsGetUpcomingCalendar
      summary: 更新予定を iCalendar で取得する
      description: |
        更新予定を iCalendar（RFC 5545）で配信する（SUB-UC-20）。期間と列挙の規則は更新予定の取得と同じ（SUB-BR-11、SUB-BR-12）。
      x-lifepipe-requirements: [SUB-UC-20, SUB-BR-11, SUB-BR-12]
      x-lifepipe-priority: later
      parameters:
        - $ref: '#/components/parameters/SubscriptionsFrom'
        - $ref: '#/components/parameters/SubscriptionsTo'
      responses:
        '200':
          description: iCalendar
          content:
            text/calendar:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /subscriptions/subscriptions/export:
    get:
      tags: [subscriptions]
      operationId: subscriptionsExportSubscriptions
      summary: サブスクリプションを CSV・JSON でエクスポートする
