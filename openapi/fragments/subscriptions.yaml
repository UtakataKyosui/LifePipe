components:
  parameters:
    SubscriptionsSubscriptionId:
      name: subscription_id
      in: path
      required: true
      description: サブスクリプションの ID。
      schema:
        type: string
        format: uuid
    SubscriptionsCategoryId:
      name: category_id
      in: path
      required: true
      description: カテゴリの ID。
      schema:
        type: string
        format: uuid
    SubscriptionsPaymentMethodId:
      name: payment_method_id
      in: path
      required: true
      description: 支払い方法の ID。
      schema:
        type: string
        format: uuid
    SubscriptionsHouseholdMemberId:
      name: household_member_id
      in: path
      required: true
      description: 世帯メンバーの ID。
      schema:
        type: string
        format: uuid
    SubscriptionsFolderId:
      name: folder_id
      in: path
      required: true
      description: フォルダの ID。
      schema:
        type: string
        format: uuid
    SubscriptionsFrom:
      name: from
      in: query
      required: false
      description: 期間の開始日（含む）。既定は利用者のタイムゾーンでの当日（SUB-BR-12）。
      schema:
        type: string
        format: date
    SubscriptionsTo:
      name: to
      in: query
      required: false
      description: 期間の終了日（含む）。既定は `from + 7 日`。`from <= to` かつ長さ 366 日以内（SUB-BR-12）。
      schema:
        type: string
        format: date

  schemas:
    # ---- enum ----
    SubscriptionsCycleUnit:
      type: string
      description: 支払いサイクルの単位（SUB-BR-01）。
      enum: [day, week, month, year]
    SubscriptionsRenewalType:
      type: string
      description: 更新方法。`auto` は支払日を過ぎると自動で次の支払日へ進む。`manual` は支払い済みにするまで進まない（SUB-BR-07、SUB-BR-08）。
      enum: [auto, manual]
      default: auto
    SubscriptionsStatus:
      type: string
      description: 有効・停止。停止中は更新予定・合計額・通知の対象外（SUB-BR-09）。
      enum: [active, inactive]
      default: active
    SubscriptionsStatusFilter:
      type: string
      description: 一覧の状態フィルタ。`all` は有効・停止の両方。
      enum: [active, inactive, all]
      default: active
    SubscriptionsSortField:
      type: string
      description: 一覧の並べ替え項目。
      enum: [name, next_payment_date, amount]
      default: next_payment_date
    SubscriptionsSortOrder:
      type: string
      description: 並べ替えの向き。
      enum: [asc, desc]
      default: asc
    SubscriptionsExportFormat:
      type: string
      description: エクスポートの形式。
      enum: [csv, json]
    SubscriptionsBatchAction:
      type: string
      description: 一括操作の種類。
      enum: [delete, set_category]

    # ---- Subscription ----
    SubscriptionsSubscription:
      type: object
      description: サブスクリプション（定期的に支払いが発生する契約）。
      required:
        - id
        - owner_id
        - name
        - amount
        - currency
        - cycle_unit
        - cycle_interval
        - start_date
        - next_payment_date
        - anchor_date
        - renewal_type
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: サーバーが採番する ID。
        owner_id:
          type: string
          readOnly: true
          description: 所有者（OIDC の subject）。認証情報から決まる。
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: サービス名。
          example: 架空動画プラス
        amount:
          type: string
          pattern: '^\d+(\.\d{1,4})?$'
          description: 1 回の支払額。0 以上の 10 進数。小数の桁数は通貨の補助単位の桁数以下（SUB-BR-13）。
          example: '1480'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 の通貨コード（SUB-BR-14）。
          example: JPY
        cycle_unit:
          $ref: '#/components/schemas/SubscriptionsCycleUnit'
        cycle_interval:
          type: integer
          minimum: 1
          maximum: 366
          description: サイクルの間隔（SUB-BR-01）。
          example: 1
        start_date:
          type: string
          format: date
          description: 契約の開始日。支払日の起点。
        next_payment_date:
          type: string
          format: date
          description: 次回支払日。
        anchor_date:
          type: string
          format: date
          readOnly: true
          description: 支払日の列の起点（SUB-BR-02、SUB-BR-05）。既定は `start_date`。
        renewal_type:
          $ref: '#/components/schemas/SubscriptionsRenewalType'
        status:
          $ref: '#/components/schemas/SubscriptionsStatus'
        end_date:
          type: string
          format: date
          nullable: true
          description: 契約の終了日（解約予定日）。この日より後の支払日は発生しない（SUB-BR-10）。
        category_id:
          type: string
          format: uuid
          nullable: true
          description: カテゴリ。null は未分類。
        url:
          type: string
          format: uri
          pattern: '^https?://'
          maxLength: 2048
          nullable: true
          description: 契約の管理ページなどの URL。http または https。
          example: https://example.com/account
        notes:
          type: string
          maxLength: 2000
          nullable: true
          description: メモ（Markdown 可）。
        payment_method_id:
          type: string
          format: uuid
          nullable: true
          description: 支払い方法（後回しの機能）。
        payer_ids:
          type: array
          description: 支払者の世帯メンバー ID（後回しの機能。SUB-UC-15）。
          uniqueItems: true
          items:
            type: string
            format: uuid
        folder_id:
          type: string
          format: uuid
          nullable: true
          description: フォルダ（後回しの機能）。
        replaced_by_id:
          type: string
          format: uuid
          nullable: true
          description: 停止したサブスクリプションの乗り換え先（後回しの機能）。節約額の計算に使う。
        notify:
          type: boolean
          default: false
          description: 支払い前に通知するか（後回しの機能。SUB-BR-19）。
        notify_days_before:
          type: integer
          minimum: 0
          maximum: 180
          nullable: true
          description: 何日前に通知するか。0 は支払日当日。null は利用者の既定値（SUB-BR-19）。
        last_paid_on:
          type: string
          format: date
          nullable: true
          readOnly: true
          description: 最後に支払い済みにした支払日（SUB-BR-17）。
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: 作成日時。
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: 更新日時。
    SubscriptionsSubscriptionCreate:
      type: object
      description: サブスクリプションの登録内容。`start_date` と `next_payment_date` は省略するとサーバーが決める（SUB-BR-04、SUB-BR-05）。
      required:
        - name
        - amount
        - currency
        - cycle_unit
        - cycle_interval
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: 架空動画プラス
        amount:
          type: string
          pattern: '^\d+(\.\d{1,4})?$'
          description: 0 以上の 10 進数。小数の桁数は通貨の補助単位の桁数以下（SUB-BR-13）。
          example: '1480'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: JPY
        cycle_unit:
          $ref: '#/components/schemas/SubscriptionsCycleUnit'
        cycle_interval:
          type: integer
          minimum: 1
          maximum: 366
          example: 1
        start_date:
          type: string
          format: date
          description: 省略時は利用者のタイムゾーンでの当日。
        next_payment_date:
          type: string
          format: date
          description: 省略時は SUB-BR-04 で計算する。`start_date` より前は 400（SUB-BR-05）。
        renewal_type:
          $ref: '#/components/schemas/SubscriptionsRenewalType'
        status:
          $ref: '#/components/schemas/SubscriptionsStatus'
        end_date:
          type: string
          format: date
          description: '`start_date` 以降（SUB-BR-10）。'
        category_id:
          type: string
          format: uuid
          description: 自分のカテゴリ。他人のもの・存在しないものは 400（SUB-BR-15）。
        url:
          type: string
          format: uri
          pattern: '^https?://'
          maxLength: 2048
        notes:
          type: string
          maxLength: 2000
        payment_method_id:
          type: string
          format: uuid
        payer_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        folder_id:
          type: string
          format: uuid
        replaced_by_id:
          type: string
          format: uuid
        notify:
          type: boolean
          default: false
        notify_days_before:
          type: integer
          minimum: 0
          maximum: 180
    SubscriptionsSubscriptionUpdate:
      type: object
      description: サブスクリプションの部分更新。送った項目だけを更新する。null を送れる項目は null で値を消す。
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        amount:
          type: string
          pattern: '^\d+(\.\d{1,4})?$'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        cycle_unit:
          $ref: '#/components/schemas/SubscriptionsCycleUnit'
        cycle_interval:
          type: integer
          minimum: 1
          maximum: 366
        start_date:
          type: string
          format: date
        next_payment_date:
          type: string
          format: date
          description: 送らずにサイクルか開始日を変えると SUB-BR-04 で計算し直す（SUB-BR-06）。
        renewal_type:
          $ref: '#/components/schemas/SubscriptionsRenewalType'
        status:
          $ref: '#/components/schemas/SubscriptionsStatus'
        end_date:
          type: string
          format: date
          nullable: true
        category_id:
          type: string
          format: uuid
          nullable: true
        url:
          type: string
          format: uri
          pattern: '^https?://'
          maxLength: 2048
          nullable: true
        notes:
          type: string
          maxLength: 2000
          nullable: true
        payment_method_id:
          type: string
          format: uuid
          nullable: true
        payer_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        folder_id:
          type: string
          format: uuid
          nullable: true
        replaced_by_id:
          type: string
          format: uuid
          nullable: true
        notify:
          type: boolean
        notify_days_before:
          type: integer
          minimum: 0
          maximum: 180
          nullable: true
    SubscriptionsSubscriptionPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionsSubscription'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1

    # ---- 次回支払日の計算 ----
    SubscriptionsNextPaymentDateCalculation:
      type: object
      description: 次回支払日の計算の入力（SUB-UC-07）。
      required: [start_date, cycle_unit, cycle_interval]
      properties:
        start_date:
          type: string
          format: date
          description: 支払日の列の起点。
        cycle_unit:
          $ref: '#/components/schemas/SubscriptionsCycleUnit'
        cycle_interval:
          type: integer
          minimum: 1
          maximum: 366
        reference_date:
          type: string
          format: date
          description: 基準日。既定は利用者のタイムゾーンでの当日（SUB-BR-04）。
        count:
          type: integer
          minimum: 1
          maximum: 12
          default: 1
          description: 次回以降の支払日をいくつ返すか。
    SubscriptionsNextPaymentDateResult:
      type: object
      required: [next_payment_date, payment_dates]
      properties:
        next_payment_date:
          type: string
          format: date
          description: 次回支払日（`payment_dates` の先頭と同じ）。
        payment_dates:
          type: array
          minItems: 1
          maxItems: 12
          description: 次回支払日から昇順に `count` 件。
          items:
            type: string
            format: date

    # ---- 更新予定 ----
    SubscriptionsUpcomingPayment:
      type: object
      description: 更新予定の 1 件。計算結果で保存しない。
      required: [subscription_id, name, due_date, amount, currency, renewal_type, overdue]
      properties:
        subscription_id:
          type: string
          format: uuid
        name:
          type: string
          example: 架空動画プラス
        due_date:
          type: string
          format: date
        amount:
          type: string
          pattern: '^\d+(\.\d{1,4})?$'
          example: '1480'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: JPY
        category_id:
          type: string
          format: uuid
          nullable: true
        renewal_type:
          $ref: '#/components/schemas/SubscriptionsRenewalType'
        overdue:
          type: boolean
          description: 支払日が当日より前で、まだ支払い済みにしていない（manual のみ true になりうる。SUB-BR-08）。
    SubscriptionsCurrencyTotal:
      type: object
      description: 通貨ごとの合計額（SUB-BR-14）。
      required: [currency, amount]
      properties:
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        amount:
          type: string
          pattern: '^\d+(\.\d{1,4})?$'
    SubscriptionsUpcomingPaymentList:
      type: object
      description: 更新予定と通貨ごとの合計額。ページングしない。
      required: [from, to, items, totals]
      properties:
        from:
          type: string
          format: date
          description: 適用した期間の開始日。
        to:
          type: string
          format: date
          description: 適用した期間の終了日。
        items:
          type: array
          description: 支払日の昇順、同じ日は名前の昇順。`overdue=true` のものは先頭に置く（SUB-BR-11、SUB-BR-12）。
          items:
            $ref: '#/components/schemas/SubscriptionsUpcomingPayment'
        totals:
          type: array
          description: '`items` の通貨ごとの合計額。'
          items:
            $ref: '#/components/schemas/SubscriptionsCurrencyTotal'

    # ---- Category ----
    SubscriptionsCategory:
      type: object
      required: [id, owner_id, name, sort_order, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        owner_id:
          type: string
          readOnly: true
          description: 所有者（OIDC の subject）。
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: カテゴリ名。所有者の中で重複不可（大文字小文字を区別しない。SUB-BR-16）。
          example: 動画配信
        sort_order:
          type: integer
          minimum: 0
          description: 表示順。小さい順に並べる。
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    SubscriptionsCategoryCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: 動画配信
        sort_order:
          type: integer
          minimum: 0
          description: 省略時は末尾。
    SubscriptionsCategoryUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        sort_order:
          type: integer
          minimum: 0
    SubscriptionsCategoryOrder:
      type: object
      required: [category_ids]
      properties:
        category_ids:
          type: array
          description: 新しい並び順のカテゴリ ID。自分のカテゴリをすべて 1 回ずつ含める。
          uniqueItems: true
          items:
            type: string
            format: uuid
    SubscriptionsCategoryPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionsCategory'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1

    # ---- Payment ----
    SubscriptionsPayment:
      type: object
      description: 支払い記録（SUB-BR-17）。
      required: [id, subscription_id, due_date, amount, currency, paid_at, created_at]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        subscription_id:
          type: string
          format: uuid
          readOnly: true
        due_date:
          type: string
          format: date
          readOnly: true
          description: 支払い済みにした支払日（その時点の `next_payment_date`）。
        amount:
          type: string
          pattern: '^\d+(\.\d{1,4})?$'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        paid_at:
          type: string
          format: date-time
          readOnly: true
          description: 支払い済みにした日時。
        created_at:
          type: string
          format: date-time
          readOnly: true
    SubscriptionsPaymentCreate:
      type: object
      description: 支払い済みにする操作の入力。省略した項目はその時点のサブスクリプションの値を使う。
      properties:
        amount:
          type: string
          pattern: '^\d+(\.\d{1,4})?$'
          description: 実際の支払額。小数の桁数は通貨の補助単位の桁数以下（SUB-BR-13）。
        currency:
          type: string
          pattern: '^[A-Z]{3}$'

    # ---- 合計額・統計 ----
    SubscriptionsExchangeRate:
      type: object
      description: 為替レートの取得結果（後回しの機能。SUB-BR-21）。
      required: [base_currency, quote_currency, rate, fetched_on]
      properties:
        base_currency:
          type: string
          pattern: '^[A-Z]{3}$'
        quote_currency:
          type: string
          pattern: '^[A-Z]{3}$'
        rate:
          type: string
          pattern: '^\d+(\.\d+)?$'
          description: 基準通貨 1 単位あたりの換算先通貨の量。10 進数の文字列。
        fetched_on:
          type: string
          format: date
          description: 取得日。
    SubscriptionsCostTotal:
      type: object
      description: ある通貨での月額・年額の合計（SUB-BR-18）。
      required: [currency, monthly_amount, yearly_amount, subscription_count]
      properties:
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        monthly_amount:
          type: string
          pattern: '^\d+(\.\d{1,4})?$'
        yearly_amount:
          type: string
          pattern: '^\d+(\.\d{1,4})?$'
        subscription_count:
          type: integer
          minimum: 0
          description: 合計に含めたサブスクリプションの数。
    SubscriptionsSummary:
      type: object
      description: 月額・年額の合計と予算との比較（SUB-UC-12、SUB-UC-17）。
      required: [totals_by_currency]
      properties:
        totals_by_currency:
          type: array
          description: 通貨ごとの合計（SUB-BR-14）。
          items:
            $ref: '#/components/schemas/SubscriptionsCostTotal'
        main_currency_total:
          type: object
          nullable: true
          description: 基準通貨に換算した合計。為替換算を設定した場合だけ返す（SUB-BR-14）。
          required: [currency, monthly_amount, yearly_amount, subscription_count]
          properties:
            currency:
              type: string
              pattern: '^[A-Z]{3}$'
            monthly_amount:
              type: string
              pattern: '^\d+(\.\d{1,4})?$'
            yearly_amount:
              type: string
              pattern: '^\d+(\.\d{1,4})?$'
            subscription_count:
              type: integer
              minimum: 0
        monthly_budget:
          type: string
          pattern: '^\d+(\.\d{1,4})?$'
          nullable: true
          description: 月の予算（基準通貨）。予算なしは null。
        budget_remaining:
          type: string
          pattern: '^-?\d+(\.\d{1,4})?$'
          nullable: true
          description: 予算 − 基準通貨の月額合計。負は予算超過。予算なし、または換算していなければ null。
        exchange_rates:
          type: array
          description: 換算に使った為替レート。換算していなければ空。
          items:
            $ref: '#/components/schemas/SubscriptionsExchangeRate'
    SubscriptionsStatistics:
      type: object
      description: 統計（SUB-UC-18）。金額は月額換算で通貨ごとに分ける。
      required: [by_category, by_payer, monthly_total_trend, savings]
      properties:
        by_category:
          type: array
          description: カテゴリ別の月額。`category_id` が null は未分類。
          items:
            type: object
            required: [currency, monthly_amount]
            properties:
              category_id:
                type: string
                format: uuid
                nullable: true
              currency:
                type: string
                pattern: '^[A-Z]{3}$'
              monthly_amount:
                type: string
                pattern: '^\d+(\.\d{1,4})?$'
        by_payer:
          type: array
          description: 支払者別の月額。`household_member_id` が null は支払者なし。
          items:
            type: object
            required: [currency, monthly_amount]
            properties:
              household_member_id:
                type: string
                format: uuid
                nullable: true
              currency:
                type: string
                pattern: '^[A-Z]{3}$'
              monthly_amount:
                type: string
                pattern: '^\d+(\.\d{1,4})?$'
        monthly_total_trend:
          type: array
          description: 記録日ごとの月額合計の推移（古い順）。
          items:
            type: object
            required: [recorded_on, currency, monthly_amount]
            properties:
              recorded_on:
                type: string
                format: date
              currency:
                type: string
                pattern: '^[A-Z]{3}$'
              monthly_amount:
                type: string
                pattern: '^\d+(\.\d{1,4})?$'
        savings:
          type: array
          description: 停止したサブスクリプションごとの月額の節約額。乗り換え先があればその月額を引く。
          items:
            type: object
            required: [subscription_id, currency, monthly_amount]
            properties:
              subscription_id:
                type: string
                format: uuid
              replaced_by_id:
                type: string
                format: uuid
                nullable: true
              currency:
                type: string
                pattern: '^[A-Z]{3}$'
              monthly_amount:
                type: string
                pattern: '^-?\d+(\.\d{1,4})?$'
                description: 節約額。乗り換え先の方が高ければ負になる。

    # ---- 一括操作 ----
    SubscriptionsBatchRequest:
      type: object
      required: [action, subscription_ids]
      properties:
        action:
          $ref: '#/components/schemas/SubscriptionsBatchAction'
        subscription_ids:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items:
            type: string
            format: uuid
        category_id:
          type: string
          format: uuid
          nullable: true
          description: '`set_category` のときに指定する。null は未分類。`delete` では無視する。'
    SubscriptionsBatchResult:
      type: object
      required: [affected]
      properties:
        affected:
          type: integer
          minimum: 0
          description: 削除・更新したサブスクリプションの数。

    # ---- UserSettings ----
    SubscriptionsUserSettings:
      type: object
      description: 利用者設定（後回しの機能）。
      required: [owner_id, timezone, main_currency, updated_at]
      properties:
        owner_id:
          type: string
          readOnly: true
        timezone:
          type: string
          maxLength: 64
          description: IANA タイムゾーン名。「当日」の判定に使う。
          example: Asia/Tokyo
        main_currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: 合計額を表示する基準通貨。
          example: JPY
        monthly_budget:
          type: string
          pattern: '^\d+(\.\d{1,4})?$'
          nullable: true
          description: 月の予算（基準通貨）。null または 0 は予算なし。
        default_notify_days_before:
          type: integer
          minimum: 0
          maximum: 180
          nullable: true
          description: 通知の既定日数（SUB-BR-19）。
        updated_at:
          type: string
          format: date-time
          readOnly: true
    SubscriptionsUserSettingsUpdate:
      type: object
      properties:
        timezone:
          type: string
          maxLength: 64
        main_currency:
          type: string
          pattern: '^[A-Z]{3}$'
        monthly_budget:
          type: string
          pattern: '^\d+(\.\d{1,4})?$'
          nullable: true
        default_notify_days_before:
          type: integer
          minimum: 0
          maximum: 180
          nullable: true

    # ---- PaymentMethod ----
    SubscriptionsPaymentMethod:
      type: object
      description: 支払い方法（後回しの機能）。カード番号などの秘密情報は持たない。
      required: [id, owner_id, name, enabled, sort_order, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        owner_id:
          type: string
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: 架空カード
        enabled:
          type: boolean
          description: 選択肢に出すか。
        sort_order:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    SubscriptionsPaymentMethodCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: 口座振替
        enabled:
          type: boolean
          default: true
        sort_order:
          type: integer
          minimum: 0
          description: 省略時は末尾。
    SubscriptionsPaymentMethodUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        enabled:
          type: boolean
          description: 使用中のものを false にすると 409（SUB-BR-20）。
        sort_order:
          type: integer
          minimum: 0
    SubscriptionsPaymentMethodPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionsPaymentMethod'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1

    # ---- HouseholdMember ----
    SubscriptionsHouseholdMember:
      type: object
      description: 世帯メンバー（後回しの機能）。サブスクリプションの支払者に割り当てる。
      required: [id, owner_id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        owner_id:
          type: string
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: 家族A
        email:
          type: string
          format: email
          nullable: true
          description: 通知先のメールアドレス。
          example: member@example.com
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    SubscriptionsHouseholdMemberCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
    SubscriptionsHouseholdMemberUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          nullable: true
    SubscriptionsHouseholdMemberPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionsHouseholdMember'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1

    # ---- Folder ----
    SubscriptionsFolder:
      type: object
      description: フォルダ（後回しの機能）。
      required: [id, owner_id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        owner_id:
          type: string
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: 仕事用
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          nullable: true
          description: 表示色（#RRGGBB）。
          example: '#3366CC'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    SubscriptionsFolderCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
    SubscriptionsFolderUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          nullable: true
    SubscriptionsFolderPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionsFolder'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
