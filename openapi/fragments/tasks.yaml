      summary: 利用者設定を更新する
      description: |
        送った項目だけを更新する。timezone は IANA タイムゾーン名で、不明な名前は 400（TSK-BR-08）。
        default_project_id は存在するプロジェクトでなければ 404（TSK-BR-01）。
        default_due_time は日付だけの期限に補う時刻で、null で未設定（23:59 を補う）に戻す（TSK-BR-09）。
      x-lifepipe-requirements: [TSK-UC-13, TSK-BR-01, TSK-BR-08, TSK-BR-09]
