# tasks fragment
paths:
  /tasks/projects:
    get:
      tags: [tasks]
      operationId: tasksListProjects
      summary: プロジェクトを一覧する
      description: |
        プロジェクトをページ分割して返す（TSK-BR-22）。archived と parent_project_id で絞り込める。
      x-lifepipe-requirements: [TSK-UC-09, TSK-BR-22]
      x-lifepipe-priority: mvp
      parameters:
        - name: archived
          in: query
          required: false
          description: true ならアーカイブ済みだけ、false ならアーカイブされていないものだけを返す。省略時はすべて。
          schema:
            type: boolean
        - name: parent_project_id
          in: query
          required: false
          description: 指定した親プロジェクトの直下の子プロジェクトだけを返す。
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: プロジェクトの一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksProjectPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [tasks]
      operationId: tasksCreateProject
      summary: プロジェクトを登録する
      description: |
        プロジェクトを登録する。identifier は全プロジェクトで一意で、重複は 409（TSK-BR-26）。
        親プロジェクトを指定でき、存在しない親は 404 とする（TSK-BR-24）。
        Inbox は利用者ごとに1つ自動で作られ、この操作では作らない（TSK-BR-01）。
      x-lifepipe-requirements: [TSK-UC-09, TSK-BR-01, TSK-BR-24, TSK-BR-26]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TasksProjectCreate'
      responses:
        '201':
          description: 登録したプロジェクト
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksProject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tasks/projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/TasksProjectId'
    get:
      tags: [tasks]
      operationId: tasksGetProject
      summary: プロジェクトを取得する
      x-lifepipe-requirements: [TSK-UC-09]
      x-lifepipe-priority: mvp
      responses:
        '200':
          description: プロジェクト
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksProject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [tasks]
      operationId: tasksUpdateProject
      summary: プロジェクトを更新する
      description: |
        送った項目だけを更新する。自分自身や自分の子孫を親にする変更は 422 で拒否する（TSK-BR-24）。
        identifier の重複は 409（TSK-BR-26）。アーカイブ中のプロジェクトは読み取り専用で、更新は 409（TSK-BR-25）。
      x-lifepipe-requirements: [TSK-UC-09, TSK-BR-24, TSK-BR-25, TSK-BR-26]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TasksProjectUpdate'
      responses:
        '200':
          description: 更新後のプロジェクト
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksProject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [tasks]
      operationId: tasksDeleteProject
      summary: プロジェクトを削除する
      description: |
        プロジェクトを即時削除する。子プロジェクトと所属するタスクもあわせて削除する（TSK-BR-24。ゴミ箱は後回し）。
        Inbox は削除できず 409 を返す（TSK-BR-01）。
      x-lifepipe-requirements: [TSK-UC-09, TSK-BR-01, TSK-BR-24]
      x-lifepipe-priority: mvp
      responses:
        '204':
          description: 削除した
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tasks/projects/{project_id}/archive:
    parameters:
      - $ref: '#/components/parameters/TasksProjectId'
    post:
      tags: [tasks]
      operationId: tasksArchiveProject
      summary: プロジェクトをアーカイブする
      description: |
        プロジェクトをアーカイブする。アーカイブ中のプロジェクトとそのタスクは読み取り専用になる（TSK-BR-25）。
        すでにアーカイブ済みなら状態を変えずに現在の状態を返す。
      x-lifepipe-requirements: [TSK-UC-14, TSK-BR-25]
      x-lifepipe-priority: later
      responses:
        '200':
          description: アーカイブ後のプロジェクト
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksProject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [tasks]
      operationId: tasksUnarchiveProject
      summary: プロジェクトのアーカイブを解除する
      description: |
        アーカイブを解除し、プロジェクトとそのタスクを再び更新できるようにする（TSK-BR-25）。
        アーカイブされていなければ状態を変えずに現在の状態を返す。
      x-lifepipe-requirements: [TSK-UC-14, TSK-BR-25]
      x-lifepipe-priority: later
      responses:
        '200':
          description: 解除後のプロジェクト
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksProject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/tasks:
    get:
      tags: [tasks]
      operationId: tasksListTasks
      summary: タスクを一覧する
      description: |
        タスクを絞り込み・並べ替えてページ分割で返す（TSK-BR-22）。
        done を省略すると未完了のタスクだけを返す。完了済みを得るには done=true を明示する（TSK-BR-21）。
        ラベル・場所・優先度などで絞り込むとき、その値を持たないタスクは含めない（TSK-BR-20）。
        期限の昇順で並べるとき、期限なしは最後にする（TSK-BR-21）。
        日時の判定は利用者設定のタイムゾーンで行う（TSK-BR-08）。
      x-lifepipe-requirements: [TSK-UC-05, TSK-BR-04, TSK-BR-08, TSK-BR-20, TSK-BR-21, TSK-BR-22]
      x-lifepipe-priority: mvp
      parameters:
        - name: project_id
          in: query
          required: false
          description: 所属プロジェクトで絞り込む。
          schema:
            type: string
            format: uuid
        - name: label_ids
          in: query
          required: false
          description: 指定したラベルのいずれかが付いたタスクだけを返す（カンマ区切り）。ラベルのないタスクは返さない（TSK-BR-20）。
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: location_id
          in: query
          required: false
          description: 外出先の場所で絞り込む。場所のないタスクは返さない（TSK-BR-20）。
          schema:
            type: string
            format: uuid
        - name: done
          in: query
          required: false
          description: 完了状態で絞り込む。省略時は false（未完了のみ）（TSK-BR-21）。
          schema:
            type: boolean
            default: false
        - name: due_from
          in: query
          required: false
          description: 期限がこの日時以降のタスクだけを返す。期限のないタスクは返さない。
          schema:
            type: string
            format: date-time
        - name: due_to
          in: query
          required: false
          description: 期限がこの日時より前のタスクだけを返す。期限のないタスクは返さない。
          schema:
            type: string
            format: date-time
        - name: priority_min
          in: query
          required: false
          description: 優先度がこの値以上のタスクだけを返す。1 以上を指定すると優先度未設定（0）のタスクは返さない（TSK-BR-20）。
          schema:
            type: integer
            minimum: 0
            maximum: 5
        - name: overdue
          in: query
          required: false
          description: true なら期限切れ（is_overdue = true）のタスクだけ、false なら期限切れでないタスクだけを返す（TSK-BR-04）。
          schema:
            type: boolean
        - name: repeating
          in: query
          required: false
          description: true なら繰り返しタスクだけ、false なら単発タスクだけを返す。
          schema:
            type: boolean
        - name: sort_by
          in: query
          required: false
          description: 並べ替えの項目（TSK-BR-21）。
          schema:
            $ref: '#/components/schemas/TasksTaskSortField'
        - name: order
          in: query
          required: false
          description: 昇順・降順（TSK-BR-21）。
          schema:
            $ref: '#/components/schemas/TasksSortOrder'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: タスクの一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksTaskPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [tasks]
      operationId: tasksCreateTask
      summary: タスクを登録する
      description: |
        タスクを登録する。project_id を省略すると利用者設定の既定プロジェクト（初期値は Inbox）に登録する（TSK-BR-01）。
        優先度は 0〜5（TSK-BR-02）、進捗率は 0〜100（TSK-BR-03）。範囲外は 400。
        開始日と終了日の両方があるときは 開始日 ≦ 終了日 でなければ 400（TSK-BR-05）。
        期限に日付だけ（YYYY-MM-DD）を指定すると既定の期限時刻（未設定なら 23:59）を補う（TSK-BR-09）。
        repeat を指定すると繰り返しタスク（定期家事）になる。間隔は 1 時間以上 10 年以下（TSK-BR-16）。
        リマインダーは複数付けられる（TSK-BR-06）。ラベルは ID か名前で指定し、存在しない名前は新規に作成する（TSK-BR-23）。
        アーカイブ中のプロジェクトへの登録は 409（TSK-BR-25）。index はプロジェクト内の連番で自動で振る（TSK-BR-26）。
      x-lifepipe-requirements: [TSK-UC-01, TSK-UC-06, TSK-BR-01, TSK-BR-02, TSK-BR-03, TSK-BR-05, TSK-BR-06, TSK-BR-08, TSK-BR-09, TSK-BR-16, TSK-BR-23, TSK-BR-25, TSK-BR-26]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TasksTaskCreate'
      responses:
        '201':
          description: 登録したタスク
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tasks/tasks/today:
    get:
      tags: [tasks]
      operationId: tasksGetTodayTasks
      summary: 当日が期限のタスクと期限切れのタスクを取得する
      description: |
        get_morning_briefing 用。利用者のタイムゾーンで当日 0:00 以上・翌日 0:00 未満に期限がある未完了タスク（繰り返しタスクを含む）を due_today に、
        期限が当日 0:00 より前の未完了タスクを overdue に分けて返す（TSK-BR-18、TSK-BR-08）。
        完了済みのタスクは含めない（TSK-BR-04）。
      x-lifepipe-requirements: [TSK-UC-07, TSK-BR-04, TSK-BR-08, TSK-BR-18]
      x-lifepipe-priority: mvp
      parameters:
        - name: date
          in: query
          required: false
          description: 基準とする日付。省略時は利用者のタイムゾーンでの今日。
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 当日分と期限切れの2グループ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksTodayTasks'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /tasks/tasks/outing:
    get:
      tags: [tasks]
      operationId: tasksGetOutingTasks
      summary: 外出先タスクを場所ごとに取得する
      description: |
        prepare_outing 用。location が設定された未完了タスクを場所ごとにまとめて返す（TSK-BR-19）。
        場所の中では期限の早い順（期限なしは最後）、同じ期限なら優先度の高い順に並べる。
        location_id を指定するとその場所のタスクだけを返す。
      x-lifepipe-requirements: [TSK-UC-08, TSK-BR-19]
      x-lifepipe-priority: mvp
      parameters:
        - name: location_id
          in: query
          required: false
          description: 指定した場所のタスクだけを返す。
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 場所ごとの外出先タスク
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksOutingTasks'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/tasks/upcoming:
    get:
      tags: [tasks]
      operationId: tasksGetUpcomingTasks
      summary: 今後の期間に期限があるタスクを取得する
      description: |
        from 以上 to 未満に期限がある未完了タスクを期限の早い順に返す。
        include_overdue で期限切れのタスクを、include_no_due で期限のないタスクを含められる。
        日時の判定は利用者設定のタイムゾーンで行う（TSK-BR-08）。
      x-lifepipe-requirements: [TSK-UC-15, TSK-BR-04, TSK-BR-08]
      x-lifepipe-priority: later
      parameters:
        - name: from
          in: query
          required: false
          description: 期間の開始。省略時は利用者のタイムゾーンでの今日の 0:00。
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: 期間の終了（この日時は含まない）。省略時は from の7日後。
          schema:
            type: string
            format: date-time
        - name: include_overdue
          in: query
          required: false
          description: true なら期限切れの未完了タスクも含める。
          schema:
            type: boolean
            default: false
        - name: include_no_due
          in: query
          required: false
          description: true なら期限のない未完了タスクも最後に含める。
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 期間内に期限があるタスク
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksUpcomingTasks'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /tasks/tasks/{task_id}:
    parameters:
      - $ref: '#/components/parameters/TasksTaskId'
    get:
      tags: [tasks]
      operationId: tasksGetTask
      summary: タスクを取得する
      description: |
        タスクを取得する。is_overdue は未完了かつ期限が現在時刻より前なら true（TSK-BR-04）。
        relative リマインダーの remind_at は基準日から計算した値で、基準日が未設定なら null（TSK-BR-06）。
        リマインダーの配信（TSK-UC-16、後回し）は API を持たず、配信側は計算済みの remind_at をこの操作で読む。完了済みのタスクのリマインダーは発火させない（TSK-BR-07）。
      x-lifepipe-requirements: [TSK-UC-02, TSK-UC-16, TSK-BR-04, TSK-BR-06, TSK-BR-07]
      x-lifepipe-priority: mvp
      responses:
        '200':
          description: タスク
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [tasks]
      operationId: tasksUpdateTask
      summary: タスクを更新する
      description: |
        送った項目だけを更新する。完了状態は complete / uncomplete で変える（TSK-BR-10）。
        値の範囲と日付の前後関係は登録と同じ（TSK-BR-02、TSK-BR-03、TSK-BR-05、TSK-BR-09、TSK-BR-16）。
        repeat に null を送ると単発タスクに戻る（TSK-BR-11）。基準日が変わると relative リマインダーの remind_at を再計算する（TSK-BR-06）。
        labels と reminders は送った配列で置き換える。ラベル名で指定された未登録のラベルは新規に作成する（TSK-BR-23）。
        別プロジェクトへ移動すると移動先で新しい index を振る（TSK-BR-26）。
        アーカイブ中のプロジェクトのタスクの更新、アーカイブ中のプロジェクトへの移動は 409（TSK-BR-25）。
      x-lifepipe-requirements: [TSK-UC-02, TSK-UC-06, TSK-BR-02, TSK-BR-03, TSK-BR-05, TSK-BR-06, TSK-BR-09, TSK-BR-11, TSK-BR-16, TSK-BR-23, TSK-BR-25, TSK-BR-26]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TasksTaskUpdate'
      responses:
        '200':
          description: 更新後のタスク
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [tasks]
      operationId: tasksDeleteTask
      summary: タスクを削除する
      description: タスクを即時削除する（ゴミ箱は後回し）。アーカイブ中のプロジェクトのタスクは 409（TSK-BR-25）。
      x-lifepipe-requirements: [TSK-UC-02, TSK-BR-25]
      x-lifepipe-priority: mvp
      responses:
        '204':
          description: 削除した
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tasks/tasks/{task_id}/complete:
    parameters:
      - $ref: '#/components/parameters/TasksTaskId'
    post:
      tags: [tasks]
      operationId: tasksCompleteTask
      summary: タスクを完了にする
      description: |
        単発タスクは done = true、done_at = 完了日時にする。完了済みなら状態を変えずに返す（冪等、TSK-BR-10）。
        繰り返しタスクは未完了のまま次回へ進める: 期限・開始日・終了日・absolute リマインダーを方式（default / from_completion / monthly）に従って進め、
        last_completed_at を更新し、完了履歴を1件作り、説明中のチェックリストを未チェックに戻す（TSK-BR-11〜15）。
        completed_at は省略時は現在時刻。過去は指定でき、未来は 400 で拒否する（TSK-BR-17）。
        完了済みのタスクのリマインダーは発火させない（TSK-BR-07）。アーカイブ中のプロジェクトのタスクは 409（TSK-BR-25）。
      x-lifepipe-requirements: [TSK-UC-03, TSK-UC-06, TSK-BR-07, TSK-BR-10, TSK-BR-11, TSK-BR-12, TSK-BR-13, TSK-BR-14, TSK-BR-15, TSK-BR-17, TSK-BR-25]
      x-lifepipe-priority: mvp
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TasksTaskCompleteRequest'
      responses:
        '200':
          description: 更新後のタスク
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tasks/tasks/{task_id}/uncomplete:
    parameters:
      - $ref: '#/components/parameters/TasksTaskId'
    post:
      tags: [tasks]
      operationId: tasksUncompleteTask
      summary: 完了したタスクを未完了に戻す
      description: |
        done = false、done_at = null にする。未完了のタスクには状態を変えずに現在の状態を返す（冪等、TSK-BR-10）。
        繰り返しタスクは常に未完了のため、状態は変わらない（TSK-BR-11）。アーカイブ中のプロジェクトのタスクは 409（TSK-BR-25）。
      x-lifepipe-requirements: [TSK-UC-04, TSK-BR-10, TSK-BR-11, TSK-BR-25]
      x-lifepipe-priority: mvp
