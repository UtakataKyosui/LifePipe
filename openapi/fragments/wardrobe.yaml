  /wardrobe/available-items:
    get:
      operationId: wardrobeListAvailableItems
      tags: [wardrobe]
      summary: 当日着られる服を役割別に取得する
      description: |
        status=active かつ wash_status=clean の服だけを候補にする（WRD-BR-11）。
        気温は min_temp・max_temp、無ければ気温帯と厚さの対応表で判定し、outerwear は temp_min で帯を決める（WRD-BR-12）。
        季節は気温帯から決め、暦の月は使わない（WRD-BR-13）。
        temp_min < 15℃ または precipitation_probability ≥ 50% なら outerwear を必要とし、雨なら water_resistant を先に並べる（WRD-BR-14）。
        occasion・min_formality で場面を絞る（WRD-BR-15）。役割ごとに last_worn_on の古い順（未着用を先）、同じなら wear_count の少ない順（WRD-BR-16）。
        member_id を省略すると世帯全員の服を返す（WRD-BR-17）。AI が使えない設定でも動く（WRD-BR-21）。
      x-lifepipe-requirements: [WRD-UC-13, WRD-BR-11, WRD-BR-12, WRD-BR-13, WRD-BR-14, WRD-BR-15, WRD-BR-16, WRD-BR-17, WRD-BR-21]
      x-lifepipe-priority: mvp
      parameters:
        - $ref: '#/components/parameters/WardrobeConditionDate'
        - $ref: '#/components/parameters/WardrobeConditionTempMax'
        - $ref: '#/components/parameters/WardrobeConditionTempMin'
        - $ref: '#/components/parameters/WardrobeConditionPrecipitationProbability'
        - $ref: '#/components/parameters/WardrobeConditionOccasion'
        - $ref: '#/components/parameters/WardrobeConditionMinFormality'
        - name: member_id
          in: query
          description: 指定したメンバーの服だけを返す（WRD-BR-17）
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 役割別の候補
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeAvailableItems'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

