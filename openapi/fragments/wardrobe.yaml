# wardrobe fragment
paths:
  /wardrobe/households/{household_id}:
    parameters:
      - $ref: '#/components/parameters/WardrobeHouseholdId'
    get:
      operationId: wardrobeGetHousehold
      tags: [wardrobe]
      summary: 世帯を取得する
      description: |
        利用者が所属する世帯を返す。別の世帯は 404（WRD-BR-01）。
        世帯の作成は利用開始時に行うため、この API には無い。
      x-lifepipe-requirements: [WRD-UC-01, WRD-BR-01]
      x-lifepipe-priority: mvp
      responses:
        '200':
          description: 世帯
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeHousehold'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: wardrobeUpdateHousehold
      tags: [wardrobe]
      summary: 世帯を更新する
      description: 送った項目だけを更新する。別の世帯は 404（WRD-BR-01）。
      x-lifepipe-requirements: [WRD-UC-01, WRD-BR-01]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WardrobeHouseholdUpdate'
      responses:
        '200':
          description: 更新後の世帯
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeHousehold'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /wardrobe/households/{household_id}/members:
    parameters:
      - $ref: '#/components/parameters/WardrobeHouseholdId'
    get:
      operationId: wardrobeListMembers
      tags: [wardrobe]
      summary: 世帯メンバーを一覧する
      description: ログインしない家族（user_id が空）も含めて返す（WRD-UC-01）。
      x-lifepipe-requirements: [WRD-UC-01, WRD-BR-01]
      x-lifepipe-priority: mvp
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: メンバーの一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeMemberPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: wardrobeCreateMember
      tags: [wardrobe]
      summary: 世帯メンバーを登録する
      description: ログインしない家族は user_id を省略する（WRD-UC-01）。
      x-lifepipe-requirements: [WRD-UC-01]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WardrobeMemberCreate'
      responses:
        '201':
          description: 作成したメンバー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /wardrobe/households/{household_id}/members/{member_id}:
    parameters:
      - $ref: '#/components/parameters/WardrobeHouseholdId'
      - $ref: '#/components/parameters/WardrobeMemberId'
    get:
      operationId: wardrobeGetMember
      tags: [wardrobe]
      summary: 世帯メンバーを取得する
      x-lifepipe-requirements: [WRD-UC-01, WRD-BR-01]
      x-lifepipe-priority: mvp
      responses:
        '200':
          description: メンバー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: wardrobeUpdateMember
      tags: [wardrobe]
      summary: 世帯メンバーを更新する
      x-lifepipe-requirements: [WRD-UC-01, WRD-BR-01]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WardrobeMemberUpdate'
      responses:
        '200':
          description: 更新後のメンバー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: wardrobeDeleteMember
      tags: [wardrobe]
      summary: 世帯メンバーを削除する
      description: 衣服を持つメンバーは削除できず 409 を返す（WRD-UC-01、WRD-BR-01）。
      x-lifepipe-requirements: [WRD-UC-01, WRD-BR-01]
      x-lifepipe-priority: mvp
      responses:
        '204':
          description: 削除した
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /wardrobe/items:
    get:
      operationId: wardrobeListItems
      tags: [wardrobe]
      summary: 衣服を一覧・検索する
      description: |
        利用者の世帯の衣服を返す（WRD-BR-01）。status の既定は active で、アーカイブ済みは既定の絞り込みから外れる（WRD-BR-22）。
        要洗濯・洗濯中の一覧は `wash_status=needs_wash,in_laundry` で取る（WRD-UC-12）。
      x-lifepipe-requirements: [WRD-UC-03, WRD-UC-12, WRD-BR-01, WRD-BR-22]
      x-lifepipe-priority: mvp
      parameters:
        - name: owner_member_id
          in: query
          description: 持ち主で絞り込む
          schema:
            type: string
            format: uuid
        - name: category
          in: query
          description: 種類で絞り込む
          schema:
            $ref: '#/components/schemas/WardrobeCategory'
        - name: season
          in: query
          description: 季節で絞り込む（seasons が空の通年の服も含む）
          schema:
            $ref: '#/components/schemas/WardrobeSeason'
        - name: occasion
          in: query
          description: 場面で絞り込む
          schema:
            $ref: '#/components/schemas/WardrobeOccasion'
        - name: wash_status
          in: query
          description: 洗濯ステータスで絞り込む（カンマ区切りで複数指定）
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/WardrobeWashStatus'
        - name: status
          in: query
          description: 所持状態で絞り込む。既定は active
          schema:
            $ref: '#/components/schemas/WardrobeItemStatus'
        - name: color
          in: query
          description: 色で絞り込む（colors のいずれかに一致）
          schema:
            type: string
            maxLength: 50
        - name: q
          in: query
          description: 名前の部分一致
          schema:
            type: string
            maxLength: 200
        - name: sort
          in: query
          description: 並べ替え。先頭に `-` を付けると降順
          schema:
            $ref: '#/components/schemas/WardrobeItemSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 衣服の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeItemPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: wardrobeCreateItem
      tags: [wardrobe]
      summary: 衣服を登録する
      description: |
        画像は任意で、登録後に別途アップロードする（WRD-UC-02）。
        wears_before_wash を省略すると category の既定値になる（WRD-BR-04）。
        購入の振り分けからの登録は source=purchase と Idempotency-Key を付ける。wash_status=clean、wears_since_wash=0 で登録し、
        同じキーの再送には 24 時間同じ結果を返す。category を判断できない品目は other で登録する（WRD-UC-14、WRD-BR-23）。
        warmth・formality は 1〜5、min_temp ≤ max_temp でなければ 422（WRD-BR-24）。
      x-lifepipe-requirements: [WRD-UC-02, WRD-UC-14, WRD-BR-01, WRD-BR-03, WRD-BR-04, WRD-BR-23, WRD-BR-24]
      x-lifepipe-priority: mvp
      parameters:
        - $ref: '#/components/parameters/WardrobeIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WardrobeItemCreate'
      responses:
        '201':
          description: 登録した衣服（同じ Idempotency-Key の再送では最初の結果）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /wardrobe/items/{item_id}:
    parameters:
      - $ref: '#/components/parameters/WardrobeItemId'
    get:
      operationId: wardrobeGetItem
      tags: [wardrobe]
      summary: 衣服の詳細を取得する
      description: 別の世帯の衣服は 404（WRD-BR-01）。
      x-lifepipe-requirements: [WRD-UC-04, WRD-BR-01]
      x-lifepipe-priority: mvp
      responses:
        '200':
          description: 衣服
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: wardrobeUpdateItem
      tags: [wardrobe]
      summary: 衣服の属性を編集する
      description: |
        送った項目だけを更新する。回数・洗濯関係の読み取り専用項目、wash_status、status、source は変えられない。
        wears_before_wash を 0 から 1 以上に変えたら wears_since_wash を 0 から数え直す（WRD-BR-03）。
        warmth・formality は 1〜5、min_temp ≤ max_temp でなければ 422（WRD-BR-24）。
      x-lifepipe-requirements: [WRD-UC-04, WRD-BR-01, WRD-BR-03, WRD-BR-04, WRD-BR-24]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WardrobeItemUpdate'
      responses:
        '200':
          description: 更新後の衣服
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: wardrobeDeleteItem
      tags: [wardrobe]
      summary: 誤登録の衣服を削除する
      description: 着用記録から参照されている服は 409 を返し、アーカイブを促す（WRD-UC-05、WRD-BR-22）。
      x-lifepipe-requirements: [WRD-UC-05, WRD-BR-01, WRD-BR-22]
      x-lifepipe-priority: mvp
      responses:
        '204':
          description: 削除した
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /wardrobe/items/{item_id}/archive:
    parameters:
      - $ref: '#/components/parameters/WardrobeItemId'
    post:
      operationId: wardrobeArchiveItem
      tags: [wardrobe]
      summary: 手放した衣服をアーカイブする
      description: status=archived にし、archived_at を記録する。着用履歴と集計には残る（WRD-BR-22）。
      x-lifepipe-requirements: [WRD-UC-05, WRD-BR-22]
      x-lifepipe-priority: mvp
      responses:
        '200':
          description: アーカイブ後の衣服
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: wardrobeUnarchiveItem
      tags: [wardrobe]
      summary: アーカイブした衣服を元に戻す
      description: status=active、archived_at を空にする。洗濯ステータスと回数は保つ（WRD-BR-22）。
      x-lifepipe-requirements: [WRD-UC-05, WRD-BR-22]
      x-lifepipe-priority: mvp
      responses:
        '200':
          description: 元に戻した衣服
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /wardrobe/items/{item_id}/images:
    parameters:
      - $ref: '#/components/parameters/WardrobeItemId'
    get:
      operationId: wardrobeListItemImages
      tags: [wardrobe]
      summary: 衣服の画像を一覧する
      description: 各画像に有効期限 1 時間の url を取得のたびに発行して含める。保存先のキーは返さない（WRD-BR-19）。
      x-lifepipe-requirements: [WRD-UC-06, WRD-UC-07, WRD-BR-01, WRD-BR-19]
      x-lifepipe-priority: mvp
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 画像の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeItemImagePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: wardrobeUploadItemImage
      tags: [wardrobe]
      summary: 衣服の画像をアップロードする
      description: |
        jpeg・png・webp を受け付け、1枚 50MB 以下。超えたら 413、形式が違えば 415。
        同期で元画像（kind=original）を保存し、保存できた時点で応答する。1着 10 枚までで、超えると 422（WRD-BR-18）。
        AI・背景除去が使えない設定でも動く（WRD-BR-21）。
      x-lifepipe-requirements: [WRD-UC-06, WRD-UC-07, WRD-BR-18, WRD-BR-19, WRD-BR-21]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WardrobeItemImageUpload'
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: 保存した元画像
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeItemImage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: 画像が 50MB を超えている（WRD-BR-18）
        '415':
          description: jpeg・png・webp 以外の形式（WRD-BR-18）
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /wardrobe/items/{item_id}/images/{image_id}:
    parameters:
      - $ref: '#/components/parameters/WardrobeItemId'
      - $ref: '#/components/parameters/WardrobeImageId'
    get:
      operationId: wardrobeGetItemImage
      tags: [wardrobe]
      summary: 衣服の画像を取得する
      description: 有効期限 1 時間の url を取得のたびに発行して返す（WRD-UC-07、WRD-BR-19）。
      x-lifepipe-requirements: [WRD-UC-06, WRD-UC-07, WRD-BR-01, WRD-BR-19]
      x-lifepipe-priority: mvp
      responses:
        '200':
          description: 画像
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeItemImage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: wardrobeDeleteItemImage
      tags: [wardrobe]
      summary: 衣服の画像を削除する
      description: 一覧に出す画像（primary）を消したら primary_image_id を空にする（WRD-UC-06）。
      x-lifepipe-requirements: [WRD-UC-06, WRD-BR-01]
      x-lifepipe-priority: mvp
      responses:
        '204':
          description: 削除した
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /wardrobe/items/{item_id}/primary-image:
    parameters:
      - $ref: '#/components/parameters/WardrobeItemId'
    put:
      operationId: wardrobeSetPrimaryImage
      tags: [wardrobe]
      summary: 一覧に出す画像を選ぶ
      description: 指定した画像はこの衣服のものでなければならない（違えば 404。WRD-BR-01）。
      x-lifepipe-requirements: [WRD-UC-06, WRD-BR-01]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WardrobePrimaryImageSet'
      responses:
        '200':
          description: 更新後の衣服
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /wardrobe/items/{item_id}/wash-status:
    parameters:
      - $ref: '#/components/parameters/WardrobeItemId'
    post:
      operationId: wardrobeChangeWashStatus
      tags: [wardrobe]
      summary: 洗濯ステータスを変更する
      description: |
        遷移は WRD-BR-02 のとおり。mark_dirty は clean / in_laundry → needs_wash（trigger=manual）、
        send_to_laundry は clean / needs_wash → in_laundry（manual）、
        mark_washed は needs_wash / in_laundry / clean → clean（trigger=washed。wears_since_wash=0、last_washed_at=現在時刻）。
        遷移できない組み合わせは 409。どの遷移でも WashLog を1件残す。
        wears_before_wash が 0 の服は洗濯管理の対象外で 422（WRD-BR-03）。
      x-lifepipe-requirements: [WRD-UC-11, WRD-BR-02, WRD-BR-03]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WardrobeWashStatusChange'
      responses:
        '200':
          description: 変更後の衣服
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /wardrobe/wash-status/batch:
    post:
      operationId: wardrobeBatchChangeWashStatus
      tags: [wardrobe]
      summary: 複数着の洗濯ステータスをまとめて変更する
      description: |
        遷移は WRD-BR-02。1件でも遷移できなければ全体を 409 にし、何も変更しない。
        wears_before_wash が 0 の服を含むと 422（WRD-BR-03）。別の世帯の服を含むと 404（WRD-BR-01）。
      x-lifepipe-requirements: [WRD-UC-11, WRD-BR-01, WRD-BR-02, WRD-BR-03]
      x-lifepipe-priority: mvp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WardrobeWashStatusBatchChange'
      responses:
        '200':
          description: 変更後の衣服
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeWashStatusBatchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /wardrobe/items/{item_id}/wash-logs:
    parameters:
      - $ref: '#/components/parameters/WardrobeItemId'
    get:
      operationId: wardrobeListWashLogs
      tags: [wardrobe]
      summary: 衣服の洗濯記録を一覧する
      description: changed_at の新しい順に返す（WRD-BR-02）。
      x-lifepipe-requirements: [WRD-UC-11, WRD-BR-01, WRD-BR-02]
      x-lifepipe-priority: mvp
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 洗濯記録の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeWashLogPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /wardrobe/wear-logs:
    get:
      operationId: wardrobeListWearLogs
      tags: [wardrobe]
      summary: 着用履歴を期間で一覧する
      description: カレンダー表示は from・to（両端を含む）で期間を取る（WRD-UC-09）。
      x-lifepipe-requirements: [WRD-UC-09, WRD-BR-01]
      x-lifepipe-priority: mvp
      parameters:
        - name: member_id
          in: query
          description: 着た人で絞り込む
          schema:
