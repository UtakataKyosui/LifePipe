      name: item_id
      in: path
      required: true
      description: 衣服 ID
      schema:
        type: string
        format: uuid
    WardrobeImageId:
      name: image_id
      in: path
      required: true
      description: 画像 ID
      schema:
        type: string
        format: uuid
    WardrobeWearLogId:
      name: wear_log_id
      in: path
      required: true
      description: 着用記録 ID
      schema:
        type: string
        format: uuid
    WardrobeJobId:
      name: job_id
      in: path
      required: true
      description: 画像処理ジョブ ID
      schema:
        type: string
        format: uuid
    WardrobeOutfitId:
      name: outfit_id
      in: path
      required: true
      description: コーディネート ID
      schema:
        type: string
        format: uuid
    WardrobeSuggestionId:
      name: suggestion_id
      in: path
      required: true
      description: コーディネート提案 ID
      schema:
        type: string
        format: uuid
    WardrobeIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 購入の振り分けからの登録で付ける冪等キー。24 時間、同じキーの再送に同じ結果を返す（WRD-BR-23）
      schema:
        type: string
        minLength: 1
        maxLength: 255
    WardrobeConditionDate:
      name: date
      in: query
      required: true
      description: 対象の日付
      schema:
        type: string
        format: date
    WardrobeConditionTempMax:
      name: temp_max
      in: query
      required: true
      description: 当日の最高気温（℃）
      schema:
        type: number
        minimum: -60
        maximum: 60
    WardrobeConditionTempMin:
      name: temp_min
      in: query
      required: true
      description: 当日の最低気温（℃）。temp_max 以下
      schema:
        type: number
        minimum: -60
        maximum: 60
    WardrobeConditionPrecipitationProbability:
      name: precipitation_probability
      in: query
      required: false
      description: 降水確率（%）。省略時は 0
      schema:
        type: integer
        minimum: 0
        maximum: 100
        default: 0
    WardrobeConditionOccasion:
      name: occasion
      in: query
      required: true
      description: 予定から決めた場面。予定が無く在宅なら home、外出で場面が分からなければ casual（WRD-BR-15）
      schema:
        $ref: '#/components/schemas/WardrobeOccasion'
    WardrobeConditionMinFormality:
      name: min_formality
      in: query
      required: false
      description: これ以上の formality の服に絞る（WRD-BR-15）
      schema:
        type: integer
        minimum: 1
        maximum: 5

  schemas:
    # ---- enums ----
    WardrobeCategory:
      type: string
      description: 衣服の種類
      enum: [top, bottom, one_piece, outerwear, innerwear, shoes, accessory, bag, other]
    WardrobeSeason:
      type: string
      enum: [spring, summer, autumn, winter]
    WardrobeOccasion:
      type: string
      description: 場面
      enum: [casual, work, formal, sport, home]
    WardrobeWashStatus:
      type: string
      description: 洗濯ステータス（WRD-BR-02）
      enum: [clean, needs_wash, in_laundry]
    WardrobeItemStatus:
      type: string
      description: 所持状態
      enum: [active, archived]
    WardrobeItemSource:
      type: string
      description: 登録の経路
      enum: [manual, purchase, import]
    WardrobeItemSort:
      type: string
      description: 衣服一覧の並べ替え。先頭の `-` は降順
      enum: [last_worn_on, -last_worn_on, wear_count, -wear_count, created_at, -created_at]
    WardrobeImageKind:
      type: string
      description: 画像の種類。MVP は original だけを作る
      enum: [original, thumbnail, background_removed]
    WardrobeImageContentType:
      type: string
      enum: [image/jpeg, image/png, image/webp]
    WardrobeImageJobType:
      type: string
      enum: [thumbnail, background_removal, ai_tagging]
    WardrobeJobStatus:
      type: string
      description: 非同期処理の状態（WRD-BR-20）
      enum: [pending, running, succeeded, failed]
    WardrobeWashTrigger:
      type: string
      description: 洗濯ステータス変更のきっかけ
      enum: [wear_threshold, manual, washed]
    WardrobeWashAction:
      type: string
      description: |
        mark_dirty: 要洗濯にする / send_to_laundry: 洗濯に出す / mark_washed: 洗濯済みにする（WRD-BR-02）
      enum: [mark_dirty, send_to_laundry, mark_washed]
    WardrobeOutfitSource:
      type: string
      enum: [manual, ai_suggestion, pairing]
    WardrobeOutfitFeedback:
      type: string
      enum: [none, accepted, rejected]
    WardrobeOutfitFeedbackValue:
      type: string
      description: 提案への反応として送れる値
      enum: [accepted, rejected]

    # ---- Household ----
    WardrobeHousehold:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: サンプル家
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WardrobeHouseholdUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    # ---- Member ----
    WardrobeMember:
      type: object
      required: [id, household_id, display_name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        user_id:
          type: string
          nullable: true
          description: LifePipe の認証で使う利用者 ID。ログインしない家族は null
        display_name:
          type: string
          minLength: 1
          maxLength: 100
          example: メンバーA
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WardrobeMemberCreate:
      type: object
      required: [display_name]
      properties:
        user_id:
          type: string
          nullable: true
        display_name:
          type: string
          minLength: 1
          maxLength: 100
    WardrobeMemberUpdate:
      type: object
      properties:
        user_id:
          type: string
          nullable: true
        display_name:
          type: string
          minLength: 1
          maxLength: 100
    WardrobeMemberPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WardrobeMember'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    # ---- Item ----
    WardrobeItem:
      type: object
      required:
        - id
        - household_id
        - owner_member_id
        - name
        - category
        - warmth
        - water_resistant
        - wash_status
        - wears_before_wash
        - wears_since_wash
        - wear_count
        - status
        - source
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        owner_member_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: 紺のシャツ
        category:
          $ref: '#/components/schemas/WardrobeCategory'
        subcategory:
          type: string
          nullable: true
          maxLength: 100
        colors:
          type: array
          description: 色。先頭を主な色とする
          items:
            type: string
            maxLength: 50
          example: [navy, white]
        pattern:
          type: string
          nullable: true
          maxLength: 100
        material:
          type: string
          nullable: true
          maxLength: 100
        brand:
          type: string
          nullable: true
          maxLength: 100
        size:
          type: string
          nullable: true
          maxLength: 50
        seasons:
          type: array
          description: 着る季節。空は通年
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WardrobeSeason'
        warmth:
          type: integer
          minimum: 1
          maximum: 5
          description: 厚さ・暖かさ。1（薄手）〜5（厚手）
        min_temp:
          type: number
          nullable: true
          description: 着られる最低気温（℃）。max_temp 以下（WRD-BR-24）
        max_temp:
          type: number
          nullable: true
          description: 着られる最高気温（℃）
        water_resistant:
          type: boolean
        occasions:
          type: array
          description: 向いている場面。空は casual と home だけとみなす
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WardrobeOccasion'
        formality:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
          description: フォーマル度。1（部屋着）〜5（礼装）
        notes:
          type: string
          nullable: true
          maxLength: 2000
        wash_status:
          $ref: '#/components/schemas/WardrobeWashStatus'
        wears_before_wash:
          type: integer
          minimum: 0
          maximum: 99
          description: 洗濯が必要になるまでの着用回数。0 は洗濯管理の対象外（WRD-BR-03、WRD-BR-04）
        wears_since_wash:
          type: integer
          minimum: 0
          readOnly: true
        wear_count:
          type: integer
          minimum: 0
          readOnly: true
        last_worn_on:
          type: string
          format: date
          nullable: true
          readOnly: true
        last_washed_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        status:
          $ref: '#/components/schemas/WardrobeItemStatus'
        archived_at:
          type: string
          format: date-time
          nullable: true
        primary_image_id:
          type: string
          format: uuid
          nullable: true
        source:
          $ref: '#/components/schemas/WardrobeItemSource'
        purchased_on:
          type: string
          format: date
          nullable: true
        purchase_price:
          type: string
          nullable: true
          pattern: '^-?\d+(\.\d{1,4})?$'
          description: 購入価格（10進数の文字列）
          example: '3990'
        currency:
          type: string
          nullable: true
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 の通貨コード
          example: JPY
        store:
          type: string
          nullable: true
          maxLength: 200
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WardrobeItemCreate:
      type: object
      required: [owner_member_id, name, category]
      properties:
        owner_member_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        category:
          $ref: '#/components/schemas/WardrobeCategory'
        subcategory:
          type: string
          nullable: true
          maxLength: 100
        colors:
          type: array
          items:
            type: string
            maxLength: 50
        pattern:
          type: string
          nullable: true
          maxLength: 100
        material:
          type: string
          nullable: true
          maxLength: 100
        brand:
          type: string
          nullable: true
          maxLength: 100
        size:
          type: string
          nullable: true
          maxLength: 50
        seasons:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WardrobeSeason'
        warmth:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
        min_temp:
          type: number
          nullable: true
        max_temp:
          type: number
          nullable: true
        water_resistant:
          type: boolean
          default: false
        occasions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WardrobeOccasion'
        formality:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
        notes:
          type: string
          nullable: true
          maxLength: 2000
        wears_before_wash:
          type: integer
          minimum: 0
          maximum: 99
          description: 省略時は category の既定値（WRD-BR-04）
        source:
          $ref: '#/components/schemas/WardrobeItemSource'
        purchased_on:
          type: string
          format: date
          nullable: true
        purchase_price:
          type: string
          nullable: true
          pattern: '^-?\d+(\.\d{1,4})?$'
        currency:
          type: string
          nullable: true
          pattern: '^[A-Z]{3}$'
        store:
          type: string
          nullable: true
          maxLength: 200
    WardrobeItemUpdate:
      type: object
      description: 送った項目だけを更新する。回数・洗濯関係・status・source は含めない
      properties:
        owner_member_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        category:
          $ref: '#/components/schemas/WardrobeCategory'
        subcategory:
          type: string
          nullable: true
          maxLength: 100
        colors:
          type: array
          items:
            type: string
            maxLength: 50
        pattern:
          type: string
          nullable: true
          maxLength: 100
        material:
          type: string
          nullable: true
          maxLength: 100
        brand:
          type: string
          nullable: true
          maxLength: 100
        size:
          type: string
          nullable: true
          maxLength: 50
        seasons:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WardrobeSeason'
        warmth:
          type: integer
          minimum: 1
          maximum: 5
        min_temp:
          type: number
          nullable: true
        max_temp:
          type: number
          nullable: true
        water_resistant:
          type: boolean
        occasions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WardrobeOccasion'
        formality:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
        notes:
          type: string
          nullable: true
          maxLength: 2000
        wears_before_wash:
          type: integer
          minimum: 0
          maximum: 99
        purchased_on:
          type: string
          format: date
          nullable: true
        purchase_price:
          type: string
          nullable: true
          pattern: '^-?\d+(\.\d{1,4})?$'
        currency:
          type: string
          nullable: true
          pattern: '^[A-Z]{3}$'
        store:
          type: string
          nullable: true
          maxLength: 200
    WardrobeItemPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WardrobeItem'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    # ---- ItemImage ----
    WardrobeItemImage:
      type: object
      description: 衣服の画像。保存先のキーは返さない（WRD-BR-19）
      required: [id, item_id, kind, content_type, byte_size, url, url_expires_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/WardrobeImageKind'
        source_image_id:
          type: string
          format: uuid
          nullable: true
          description: 加工元の画像（thumbnail・background_removed のとき）
        content_type:
          $ref: '#/components/schemas/WardrobeImageContentType'
        byte_size:
          type: integer
          minimum: 1
          maximum: 52428800
        width:
          type: integer
          nullable: true
          minimum: 1
        height:
          type: integer
          nullable: true
          minimum: 1
        url:
          type: string
          format: uri
          description: 有効期限付きの取得 URL。取得のたびに発行する
        url_expires_at:
          type: string
          format: date-time
          description: url の有効期限（発行から 1 時間）
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WardrobeItemImageUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: jpeg・png・webp、50MB 以下（WRD-BR-18）
    WardrobeItemImagePage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WardrobeItemImage'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    WardrobePrimaryImageSet:
      type: object
      required: [image_id]
      properties:
        image_id:
          type: string
          format: uuid

    # ---- ImageJob ----
    WardrobeImageJob:
      type: object
      required: [id, item_id, image_id, type, status, attempts, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        image_id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/WardrobeImageJobType'
        status:
          $ref: '#/components/schemas/WardrobeJobStatus'
        attempts:
          type: integer
          minimum: 0
          maximum: 3
          description: 試行回数。failed は最大 3 回まで再試行する（WRD-BR-20）
        error_message:
          type: string
          nullable: true
          description: 失敗の理由。個人のデータを含めない（WRD-BR-25）
        result_image_id:
          type: string
          format: uuid
          nullable: true
        suggested_attributes:
          type: string
          nullable: true
          description: AI が提案した属性（JSON 文字列。ai_tagging のとき）
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WardrobeTaggingAccept:
      type: object
      required: [job_id, attributes]
      properties:
        job_id:
          type: string
          format: uuid
          description: 承認する ai_tagging ジョブ
        attributes:
          $ref: '#/components/schemas/WardrobeItemUpdate'

    # ---- Wash ----
    WardrobeWashStatusChange:
      type: object
      required: [action]
      properties:
        action:
          $ref: '#/components/schemas/WardrobeWashAction'
    WardrobeWashStatusBatchChange:
      type: object
      required: [item_ids, action]
      properties:
        item_ids:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items:
            type: string
            format: uuid
        action:
          $ref: '#/components/schemas/WardrobeWashAction'
    WardrobeWashStatusBatchResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WardrobeItem'
    WardrobeWashLog:
      type: object
      required: [id, item_id, from_status, to_status, trigger, changed_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        from_status:
          $ref: '#/components/schemas/WardrobeWashStatus'
        to_status:
          $ref: '#/components/schemas/WardrobeWashStatus'
        trigger:
          $ref: '#/components/schemas/WardrobeWashTrigger'
        changed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WardrobeWashLogPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WardrobeWashLog'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    # ---- WearLog ----
    WardrobeWearLog:
      type: object
      required: [id, household_id, member_id, worn_on, item_ids, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        worn_on:
          type: string
          format: date
        item_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        outfit_id:
          type: string
          format: uuid
          nullable: true
          description: 元にしたコーディネート（後回し）
        occasion:
          allOf:
            - $ref: '#/components/schemas/WardrobeOccasion'
          type: string
          nullable: true
        rating:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
        note:
          type: string
          nullable: true
          maxLength: 2000
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WardrobeWearLogCreate:
      type: object
      required: [member_id, worn_on, item_ids]
      properties:
        member_id:
          type: string
          format: uuid
        worn_on:
          type: string
          format: date
          description: 未来の日付は 422（WRD-BR-10）
        item_ids:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid
        outfit_id:
          type: string
          format: uuid
          nullable: true
        occasion:
          $ref: '#/components/schemas/WardrobeOccasion'
        rating:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
        note:
          type: string
          nullable: true
          maxLength: 2000
    WardrobeWearLogUpdate:
      type: object
      properties:
        member_id:
          type: string
          format: uuid
        worn_on:
          type: string
          format: date
        item_ids:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid
        outfit_id:
          type: string
          format: uuid
          nullable: true
        occasion:
          allOf:
            - $ref: '#/components/schemas/WardrobeOccasion'
          type: string
          nullable: true
        rating:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
        note:
          type: string
          nullable: true
          maxLength: 2000
    WardrobeWearLogPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WardrobeWearLog'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    # ---- Available items ----
    WardrobeAvailableItems:
      type: object
      description: 役割別の候補。各配列は last_worn_on の古い順（未着用を先）、同じなら wear_count の少ない順（WRD-BR-16）
      required: [date, seasons, outerwear_required, top, bottom, one_piece, outerwear, shoes, accessory]
      properties:
        date:
          type: string
          format: date
        seasons:
          type: array
          description: 気温帯から決めた当日の季節（WRD-BR-13）
          items:
            $ref: '#/components/schemas/WardrobeSeason'
        outerwear_required:
          type: boolean
          description: outerwear が必要か（WRD-BR-14）
        top:
          type: array
          description: top と innerwear
          items:
            $ref: '#/components/schemas/WardrobeItem'
        bottom:
          type: array
          items:
            $ref: '#/components/schemas/WardrobeItem'
        one_piece:
          type: array
          items:
            $ref: '#/components/schemas/WardrobeItem'
        outerwear:
          type: array
          description: 降水確率 50% 以上なら water_resistant=true を先に並べる
          items:
            $ref: '#/components/schemas/WardrobeItem'
        shoes:
          type: array
          items:
            $ref: '#/components/schemas/WardrobeItem'
        accessory:
          type: array
          description: accessory・bag・other
          items:
            $ref: '#/components/schemas/WardrobeItem'

    # ---- Outfit ----
    WardrobeOutfit:
      type: object
      required: [id, household_id, member_id, item_ids, source, feedback, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
          maxLength: 200
          example: 週末のカジュアル
        item_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        occasion:
          allOf:
            - $ref: '#/components/schemas/WardrobeOccasion'
          type: string
          nullable: true
        source:
          $ref: '#/components/schemas/WardrobeOutfitSource'
        feedback:
          $ref: '#/components/schemas/WardrobeOutfitFeedback'
        feedback_note:
          type: string
          nullable: true
          maxLength: 2000
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WardrobeOutfitCreate:
      type: object
      required: [member_id, item_ids]
      properties:
        member_id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
          maxLength: 200
        item_ids:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid
        occasion:
          $ref: '#/components/schemas/WardrobeOccasion'
    WardrobeOutfitUpdate:
      type: object
      properties:
        name:
          type: string
          nullable: true
          maxLength: 200
        item_ids:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid
        occasion:
          allOf:
            - $ref: '#/components/schemas/WardrobeOccasion'
          type: string
          nullable: true
    WardrobeOutfitPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WardrobeOutfit'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    # ---- Outfit suggestion ----
    WardrobeOutfitSuggestionCreate:
      type: object
      description: 条件は available-items と同じ（WRD-BR-11〜17）にメモを加えたもの
      required: [member_id, date, temp_max, temp_min, occasion]
      properties:
        member_id:
          type: string
          format: uuid
          description: 着る人
        date:
          type: string
          format: date
        temp_max:
          type: number
          minimum: -60
          maximum: 60
        temp_min:
          type: number
          minimum: -60
          maximum: 60
        precipitation_probability:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
        occasion:
          $ref: '#/components/schemas/WardrobeOccasion'
        min_formality:
          type: integer
          minimum: 1
          maximum: 5
        note:
          type: string
          maxLength: 1000
          description: 提案に添えるメモ（例「歩く距離が長い」）
    WardrobeOutfitSuggestion:
      type: object
      required: [id, member_id, status, outfits, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/WardrobeJobStatus'
        outfits:
          type: array
          description: succeeded のとき、source=ai_suggestion のコーディネート
          items:
            $ref: '#/components/schemas/WardrobeOutfit'
        error_message:
          type: string
          nullable: true
          description: 失敗の理由。個人のデータを含めない（WRD-BR-25）
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WardrobeOutfitFeedbackCreate:
      type: object
      required: [outfit_id, feedback]
      properties:
        outfit_id:
          type: string
          format: uuid
        feedback:
          $ref: '#/components/schemas/WardrobeOutfitFeedbackValue'
        feedback_note:
          type: string
          nullable: true
          maxLength: 2000

    # ---- Pairing ----
    WardrobePairingCreate:
      type: object
      properties:
        member_id:
          type: string
          format: uuid
          description: 着る人。省略時は起点の服の持ち主
        occasion:
          $ref: '#/components/schemas/WardrobeOccasion'
        count:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
          description: 作る組み合わせの数
    WardrobePairingResult:
      type: object
      required: [base_item_id, outfits]
      properties:
        base_item_id:
          type: string
          format: uuid
        outfits:
          type: array
          description: source=pairing のコーディネート
          items:
            $ref: '#/components/schemas/WardrobeOutfit'

    # ---- Stats ----
    WardrobeStats:
      type: object
      required: [most_worn, unworn_items, color_distribution]
      properties:
        from:
          type: string
          format: date
          nullable: true
        to:
          type: string
          format: date
          nullable: true
        most_worn:
          type: array
          description: 期間内の着用回数の多い順
          items:
            $ref: '#/components/schemas/WardrobeItemWearCount'
        unworn_items:
          type: array
          description: 期間内に着ていない active の服
          items:
            $ref: '#/components/schemas/WardrobeItem'
        color_distribution:
          type: array
          description: 主な色（colors の先頭）ごとの服の数
          items:
            $ref: '#/components/schemas/WardrobeColorCount'
    WardrobeItemWearCount:
      type: object
      required: [item_id, wear_count]
      properties:
        item_id:
          type: string
          format: uuid
        wear_count:
          type: integer
          minimum: 0
    WardrobeColorCount:
      type: object
      required: [color, item_count]
      properties:
        color:
          type: string
        item_count:
          type: integer
          minimum: 0
