    post:
      operationId: wardrobeCreateWearLog
      tags: [wardrobe]
      summary: 着た服を記録する
      description: |
        含まれる服ごとに wear_count と wears_since_wash を 1 増やし、last_worn_on を更新する。
        wears_since_wash ≥ wears_before_wash（≥ 1）になった clean の服は needs_wash にする（WRD-BR-05）。
        同じメンバー・同じ日に既に記録した服は数えない（WRD-BR-06）。
        worn_on が last_washed_at の日付より前なら wear_count だけ増やす（WRD-BR-07）。
        in_laundry・アーカイブ済みの服は 409（WRD-BR-09）。worn_on が未来なら 422、item_ids は1件以上で同じ世帯のもの（WRD-BR-10）。
        rating は 1〜5（WRD-BR-24）。
